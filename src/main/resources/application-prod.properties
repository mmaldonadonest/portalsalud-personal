# Perfil PROD - el WAR es AUTOSUFICIENTE: toda la configuracion viaja dentro de el.
#
# Sin setenv ni variables de entorno el portal arranca con estos valores (decision 14-oct-2026).
# Motivo: el 27-sep-2026 un placeholder en setenv.bat + Hikari sin configurar bloquearon la
# cuenta BIOMETRICO en produccion. Por eso aqui NO hay ${VARIABLE:...} de entorno.
#
# Los valores marcados @...@ los mete Maven al empaquetar con -Pprod, desde
# config/produccion/portal-salud.local.properties (repo privado). Sin -Pprod quedan VACIOS y el
# WAR no conecta a produccion: falla hacia lo inofensivo. Instrucciones de build: README.md.
#
# RUTAS DEL SERVIDOR (19-oct-2026): las dos llaves de abajo marcadas [configurable] traen aqui su
# valor por defecto y cada servidor puede reescribirlas sin rearmar el WAR. Orden (gana el primero):
#   1. XML del contexto de Tomcat: conf/Catalina/localhost/portal-salud.xml  <Parameter .../>
#   2. bin/setenv.sh: -Dportal.files.root=... en CATALINA_OPTS (o variable PORTAL_FILES_ROOT)
#   3. este archivo (default)
# El log de arranque (bloque BASE DE DATOS ACTIVA) imprime el valor tomado y de donde salio.

# --- Base de datos del PORTAL (JDBC: tablas SERV_MED_* dentro de BIOMETRICO) ---
# Conexion por ALIAS de tnsnames.ora (decision del usuario, 19-oct-2026: seguir con TNS).
# El alias PDBPRD resuelve a 10.249.249.35:1521 / pdbprd.subnetdb.vcnocionest.oraclevcn.com.
# *** NUNCA escribir usuario ni contrasena en este archivo: los mete Maven. ***
spring.datasource.url=@prod.datasource.url@
spring.datasource.username=@prod.datasource.username@
spring.datasource.password=@prod.datasource.password@
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# [configurable] Carpeta del tnsnames.ora en el servidor (default: la mete Maven). Llave propia,
# corta, para poder reescribirla en el XML de Tomcat; el driver la recibe como propiedad de
# conexion (Hikari pasa estas properties al DriverManager).
portal.oracle.tns-admin=@prod.tns.admin@
spring.datasource.hikari.data-source-properties[oracle.net.tns_admin]=${portal.oracle.tns-admin}

# Alternativa sin tnsnames (si algun servidor no lo tuviera): conexion directa a la misma base
# spring.datasource.url=jdbc:oracle:thin:@//10.249.249.35:1521/pdbprd.subnetdb.vcnocionest.oraclevcn.com

# --- Almacenamiento de archivos ----------------------------------------------
# [configurable] Servidor real 10.249.249.4, confirmado 2026-08-25. Debe existir y ser
# escribible por Tomcat.
portal.files.root=/mnt/data/onedev/apps/exec/filessalud

# --- Web services ORDS (biows) -----------------------------------------------
portal.biows.base-url=http://10.249.249.3/biows/ords/security

# --- SSO del launcher ---------------------------------------------------------
portal.sso.jwks-uri=https://sso.onestcloud.mx/sso/.well-known/jwks.json
portal.sso.issuer-uri=https://sso.onestcloud.mx/sso

# --- Autenticacion y permisos -------------------------------------------------
portal.auth.strategy=LEGACY_PHP
portal.permissions.source=LOCAL

# Base publica del portal (nginx) para el documentoUrl del webhook a OCR
portal.integracion.ocr.public-base-url=https://health.onestcloud.mx
