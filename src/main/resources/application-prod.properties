# Perfil PROD — todo valor sensible o dependiente del ambiente llega por VARIABLE DE ENTORNO.
#
# Sintaxis: ${VARIABLE:valor_por_defecto}. Si la variable existe en el entorno del Tomcat, gana;
# si no, se usa el valor que va despues de los dos puntos. Asi el WAR es el mismo en cualquier
# servidor y las credenciales NO viajan en el repo (que esta publicado en GitHub).
#
# Variables que reconoce Spring Boot por binding relajado (mayusculas, puntos -> guion bajo):
#   SPRING_DATASOURCE_URL        jdbc:oracle:thin:@HOST:1521/SERVICIO
#   SPRING_DATASOURCE_USERNAME   usuario del esquema del portal (APP_*, MED_TAG)
#   SPRING_DATASOURCE_PASSWORD   contraseña  <-- NUNCA escribirla aqui
#   PORTAL_FILES_ROOT            raiz de archivos en disco
#   PORTAL_BIOWS_BASEURL         URL base de los WS de ORDS
#   PORTAL_SSO_JWKS_URI / PORTAL_SSO_ISSUER_URI   SSO del launcher
#   PORTAL_AUTH_STRATEGY / PORTAL_PERMISSIONS_SOURCE
#
# En Linux (Tomcat): definirlas en bin/setenv.sh o en el unit de systemd.
# En Windows (pruebas locales): bin/setenv.bat. Ver docs/conexiones-ambientes.md.

# --- Base de datos del PORTAL (JDBC: APP_*, MED_TAG) -------------------------
# OJO: no es la base de ORDS. El default de abajo sigue apuntando a QA de forma PROVISIONAL
# (ver docs/plan-migracion-produccion.md, decision 0.1): en produccion hay que definir
# SPRING_DATASOURCE_* en el servidor, o cambiar estos defaults cuando se confirme el esquema.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@200.94.116.132:1521/orclpdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ONEWMS_QA}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# --- Almacenamiento de archivos ----------------------------------------------
# Servidor real 10.249.249.4, confirmado 2026-08-25 (ver etl-migracion-historica-especificacion.md).
# Debe existir y ser escribible por el usuario de Tomcat.
portal.files.root=${PORTAL_FILES_ROOT:/mnt/data/onedev/apps/exec/filessalud}

# --- Web services ORDS (biows) -----------------------------------------------
# Si en produccion la ORDS vive en otro host, se define PORTAL_BIOWS_BASEURL sin tocar el WAR.
portal.biows.base-url=${PORTAL_BIOWS_BASEURL:http://10.249.249.3/biows/ords/security}

# --- SSO del launcher ---------------------------------------------------------
portal.sso.jwks-uri=${PORTAL_SSO_JWKS_URI:https://sso.onestcloud.mx/sso/.well-known/jwks.json}
portal.sso.issuer-uri=${PORTAL_SSO_ISSUER_URI:https://sso.onestcloud.mx/sso}

# --- Autenticacion y permisos -------------------------------------------------
portal.auth.strategy=${PORTAL_AUTH_STRATEGY:LEGACY_PHP}
portal.permissions.source=${PORTAL_PERMISSIONS_SOURCE:LOCAL}
