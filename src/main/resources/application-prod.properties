# Perfil PROD — todo valor sensible o dependiente del ambiente llega por VARIABLE DE ENTORNO.
#
# Sintaxis: ${VARIABLE:valor_por_defecto}. Si la variable existe en el entorno del Tomcat, gana;
# si no, se usa el valor que va despues de los dos puntos. Asi el WAR es el mismo en cualquier
# servidor y las credenciales NO viajan en el repo (que esta publicado en GitHub).
#
# Variables que reconoce Spring Boot por binding relajado (mayusculas, puntos -> guion bajo):
#   SPRING_DATASOURCE_URL        jdbc:oracle:thin:@ALIAS  (alias de tnsnames.ora) o
#                                jdbc:oracle:thin:@//HOST:1521/SERVICIO
#   SPRING_DATASOURCE_USERNAME   usuario del esquema del portal (APP_*, MED_TAG)
#   SPRING_DATASOURCE_PASSWORD   contraseña  <-- NUNCA escribirla aqui
#   ORACLE_TNS_ADMIN             carpeta con tnsnames.ora / sqlnet.ora / wallet
#   PORTAL_FILES_ROOT            raiz de archivos en disco
#   PORTAL_BIOWS_BASEURL         URL base de los WS de ORDS
#   PORTAL_SSO_JWKS_URI / PORTAL_SSO_ISSUER_URI   SSO del launcher
#   PORTAL_AUTH_STRATEGY / PORTAL_PERMISSIONS_SOURCE
#
# En Linux (Tomcat): definirlas en bin/setenv.sh o en el unit de systemd.
# En Windows (pruebas locales): bin/setenv.bat. Ver docs/conexiones-ambientes.md.

# --- Base de datos del PORTAL (JDBC: APP_*, MED_TAG) -------------------------
# Conexion por ALIAS de tnsnames.ora (23-sep-2026). El alias PDBPRD vive en el directorio
# de configuracion de Oracle indicado abajo y resuelve a:
#   10.249.249.35:1521 / pdbprd.subnetdb.vcnocionest.oraclevcn.com
#
# ORACLE_TNS_ADMIN define DONDE esta ese tnsnames.ora. El default es la ruta de la maquina
# de Miguel (pruebas); en el servidor se pasa la ruta real por variable de entorno.
# Rutas con \ no funcionan aqui (la barra invertida escapa en un .properties): usar / .
#
# OJO (decision 0.1 del plan): PDBPRD es la base de ORDS/biometrico, donde el esquema APP_*
# del portal TODAVIA NO EXISTE. Con ddl-auto=validate el portal no arrancara contra ella
# ("Schema-validation: missing table"); sirve para probar conectividad y credenciales.
# Cuando se cree el esquema propio del portal, apuntar SPRING_DATASOURCE_* a ese usuario.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@PDBPRD}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Directorio de configuracion de Oracle (tnsnames.ora / sqlnet.ora / wallet). El driver lo
# recibe como propiedad de conexion; Hikari pasa estas properties al DriverManager.
spring.datasource.hikari.data-source-properties[oracle.net.tns_admin]=${ORACLE_TNS_ADMIN:C:/Datos/Respaldo Prof/Nueva carpeta/apache-tomcat-9.0.44/bin/oracle_config}

# Alternativa sin tnsnames (si algun ambiente no tiene ese directorio): conexion directa
# spring.datasource.url=jdbc:oracle:thin:@//10.249.249.35:1521/pdbprd.subnetdb.vcnocionest.oraclevcn.com

# --- Almacenamiento de archivos ----------------------------------------------
# Servidor real 10.249.249.4, confirmado 2026-08-25 (ver etl-migracion-historica-especificacion.md).
# Debe existir y ser escribible por el usuario de Tomcat.
portal.files.root=${PORTAL_FILES_ROOT:/mnt/data/onedev/apps/exec/filessalud}

# --- Web services ORDS (biows) -----------------------------------------------
# Si en produccion la ORDS vive en otro host, se define PORTAL_BIOWS_BASEURL sin tocar el WAR.
portal.biows.base-url=${PORTAL_BIOWS_BASEURL:http://10.249.249.3/biows/ords/security}

# --- SSO del launcher ---------------------------------------------------------
portal.sso.jwks-uri=${PORTAL_SSO_JWKS_URI:https://sso.onestcloud.mx/sso/.well-known/jwks.json}
portal.sso.issuer-uri=${PORTAL_SSO_ISSUER_URI:https://sso.onestcloud.mx/sso}

# --- Autenticacion y permisos -------------------------------------------------
portal.auth.strategy=${PORTAL_AUTH_STRATEGY:LEGACY_PHP}
portal.permissions.source=${PORTAL_PERMISSIONS_SOURCE:LOCAL}
