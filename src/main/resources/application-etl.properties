# Perfil ETL (U09): activar junto con "local" -> --spring.profiles.active=local,etl
# Datasource ORIGEN (legacy MariaDB, staging local). El datasource PRIMARIO (Oracle,
# definido en application-local.properties) sigue siendo el DESTINO de la migracion.
etl.legacy.datasource.url=jdbc:mariadb://localhost:3306/servicioMedico?useUnicode=true&characterEncoding=UTF-8
etl.legacy.datasource.username=root
etl.legacy.datasource.password=
etl.legacy.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Modo de corrida: none (default, no hace nada) | sample | full
etl.files.mode=none
etl.files.batch-size=200

etl.tags.mode=none
etl.tags.batch-size=500
