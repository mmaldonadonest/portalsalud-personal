<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, content, pageScripts, pageStyles)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Portal Salud Personal dashboard">
    <meta name="author" content="Portal Salud Personal">
    <!-- Fuente de verdad del context path para el JS de las paginas (ver contextPath
         mas abajo). Es un atributo HTML (content="...") a proposito: el sub_filter de
         nginx en produccion ya reescribe ="/portal-salud/ -> ="/ en atributos (por eso
         los th:href de abajo funcionan detras del proxy); un "var x = " en JS no lo
         cubre. Asi que local (Tomcat directo, context-path=/portal-salud) y produccion
         (detras de nginx, que expone la app en raiz) resuelven correctamente sin
         hardcodear ningun valor.-->
    <meta name="app-context-path" th:content="@{/}" content="/">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/theme/assets/img/favicon.png}" href="/theme/assets/img/favicon.png">
    <title th:replace="${pageTitle}">Portal Salud Personal</title>
    <link rel="stylesheet" th:href="@{/theme/lib/remixicon/fonts/remixicon.css}" href="/theme/lib/remixicon/fonts/remixicon.css">
    <link rel="stylesheet" th:href="@{/theme/assets/css/style.min.css}" href="/theme/assets/css/style.min.css">
    <link rel="stylesheet" th:href="@{/css/onest-brand.css}" href="/css/onest-brand.css">
    <!-- ONEST Digital Design System v1.0 - skin de PREVIEW, inerte salvo que se
         active data-brand="onest" en <html> (dropdown "Skin Mode" del header). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" th:href="@{/css/onest-skin.css}" href="/css/onest-skin.css">
    <th:block th:replace="${pageStyles}"></th:block>
    <script>
        var contextPath = document.querySelector('meta[name="app-context-path"]').content;
        // Bitacora (modulo Auditoria): las exportaciones CSV se arman en el navegador, asi que
        // cada pantalla avisa con esto al exportar. Nunca bloquea ni rompe la exportacion.
        function auditarExportacion(modulo, detalle) {
            try {
                var t = document.querySelector('meta[name="_csrf"]');
                var h = document.querySelector('meta[name="_csrf_header"]');
                var headers = {};
                if (t && h) { headers[h.content] = t.content; }
                fetch(contextPath + 'api/auditoria/exportacion', {
                    method: 'POST', headers: headers,
                    body: new URLSearchParams({ modulo: modulo, detalle: detalle || '' })
                }).catch(function () { /* la bitacora no bloquea */ });
            } catch (e) { /* idem */ }
        }
    </script>
</head>
<body>
<th:block th:replace="~{fragments/menu :: menu(${currentPath})}"></th:block>
<div class="header-main px-3 px-lg-4">
    <th:block th:replace="~{fragments/header :: header}"></th:block>
</div>
<div class="main main-app p-3 p-lg-4">
    <th:block th:replace="${content}"></th:block>
    <th:block th:replace="~{fragments/footer :: footer}"></th:block>
</div>
<th:block th:replace="~{fragments/scripts :: appScripts(${pageScripts})}"></th:block>
</body>
</html>
