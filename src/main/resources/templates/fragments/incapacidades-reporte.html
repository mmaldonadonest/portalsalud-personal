<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Reporte de incapacidades por rango de fechas (todas las NSS). Equivale a
  archivoIncapacidades.html + generarExcelIncapa.php del legacy - a diferencia del legacy
  (que descargaba un Excel a ciegas sin mostrar nada en pantalla), aqui se renderiza como
  tabla primero, con el mismo patron de buscador/exportar que el resto del portal.
-->
<div th:fragment="tabla">
    <div th:if="${#lists.isEmpty(reporte)}" class="alert alert-warning mb-0" role="alert">
        No se encontraron incapacidades entre <span th:text="${fechaInicial}">-</span>
        y <span th:text="${fechaFinal}">-</span>.
    </div>

    <div th:unless="${#lists.isEmpty(reporte)}"
         th:with="ramoLabels=${ {'enfermedad_general':'Enfermedad General','profesional':'Enfermedad profesional','rt1':'RT1','rt2':'RT2','maternidad':'Maternidad'} }">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <div class="d-flex flex-wrap gap-2">
                <input type="text" class="form-control form-control-sm" style="max-width: 260px;"
                       placeholder="Buscar..." aria-label="Buscar en el reporte"
                       oninput="filtrarConsultas(this);">
                <select class="form-select form-select-sm" style="max-width: 200px;"
                        aria-label="Filtrar por ramo" data-filtro-ramo onchange="filtrarPorRamo(this);">
                    <option value="">Todos los ramos</option>
                    <option value="enfermedad_general">Enfermedad General</option>
                    <option value="profesional">Enfermedad profesional</option>
                    <option value="rt1">RT1</option>
                    <option value="rt2">RT2</option>
                    <option value="maternidad">Maternidad</option>
                </select>
                <select class="form-select form-select-sm" style="max-width: 160px;"
                        aria-label="Filtrar por rubro" data-filtro-rubro onchange="filtrarPorRubro(this);">
                    <option value="">Todos los rubros</option>
                    <option value="Interna">Interna</option>
                    <option value="IMSS">IMSS</option>
                </select>
            </div>
            <button type="button" class="btn btn-sm btn-success" onclick="exportarConsultasExcel(this);">
                <i class="ri-file-excel-2-line me-1"></i> Exportar a Excel
            </button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" data-export-name="incapacidades-reporte">
                <thead class="table-dark">
                    <tr>
                        <th>Fecha</th>
                        <th>Folio</th>
                        <th>NSS</th>
                        <th>Nombre</th>
                        <th>RFC</th>
                        <th>CURP</th>
                        <th>Rubro</th>
                        <th>Ramo</th>
                        <th>Tipo</th>
                        <th>Inicio</th>
                        <th>Termino</th>
                        <th>Dias aut.</th>
                        <th>Salario integrado</th>
                        <th>Costo</th>
                        <th>Dictamen</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${reporte}" th:attr="data-ramo=${r.ramo}, data-rubro=${r.rubro}">
                        <td th:text="${r.fechaConsulta}">-</td>
                        <td th:text="${r.folioIncapacidad}">-</td>
                        <td th:text="${r.nss}">-</td>
                        <td th:text="${r.nombre}">-</td>
                        <td th:text="${r.rfc}">-</td>
                        <td th:text="${r.curp}">-</td>
                        <td th:text="${r.rubro}">-</td>
                        <td th:text="${ramoLabels.get(r.ramo) ?: r.ramo}">-</td>
                        <td th:text="${r.tipoIncapacidad}">-</td>
                        <td th:text="${r.fechaInicio}">-</td>
                        <td th:text="${r.fechaTermino}">-</td>
                        <td th:text="${r.diasAutorizados}">-</td>
                        <td th:text="${r.salarioIntegrado}">-</td>
                        <td th:text="${r.costo}">-</td>
                        <td th:text="${r.estadoDictamen}">-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
