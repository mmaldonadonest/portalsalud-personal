<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Expediente general: tabla de consultas medicas del NSS (U04).
  Equivale a expedienteShowConsults.php?type=expedienteConsulta.
  Se inyecta en #moduleContent de la pagina de busqueda NSS.
-->
<div th:fragment="table">
    <div class="card card-one">
        <div class="card-header d-flex align-items-center justify-content-between">
            <h6 class="card-title mb-0">Archivo de consultas</h6>
            <div class="d-flex align-items-center gap-2">
                <span th:if="${cuenta != null and !#strings.isEmpty(cuenta)}"
                      class="badge bg-info" style="font-size: 1rem;" th:text="'Cuenta ' + ${cuenta}">Cuenta</span>
                <span class="badge bg-primary" style="font-size: 1rem;" th:text="'NSS ' + ${nss}">NSS</span>
            </div>
        </div>
        <div class="card-body">

            <div th:if="${#lists.isEmpty(consultas)}" class="alert alert-warning mb-0" role="alert">
                No se encontraron consultas para este NSS.
            </div>

            <div th:unless="${#lists.isEmpty(consultas)}"
                 th:with="tipoLabels=${ {'enfermedad_general':'Enfermedad General','incidente_accidente':'Incidente/Accidente','pase_salida':'Pase de Salida','cronico_degenerativo':'Crónico Degenerativo','campana':'Campaña','entrega_incapacidad':'Entrega de Incapacidad','st7':'ST7','otros_consulta':'Otros','EMERGENCIA':'Emergencia','ACCIDENTE':'Accidente'} },
                          areaLabels=${ {'oficinas':'Oficinas','patio_maniobras':'Patio de Maniobras','acceso':'Acceso','filtro':'Filtro','rampas':'Rampas','picking':'Picking','surtido':'Surtido','paletizadoras':'Paletizadoras','preparado':'Preparado','comedor':'Comedor','estacionamiento':'Estacionamiento','via_publica':'Vía Pública','trayecto_empresa':'Trayecto a Empresa','trayecto_domicilio':'Trayecto a Domicilio','comision':'En Comisión','trabajos_especiales':'En Trabajos Especiales','otros_accidente':'Otros'} }">
                <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
                    <input type="text" class="form-control form-control-sm" style="max-width: 260px;"
                           placeholder="Buscar..." aria-label="Buscar en consultas"
                           oninput="filtrarConsultas(this);">
                    <button type="button" class="btn btn-sm btn-success" onclick="exportarConsultasExcel(this);">
                        <i class="ri-file-excel-2-line me-1"></i> Exportar a Excel
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" data-export-name="consultas">
                        <thead class="table-dark">
                            <tr>
                                <th>Fecha de consulta</th>
                                <th>Tipo de consulta</th>
                                <th>Area de accidente</th>
                                <th>Causa</th>
                                <th class="text-center" data-no-export>Ver</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${consultas}"
                                th:classappend="${c.esAccidente()} ? 'table-warning'">
                                <td th:text="${c.fechaConsulta}">-</td>
                                <td>
                                    <span th:text="${tipoLabels.get(c.tipoConsulta) ?: c.tipoConsulta}">-</span>
                                    <span th:if="${c.esAccidente()}"
                                          class="badge bg-danger ms-1">
                                        <i class="ri-alert-line"></i> Accidente
                                    </span>
                                </td>
                                <td th:text="${areaLabels.get(c.areaAccidente) ?: c.areaAccidente}">-</td>
                                <td th:text="${c.causa}">-</td>
                                <td class="text-center" data-no-export>
                                    <button type="button" class="btn btn-sm btn-outline-info"
                                            th:attr="data-id-consulta=${c.idConsulta}"
                                            onclick="verConsulta(this);" title="Ver registro completo">
                                        <i class="ri-folder-open-line"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
