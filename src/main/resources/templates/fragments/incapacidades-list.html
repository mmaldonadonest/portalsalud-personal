<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Lista de incapacidades del NSS (U05). Equivale a expedienteShowConsults?type=expedienteIncapacidad.
  Reusa el buscador/exportar-Excel globales (filtrarConsultas / exportarConsultasExcel).
-->
<div th:fragment="table">
    <div class="card card-one">
        <div class="card-header d-flex align-items-center justify-content-between">
            <h6 class="card-title mb-0">Archivo de incapacidades</h6>
            <span class="badge bg-primary" th:text="'NSS ' + ${nss}">NSS</span>
        </div>
        <div class="card-body">

            <div th:if="${#lists.isEmpty(incapacidades)}" class="alert alert-warning mb-0" role="alert">
                No se encontraron incapacidades para este NSS.
            </div>

            <div th:unless="${#lists.isEmpty(incapacidades)}">
                <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
                    <input type="text" class="form-control form-control-sm" style="max-width: 260px;"
                           placeholder="Buscar..." aria-label="Buscar en incapacidades"
                           oninput="filtrarConsultas(this);">
                    <button type="button" class="btn btn-sm btn-success" onclick="exportarConsultasExcel(this);">
                        <i class="ri-file-excel-2-line me-1"></i> Exportar a Excel
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" data-export-name="incapacidades">
                        <thead class="table-dark">
                            <tr>
                                <th>Fecha</th>
                                <th>Folio</th>
                                <th>Rubro</th>
                                <th>Ramo</th>
                                <th>Tipo</th>
                                <th>Dias aut.</th>
                                <th>Inicio</th>
                                <th>Termino</th>
                                <th>Costo</th>
                                <th class="text-center" data-no-export>Ver</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="i : ${incapacidades}">
                                <td th:text="${i.fechaConsulta}">-</td>
                                <td th:text="${i.folioIncapacidad}">-</td>
                                <td th:text="${i.rubro}">-</td>
                                <td th:text="${i.ramo}">-</td>
                                <td th:text="${i.tipoIncapacidad}">-</td>
                                <td th:text="${i.diasAutorizados}">-</td>
                                <td th:text="${i.fechaInicio}">-</td>
                                <td th:text="${i.fechaTermino}">-</td>
                                <td th:text="${i.costo}">-</td>
                                <td class="text-center" data-no-export>
                                    <button type="button" class="btn btn-sm btn-outline-info"
                                            th:attr="data-id-consulta=${i.idConsulta}"
                                            onclick="verIncapacidad(this);" title="Ver registro completo">
                                        <i class="ri-folder-open-line"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
