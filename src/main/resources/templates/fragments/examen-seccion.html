<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Una seccion del examen (U07). type = SINO | TEXT | DATE | AREA | RESULTADO | OPCION | OCULTO. Pre-cargada.
  name = clave punteada (p.ej. NEUROLOGIA.AVC) para el futuro guardado completo.
-->
<div th:fragment="seccion" class="card bg-light mb-3 exsec" th:attr="data-seccion=${seccion}">
    <div class="card-header py-2"><strong th:text="${seccion}">Seccion</strong></div>
    <div class="card-body">
        <div th:if="${seccion == 'Diagnóstico'}" class="mb-3">
            <label class="form-label" for="examenIcdConsult">Buscar diagnóstico (obligatorio, catálogo ICD/CIE)</label>
            <div class="d-flex gap-2">
                <input type="text" class="form-control form-control-sm" id="examenIcdConsult" autocomplete="off"
                       placeholder="Escribe al menos 3 letras del nombre (autocompleta)..."
                       oninput="buscarIcdDebounced('examenIcdConsult','examenIcdResult','examenDiagnostico');">
                <button type="button" class="btn btn-sm btn-outline-primary text-nowrap" id="examenIcdTodoBtn"
                        title="Lista el catálogo completo para elegir sin escribir; vuelve a pulsar para ocultarlo"
                        onclick="toggleIcdCatalogo(this,'examenIcdConsult','examenIcdResult','examenDiagnostico');">
                    <i class="ri-list-check me-1"></i>Ver todo el catálogo
                </button>
            </div>
            <div id="examenIcdResult" class="mt-2"></div>
        </div>
        <!-- OCULTO: columnas que el PHP nunca lleno (MESOMORFO, INTERES...). No se muestran, pero
             viajan con su valor para que guardar no borre lo que hubiera. -->
        <input th:each="it : ${items}" th:if="${it.type == 'OCULTO'}" type="hidden"
               th:name="${it.fieldName}" th:value="${it.value}">
        <style>
            .exsec .exini-chips { display: flex; flex-wrap: wrap; gap: 6px; }
            .exsec .exini-chips .btn { color: #111; font-size: .85rem; }
            .exsec .exini-chips .btn.activo { background: #0057A8; border-color: #0057A8; color: #fff; }
        </style>
        <div class="row g-3">
            <div class="col-md-6" th:each="it : ${items}" th:unless="${it.type == 'OCULTO'}">
                <label class="form-label mb-1" th:text="${it.label}">Campo</label>

                <!-- OPCION (13-oct-2026): una opcion entre botones, mismos valores que el select del PHP
                     (formsEFis/EFis.html) y los chips del examen inicial. Clic en la activa la desmarca. -->
                <div th:if="${it.type == 'OPCION'}"
                     th:with="campo=${#strings.substringAfter(it.fieldName, '.')},
                              opciones=${campo == 'ECTOMORFICO' ? {'Ectomórfica':'Ectomórfica (delgado)','Mesomorfo':'Mesomorfo (musculoso)','Endomórfica':'Endomórfica (sobrepeso)'}
                                       : campo == 'SERENIDAD' ? {'serenidad':'Serenidad','interés':'Interés','entusiasta':'Entusiasta','antagónico':'Antagónico','enojo':'Enojo'}
                                       : campo == 'HIPOCRITA' ? {'normal':'Normal','hipocrática':'Hipocrática','ictérica':'Ictérica','anémica':'Anémica','tiroidea':'Tiroidea'}
                                       : {'normal':'Normal','parkinson':'Parkinson','hemipléjico':'Hemipléjico','Atáxica':'Atáxica','hemiparesia':'Hemiparesia'}}">
                    <div class="exini-chips">
                        <input type="hidden" th:name="${it.fieldName}" th:value="${it.value}">
                        <button type="button" th:each="o : ${opciones}" class="btn btn-sm btn-outline-secondary"
                                th:classappend="${it.value == o.key} ? 'activo' : ''"
                                th:attr="data-val=${o.key}" th:text="${o.value}" onclick="exIniChip(this);">opción</button>
                    </div>
                    <!-- Lo capturado antes como texto libre y que no es una de las opciones: se ve y se
                         conserva hasta que se elija otra -->
                    <small class="text-muted" th:if="${it.value != null and !#strings.isEmpty(it.value) and !opciones.containsKey(it.value)}"
                           th:text="|Capturado antes: ${it.value}|">Capturado antes</small>
                </div>

                <div th:if="${it.type == 'SINO'}" class="d-flex gap-2">
                    <select class="form-select form-select-sm" style="max-width: 110px;" th:name="${it.fieldName}">
                        <option value="" th:selected="${it.value == null or it.value == ''}">-</option>
                        <option value="1" th:selected="${it.value == '1'}">Si</option>
                        <option value="0" th:selected="${it.value != null and it.value != '' and it.value != '1'}">No</option>
                    </select>
                    <input th:if="${it.obsName != null}" type="text" class="form-control form-control-sm"
                           placeholder="Observaciones" th:name="${it.obsName}" th:value="${it.obsValue}">
                </div>

                <input th:if="${it.type == 'TEXT'}" type="text" class="form-control form-control-sm"
                       th:name="${it.fieldName}" th:value="${it.value}">

                <input th:if="${it.type == 'DATE'}" type="date" class="form-control form-control-sm"
                       th:name="${it.fieldName}" th:value="${it.value}">

                <textarea th:if="${it.type == 'AREA'}" class="form-control form-control-sm" rows="2"
                          th:id="${seccion == 'Diagnóstico'} ? 'examenDiagnostico'"
                          th:readonly="${seccion == 'Diagnóstico'}"
                          th:placeholder="${seccion == 'Diagnóstico'} ? 'Selecciona una o mas claves del buscador ICD de arriba...'"
                          th:name="${it.fieldName}" th:text="${it.value}"></textarea>

                <select th:if="${it.type == 'RESULTADO'}" class="form-select form-select-sm" th:name="${it.fieldName}">
                    <option value="">Seleccionar</option>
                    <option value="apto" th:selected="${it.value == 'apto'}">Apto</option>
                    <option value="no_apto" th:selected="${it.value == 'no_apto'}">No apto</option>
                    <option value="apto_condicionado" th:selected="${it.value == 'apto_condicionado'}">Apto condicionado</option>
                    <option value="apto_restringido" th:selected="${it.value == 'apto_restringido'}">Apto restringido</option>
                </select>
            </div>
        </div>
    </div>
</div>
</body>
</html>
