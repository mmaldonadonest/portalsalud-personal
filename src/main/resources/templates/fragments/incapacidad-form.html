<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Alta de incapacidad (U05). Equivale a incapacidadForm.html + incap.php.
  Simplificado: sin el show/hide dinamico del legacy; costo se autocalcula.
  Se inyecta en #moduleContent. Guarda via /api/nss/incapacidades/save.
-->
<div th:fragment="form">
    <div class="card card-one">
        <div class="card-header d-flex align-items-center justify-content-between">
            <h6 class="card-title mb-0">Nueva incapacidad</h6>
            <span class="badge bg-primary" th:text="'NSS ' + ${nss}">NSS</span>
        </div>
        <div class="card-body">
            <form id="incapacidadAltaForm" class="row g-3" novalidate>
                <input type="hidden" name="nss" th:value="${nss}">
                <input type="hidden" name="idArchivoRel" th:value="${idArchivoRel}">
                <input type="hidden" name="firma" id="firma">

                <div class="col-md-6">
                    <label class="form-label" for="rubro">Rubro</label>
                    <select class="form-select" name="rubro" id="rubro" onchange="incapRubro();">
                        <option value="">Seleccionar</option>
                        <option value="Interna">Interna</option>
                        <option value="IMSS">IMSS</option>
                    </select>
                </div>
                <div class="col-md-6" id="incapFolioCol">
                    <!--/* C-046 (17-nov-2026): en rubro IMSS es obligatorio, 2 letras + 6 numeros y no se puede repetir;
                         la regla la aplica el servidor (IncapacidadService.validarFolio), aqui solo se ayuda a capturarlo.
                         C-055: en rubro Interna no se pide (incapRubro lo oculta y lo vacia) */-->
                    <label class="form-label" for="folio">Folio <span class="text-muted fs-12">(obligatorio en IMSS)</span></label>
                    <input type="text" class="form-control text-uppercase" name="folio" id="folio" placeholder="Ej. SE105771"
                           maxlength="12" autocomplete="off" title="Folio del certificado IMSS: 2 letras y 6 números"
                           oninput="this.value = this.value.toUpperCase().replace(/\s+/g, '');">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="ramo">Ramo</label>
                    <select class="form-select" name="ramo" id="ramo">
                        <option value="">Seleccionar</option>
                        <option value="enfermedad_general">Enfermedad General</option>
                        <option value="profesional">Enfermedad profesional</option>
                        <option value="rt1">RT1</option>
                        <option value="rt2">RT2</option>
                        <option value="maternidad">Maternidad</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="tipo">Tipo de incapacidad</label>
                    <select class="form-select" name="tipo" id="tipo" onchange="incapTipo();">
                        <option value="">Elegir</option>
                        <option value="inicial">Inicial</option>
                        <option value="subsecuente">Subsecuente</option>
                    </select>
                </div>

                <!--/* C-051 (18-nov-2026): la subsecuente continua una incapacidad abierta (sin Alta = Si, C-053). De ella
                     salen la fecha inicial de la cadena, su termino y el diagnostico; la fecha subsecuente se propone
                     = termino + 1. El servidor vuelve a validar todo (IncapacidadService.resolverFechas). */-->
                <div class="col-12 d-none" id="incapAnteriorCol">
                    <label class="form-label" for="anterior">Continúa la incapacidad</label>
                    <select class="form-select" name="anterior" id="anterior" onchange="incapAnterior();"
                            th:disabled="${#lists.isEmpty(abiertas)}">
                        <option value="" th:text="${#lists.isEmpty(abiertas)} ? 'Este NSS no tiene incapacidades abiertas para continuar' : 'Elegir'">Elegir</option>
                        <option th:each="c : ${abiertas}"
                                th:value="${c.ultimo().regId()}"
                                th:attr="data-primera=${c.primera()}, data-termino=${c.termino()}, data-ramo=${c.inicial().ramo()},
                                         data-rubro=${c.inicial().rubro()}, data-diag=${c.diagnostico()}, data-dias=${c.diasTotal()}"
                                th:text="${T(com.onest.app.catalog.incapacidad.service.CadenaIncapacidadService).etiqueta(c)}
                                         + ' · ' + ${c.diasTotal()} + ' días en ' + ${#lists.size(c.eslabones())}
                                         + (${#lists.size(c.eslabones()) == 1} ? ' incapacidad' : ' incapacidades')
                                         + (${c.diagnostico() != null} ? ' · ' + ${c.diagnostico()} : '')">folio</option>
                    </select>
                </div>

                <!--/* C-045: orden Fecha inicial, Fecha de termino, Fecha subsecuente y Termino de la subsecuente.
                     Los terminos se calculan (inicio + dias - 1, el dia de inicio cuenta): no se teclean. */-->
                <div class="col-md-3">
                    <label class="form-label" for="fechaPrimera">Fecha inicial</label>
                    <input type="date" class="form-control" name="fechaPrimera" id="fechaPrimera" oninput="incapRecalc();"
                           th:with="hoyMx=${#temporals.createNowForTimeZone('America/Mexico_City')}"
                           th:max="${#temporals.format(hoyMx, 'yyyy-MM-dd')}"
                           th:min="${#temporals.format(hoyMx.minusYears(2), 'yyyy-MM-dd')}"
                           title="No puede ser futura ni de hace más de 2 años">
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="incapTerminoIni">Fecha de término</label>
                    <input type="date" class="form-control" id="incapTerminoIni" readonly tabindex="-1">
                </div>
                <div class="col-md-3 incap-sub d-none">
                    <label class="form-label" for="fechaInicio">Fecha subsecuente</label>
                    <input type="date" class="form-control" name="fechaInicio" id="fechaInicio" oninput="incapRecalc();"
                           th:with="hoyMx=${#temporals.createNowForTimeZone('America/Mexico_City')}"
                           th:max="${#temporals.format(hoyMx, 'yyyy-MM-dd')}"
                           th:min="${#temporals.format(hoyMx.minusYears(2), 'yyyy-MM-dd')}"
                           title="No puede ser futura ni de hace más de 2 años">
                </div>
                <div class="col-md-3 incap-sub d-none">
                    <label class="form-label" for="incapTerminoSub">Término de la subsecuente</label>
                    <input type="date" class="form-control" id="incapTerminoSub" readonly tabindex="-1">
                </div>

                <div class="col-md-3">
                    <label class="form-label" for="diasAutorizados">Días autorizados</label>
                    <input type="number" min="1" step="1" class="form-control" name="diasAutorizados" id="diasAutorizados"
                           placeholder="Días" oninput="calcCostoIncap(); incapRecalc();">
                </div>
                <div class="col-md-3">
                    <!--/* C-050: acumulados = termino - fecha inicial de la cadena + 1 (como el Excel de SM); solo se muestra */-->
                    <label class="form-label" for="incapAcumulados">Días acumulados</label>
                    <input type="text" class="form-control" id="incapAcumulados" readonly tabindex="-1" placeholder="Se calcula">
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="fechaAlta">Fecha de alta</label>
                    <input type="date" class="form-control" name="fechaAlta" id="fechaAlta">
                </div>

                <div class="col-12">
                    <!--/* C-052: como la columna DIAGNÓSTICO del Excel de SM; la subsecuente lo hereda (se puede precisar) */-->
                    <label class="form-label" for="diagnostico">Diagnóstico</label>
                    <input type="text" class="form-control" name="diagnostico" id="diagnostico" maxlength="300"
                           placeholder="Diagnóstico de la incapacidad">
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="salarioIntegrado">Salario diario</label>
                    <input type="number" step="0.01" class="form-control" name="salarioIntegrado"
                           id="salarioIntegrado" placeholder="Salario" oninput="calcCostoIncap();">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="costo">Costo</label>
                    <input type="number" step="0.01" class="form-control" name="costo" id="costo" placeholder="Costo">
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="salarioAcumulado">Salario acumulado</label>
                    <input type="number" step="0.01" class="form-control" name="salarioAcumulado" id="salarioAcumulado" placeholder="Acumulado">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="complementoSalarial">Complemento salarial</label>
                    <input type="number" step="0.01" class="form-control" name="complementoSalarial" id="complementoSalarial" placeholder="Complemento">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="imputable">Imputable</label>
                    <input type="text" class="form-control" name="imputable" id="imputable" placeholder="Imputable">
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="st2">ST2</label>
                    <select class="form-select" name="st2" id="st2">
                        <option value="">Seleccionar</option>
                        <option value="Si">Si</option>
                        <option value="No">No</option>
                        <option value="No_aplica">No aplica</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="estadoDictamen">Estado dictamen</label>
                    <select class="form-select" name="estadoDictamen" id="estadoDictamen">
                        <option value="N/A">N/A</option>
                        <option value="si_calificado">Si Calificado</option>
                        <option value="no_calificado">No Calificado</option>
                        <option value="pendiente_calificaciones">Pendiente de Calificaciones</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <!--/* C-053: Alta = Si cierra la incapacidad: ya no admite subsecuentes */-->
                    <label class="form-label" for="alta">Alta <span class="text-muted fs-12">(Sí cierra la incapacidad)</span></label>
                    <select class="form-select" name="alta" id="alta">
                        <option value="">Seleccionar</option>
                        <option value="Si">Si</option>
                        <option value="No">No</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="goceSueldo">Goce de sueldo</label>
                    <select class="form-select" name="goceSueldo" id="goceSueldo">
                        <option value="1">Si</option>
                        <option value="0">No</option>
                    </select>
                </div>

                <div class="col-12">
                    <label class="form-label d-block">Firma del paciente</label>
                    <canvas id="firmaCanvas" width="320" height="160"
                            class="border rounded bg-white" style="touch-action: none; cursor: crosshair;"></canvas>
                    <div class="mt-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="firmaClear">
                            <i class="ri-eraser-line me-1"></i> Limpiar firma
                        </button>
                    </div>
                </div>

                <div class="col-12">
                    <label class="form-label" for="incapacidadFiles">Adjuntar PDF (opcional)</label>
                    <input type="file" class="form-control" id="incapacidadFiles" accept="application/pdf" multiple>
                </div>

                <div class="col-12 d-flex justify-content-end align-items-center gap-3">
                    <span id="incapacidadGuardarResult" class="fs-sm"></span>
                    <button type="button" class="btn btn-primary" onclick="guardarIncapacidad(this);">
                        <i class="ri-save-line me-1"></i> Guardar incapacidad
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
