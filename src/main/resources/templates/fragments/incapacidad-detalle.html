<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Detalle de una incapacidad (U05). Equivale a viewIncapDetails.php. Se inyecta en el modal. -->
<div th:fragment="detalle">

    <div th:if="${detalle == null}" class="alert alert-warning mb-0" role="alert">
        No se encontro el detalle de la incapacidad.
    </div>

    <div th:if="${detalle != null}" th:with="d=${detalle}">
        <div class="row g-3">
            <div class="col-md-6" th:each="campo : ${ {
                    {'Fecha de incapacidad', d.fechaConsulta},
                    {'Folio incapacidad', d.folioIncapacidad},
                    {'Ramo', d.ramo},
                    {'Tipo de incapacidad', d.tipoIncapacidad},
                    {'Fecha de inicio', d.fechaInicio},
                    {'Fecha de termino', d.fechaTermino},
                    {'Dias autorizados', d.diasAutorizados},
                    {'Salario integrado', d.salarioIntegrado},
                    {'Costo', d.costo},
                    {'Imputable', d.imputable},
                    {'Estado del dictamen', d.estadoDictamen},
                    {'Complemento salarial', d.complementoSalarial},
                    {'Rubro', d.rubro},
                    {'Fecha de alta', d.fechaAlta},
                    {'ST2', d.st2},
                    {'Alta', d.alta},
                    {'Salario acumulado', d.salarioAcumulado}
                } }">
                <label class="form-label mb-1 text-muted fs-sm" th:text="${campo[0]}">Campo</label>
                <input type="text" readonly class="form-control form-control-sm" th:value="${campo[1]}">
            </div>
            <div class="col-md-6">
                <label class="form-label mb-1 text-muted fs-sm">Goce de sueldo</label>
                <input type="text" readonly class="form-control form-control-sm"
                       th:value="${d.goceSueldo == '1' ? 'Si' : 'No'}">
            </div>
        </div>

        <hr class="my-4">
        <h6 class="mb-2"><i class="ri-attachment-2 me-1"></i> Archivos adjuntos</h6>
        <div th:if="${#lists.isEmpty(adjuntos)}" class="text-muted fs-sm">Sin archivos adjuntos.</div>
        <ul th:unless="${#lists.isEmpty(adjuntos)}" class="list-group">
            <li th:each="a : ${adjuntos}"
                class="list-group-item d-flex justify-content-between align-items-center">
                <span>
                    <i class="ri-file-pdf-2-line me-1 text-danger"></i>
                    <span th:text="${a.name}">archivo.pdf</span>
                    <small class="text-muted" th:if="${a.sizeBytes != null}"
                           th:text="'(' + ${#numbers.formatInteger(a.sizeBytes / 1024, 1)} + ' KB)'">(KB)</small>
                </span>
                <a class="btn btn-sm btn-outline-primary" target="_blank" title="Descargar"
                   th:href="@{'/api/nss/consulta/file/' + ${a.id}}">
                    <i class="ri-download-2-line"></i>
                </a>
            </li>
        </ul>
    </div>

</div>
</body>
</html>
