<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Lista de accidentes de trabajo del NSS. Backend aplicado y verificado 2026-08-14
  contra Servcio/consulta_accidente (docs/ords-accidentes.sql).
  Reusa el buscador/exportar-Excel globales (filtrarConsultas / exportarConsultasExcel).
-->
<div th:fragment="table">
    <div class="card card-one">
        <div class="card-header d-flex align-items-center justify-content-between">
            <h6 class="card-title mb-0">Accidentes de trabajo</h6>
            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-primary" th:text="'NSS ' + ${nss}">NSS</span>
                <button type="button" class="btn btn-sm btn-primary" th:attr="data-nss=${nss}"
                        onclick="nuevoAccidente(this);">
                    <i class="ri-add-line me-1"></i> Nuevo registro
                </button>
            </div>
        </div>
        <div class="card-body">

            <div th:if="${#lists.isEmpty(accidentes)}" class="alert alert-warning mb-0" role="alert">
                No se encontraron accidentes de trabajo para este NSS.
            </div>

            <div th:unless="${#lists.isEmpty(accidentes)}">
                <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
                    <input type="text" class="form-control form-control-sm" style="max-width: 260px;"
                           placeholder="Buscar..." aria-label="Buscar en accidentes"
                           oninput="filtrarConsultas(this);">
                    <button type="button" class="btn btn-sm btn-success" onclick="exportarConsultasExcel(this);">
                        <i class="ri-file-excel-2-line me-1"></i> Exportar a Excel
                    </button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" data-export-name="accidentes">
                        <thead class="table-dark">
                            <tr>
                                <th>Fecha del accidente</th>
                                <th>Tipo de riesgo</th>
                                <th>Causa RT</th>
                                <th>Diagnostico</th>
                                <th>SDI</th>
                                <th>Status calificacion</th>
                                <th>Costo</th>
                                <th>Observaciones</th>
                                <th>Usuario</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${accidentes}">
                                <td th:text="${a.fechaAccidente}">-</td>
                                <td th:text="${a.tipoRiesgo}">-</td>
                                <td th:text="${a.causaRt}">-</td>
                                <td th:text="${a.diagnostico}">-</td>
                                <td th:text="${a.sdi}">-</td>
                                <td th:text="${a.statusCalificacion}">-</td>
                                <td th:text="${a.costo}">-</td>
                                <td th:text="${a.observaciones}">-</td>
                                <td th:text="${a.usuario}">-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
