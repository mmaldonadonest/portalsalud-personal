<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Detalle + seguimiento + evidencias de un caso de accidente de trabajo. Se inyecta en el
  modal compartido (#consultaModalBody), mismo mecanismo que consulta-detalle.html /
  incapacidad-detalle.html. Alcance: docs/entregable-liberacion-stoppers-salud.html §3
  (Registro -> Seguimiento -> Actualizacion -> Evidencias -> Cierre, SIN motor de
  investigacion). El estado (ABIERTO/CERRADO) es CALCULADO por AccidenteService a partir
  del historial - no existe columna ESTADO en Oracle.
-->
<div th:fragment="detalle">

    <div th:if="${accidente == null}" class="alert alert-warning mb-0" role="alert">
        No se encontro el caso de accidente.
    </div>

    <div th:if="${accidente != null}">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <span class="badge" th:classappend="${estado == 'CERRADO'} ? 'bg-secondary' : 'bg-success'"
                  th:text="${estado}" style="font-size:.85rem;">ABIERTO</span>
            <span class="text-muted fs-sm" th:text="'Caso #' + ${accidenteRegId}">Caso #1</span>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6" th:each="campo : ${ {
                    {'Fecha del accidente', accidente.fechaAccidente},
                    {'Tipo de riesgo', accidente.tipoRiesgo},
                    {'Causa RT', accidente.causaRt},
                    {'Diagnostico', accidente.diagnostico},
                    {'Status calificacion', accidente.statusCalificacion},
                    {'Observaciones del alta', accidente.observaciones}
                } }">
                <label class="form-label mb-1 text-muted fs-sm" th:text="${campo[0]}">Campo</label>
                <input type="text" readonly class="form-control form-control-sm" th:value="${campo[1]}">
            </div>
        </div>

        <hr class="my-3">
        <h6 class="mb-2"><i class="ri-history-line me-1"></i> Historial de seguimiento</h6>
        <div th:if="${#lists.isEmpty(historial)}" class="text-muted fs-sm mb-3">Sin seguimiento todavia.</div>
        <ul th:unless="${#lists.isEmpty(historial)}" class="list-group mb-3">
            <li th:each="s : ${historial}" class="list-group-item">
                <div class="d-flex justify-content-between align-items-center">
                    <span>
                        <span class="badge" th:classappend="${s.tipo == 'CIERRE'} ? 'bg-secondary' : 'bg-info-subtle text-info-emphasis'"
                              th:text="${s.tipo}">SEGUIMIENTO</span>
                        <small class="text-muted ms-2" th:text="${s.fechaSeguimiento}">fecha</small>
                    </span>
                    <small class="text-muted" th:text="${s.usuario}">usuario</small>
                </div>
                <div class="mt-1" th:text="${s.observaciones}">Observaciones</div>
            </li>
        </ul>

        <div th:if="${estado != 'CERRADO'}" class="card bg-light mb-3">
            <div class="card-body">
                <label class="form-label">Agregar seguimiento</label>
                <textarea class="form-control mb-2" id="accSeguimientoObs" rows="2"
                          placeholder="Observaciones / actualizacion del caso..."></textarea>
                <div class="d-flex gap-2 justify-content-end">
                    <button type="button" class="btn btn-outline-primary btn-sm"
                            th:attr="data-accidente-regid=${accidenteRegId}, data-tipo=SEGUIMIENTO"
                            onclick="guardarSeguimientoAccidente(this);">
                        <i class="ri-add-line me-1"></i> Agregar seguimiento
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm"
                            th:attr="data-accidente-regid=${accidenteRegId}, data-tipo=CIERRE"
                            onclick="guardarSeguimientoAccidente(this);">
                        <i class="ri-checkbox-circle-line me-1"></i> Cerrar caso
                    </button>
                </div>
                <div class="fs-sm mt-2" id="accSeguimientoStatus"></div>
            </div>
        </div>

        <hr class="my-3">
        <h6 class="mb-2"><i class="ri-attachment-2 me-1"></i> Evidencias</h6>
        <div class="row g-2 align-items-end mb-2">
            <div class="col-md-8">
                <input type="file" class="form-control" id="accEvidenciaFiles"
                       accept="application/pdf,image/png,image/jpeg" multiple>
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-primary w-100"
                        th:attr="data-nss=${nss}, data-relacion=${relacionEvidencias}, data-accidente-regid=${accidenteRegId}"
                        onclick="subirEvidenciaAccidente(this);">
                    <i class="ri-upload-2-line me-1"></i> Subir evidencia
                </button>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(evidencias)}" class="text-muted fs-sm">Sin evidencias.</div>
        <ul th:unless="${#lists.isEmpty(evidencias)}" class="list-group">
            <li th:each="e : ${evidencias}" class="list-group-item d-flex justify-content-between align-items-center">
                <span>
                    <i class="ri-file-line me-1"></i>
                    <span th:text="${e.name}">archivo</span>
                    <small class="text-muted" th:if="${e.sizeBytes != null}"
                           th:text="'(' + ${#numbers.formatInteger(e.sizeBytes / 1024, 1)} + ' KB)'">(KB)</small>
                </span>
                <span class="d-flex gap-2">
                    <a class="btn btn-sm btn-outline-primary" target="_blank" title="Descargar"
                       th:href="@{'/api/nss/consulta/file/' + ${e.id}}"><i class="ri-download-2-line"></i></a>
                    <button type="button" class="btn btn-sm btn-outline-danger" title="Borrar"
                            th:attr="data-id=${e.id}, data-accidente-regid=${accidenteRegId}"
                            onclick="borrarEvidenciaAccidente(this);"><i class="ri-delete-bin-line"></i></button>
                </span>
            </li>
        </ul>
    </div>

</div>
</body>
</html>
