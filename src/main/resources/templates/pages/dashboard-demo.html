<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::title}, ~{:: demoContent}, ~{::th:block[@id='pageScripts']}, ~{::th:block[@id='pageStyles']})}">
<head>
    <title>Dashboard KPIs (demo) | Portal Salud Personal</title>
</head>
<body>

<th:block id="pageStyles">
    <style>
        .chart-card .card-header { border-bottom: none; padding-bottom: 0; display: block; }
        .chart-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            margin-bottom: 3px;
        }
        .chart-eyebrow::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 18%, transparent);
        }
        .chart-eyebrow--tendencia { color: #2563EB; }
        .chart-eyebrow--ramo { color: #0EA5E9; }
        .chart-eyebrow--examen { color: #16A34A; }
        .chart-card .card-title-lg {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1e293b;
        }
        .recharts-tooltip-modern {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 12px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, .10);
            font-size: 12px;
            min-width: 140px;
        }
        .recharts-tooltip-modern .tt-title { font-weight: 700; margin-bottom: 4px; color: #1e293b; }
        .recharts-tooltip-modern .tt-row { display: flex; align-items: center; gap: 6px; color: #475569; }
        .recharts-tooltip-modern .tt-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
    </style>
</th:block>

<th:block th:fragment="demoContent">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <ol class="breadcrumb fs-sm mb-1">
                <li class="breadcrumb-item"><a th:href="@{/home}" href="/home">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">KPIs (demo)</li>
            </ol>
            <h4 class="main-title mb-0">Dashboard ligero de KPIs — demo (Recharts)</h4>
        </div>
        <a th:href="@{/dashboard-demo-apex}" href="/dashboard-demo-apex" class="btn btn-outline-primary btn-sm">Ver versión ApexCharts</a>
    </div>

    <div class="card card-one mb-3">
        <div class="card-body d-flex flex-wrap align-items-end gap-3">
            <div>
                <label class="form-label fs-12 mb-1">Fecha inicial</label>
                <input type="date" id="fFechaInicial" class="form-control form-control-sm" value="2023-01-01">
            </div>
            <div>
                <label class="form-label fs-12 mb-1">Fecha final</label>
                <input type="date" id="fFechaFinal" class="form-control form-control-sm" value="2026-12-31">
            </div>
            <button type="button" id="btnActualizar" class="btn btn-primary btn-sm">Actualizar</button>
            <span id="estado" class="fs-12 text-muted"></span>
        </div>
    </div>

    <div class="row g-3 mb-1" id="kpiCards">
        <div class="col-6 col-md-4 col-xl">
            <div class="card card-one">
                <div class="card-body">
                    <h3 class="card-value mb-1" id="kpiIncapacidades">—</h3>
                    <label class="card-title fw-medium text-dark mb-0">Incapacidades</label>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-xl">
            <div class="card card-one">
                <div class="card-body">
                    <h3 class="card-value mb-1" id="kpiAccidentes">—</h3>
                    <label class="card-title fw-medium text-dark mb-0">Accidentes</label>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-xl">
            <div class="card card-one">
                <div class="card-body">
                    <h3 class="card-value mb-1" id="kpiConsultas">—</h3>
                    <label class="card-title fw-medium text-dark mb-0">Consultas</label>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-xl">
            <div class="card card-one">
                <div class="card-body">
                    <h3 class="card-value mb-1" id="kpiExamenes">—</h3>
                    <label class="card-title fw-medium text-dark mb-0">Exámenes</label>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-xl">
            <div class="card card-one" style="background:#f0f7ff;">
                <div class="card-body">
                    <h3 class="card-value mb-1" id="kpiTotal">—</h3>
                    <label class="card-title fw-medium text-dark mb-0">Total general</label>
                </div>
            </div>
        </div>
    </div>
    <p class="fs-11 text-muted mb-3" id="notaSinFecha"></p>

    <div class="row g-3">
        <div class="col-12">
            <div class="card card-one chart-card">
                <div class="card-header">
                    <span class="chart-eyebrow chart-eyebrow--tendencia">KPIs · Portal Salud</span>
                    <div class="card-title-lg">Tendencia mensual combinada</div>
                </div>
                <div class="card-body"><div id="chartTendencia"></div></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card card-one chart-card">
                <div class="card-header">
                    <span class="chart-eyebrow chart-eyebrow--ramo">Incapacidades</span>
                    <div class="card-title-lg">Por Ramo</div>
                </div>
                <div class="card-body"><div id="chartRamo"></div></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card card-one chart-card">
                <div class="card-header">
                    <span class="chart-eyebrow chart-eyebrow--examen">Examen médico</span>
                    <div class="card-title-lg">Resultado</div>
                </div>
                <div class="card-body"><div id="chartExamen"></div></div>
            </div>
        </div>
    </div>
</th:block>

<th:block id="pageScripts">
    <!-- Misma libreria de graficas que salud-ocupacional-v2 (recharts) - self-hosteada aqui
         igual que chart.js/apexcharts, sin build/CDN. Recharts es un set de componentes React,
         asi que tambien se incluyen React/ReactDOM/PropTypes (UMD) solo para esta pagina. -->
    <script th:src="@{/theme/lib/react/react.production.min.js}" src="/theme/lib/react/react.production.min.js"></script>
    <script th:src="@{/theme/lib/prop-types/prop-types.min.js}" src="/theme/lib/prop-types/prop-types.min.js"></script>
    <script th:src="@{/theme/lib/react-dom/react-dom.production.min.js}" src="/theme/lib/react-dom/react-dom.production.min.js"></script>
    <script th:src="@{/theme/lib/recharts/Recharts.js}" src="/theme/lib/recharts/Recharts.js"></script>
    <script th:inline="javascript">
        (function () {
            var h = React.createElement;
            var R = Recharts;
            var roots = {};

            function montar(id, elemento) {
                if (!roots[id]) {
                    roots[id] = ReactDOM.createRoot(document.getElementById(id));
                }
                roots[id].render(elemento);
            }

            function numero(n) {
                return (n || 0).toLocaleString('es-MX');
            }

            function tooltipModern(props) {
                if (!props.active || !props.payload || !props.payload.length) return null;
                return h('div', { className: 'recharts-tooltip-modern' },
                    h('div', { className: 'tt-title' }, props.label),
                    props.payload.map(function (p, i) {
                        return h('div', { key: i, className: 'tt-row' },
                            h('span', { className: 'tt-dot', style: { background: p.color || p.fill } }),
                            h('span', null, p.name + ': ' + numero(p.value))
                        );
                    })
                );
            }

            async function cargar() {
                var fechaInicial = document.getElementById('fFechaInicial').value;
                var fechaFinal = document.getElementById('fFechaFinal').value;
                var estado = document.getElementById('estado');
                if (!fechaInicial || !fechaFinal) {
                    estado.textContent = 'Selecciona ambas fechas.';
                    return;
                }
                estado.textContent = 'Cargando...';
                var qs = 'fechaInicial=' + encodeURIComponent(fechaInicial) + '&fechaFinal=' + encodeURIComponent(fechaFinal);
                try {
                    var [resumenRes, incapacidadesRes, examenRes] = await Promise.all([
                        fetch(contextPath + 'api/dashboard/resumen-general?' + qs),
                        fetch(contextPath + 'api/dashboard/incapacidades?' + qs),
                        fetch(contextPath + 'api/dashboard/examen?' + qs)
                    ]);
                    if (!resumenRes.ok || !incapacidadesRes.ok || !examenRes.ok) {
                        estado.textContent = 'Error al consultar los endpoints (HTTP ' + resumenRes.status + ').';
                        return;
                    }
                    var resumen = await resumenRes.json();
                    var incapacidades = await incapacidadesRes.json();
                    var examen = await examenRes.json();

                    pintarKpis(resumen);
                    pintarTendencia(resumen.tendenciaMensual);
                    pintarRamo(incapacidades.porRamo);
                    pintarExamen(examen);

                    estado.textContent = 'Actualizado.';
                } catch (e) {
                    estado.textContent = 'Error de red al consultar el dashboard.';
                }
            }

            function pintarKpis(resumen) {
                document.getElementById('kpiIncapacidades').textContent = numero(resumen.totalIncapacidades);
                document.getElementById('kpiAccidentes').textContent = numero(resumen.totalAccidentes);
                document.getElementById('kpiConsultas').textContent = numero(resumen.totalConsultas);
                document.getElementById('kpiExamenes').textContent = numero(resumen.totalExamenes);
                document.getElementById('kpiTotal').textContent = numero(resumen.totalGeneral);
            }

            var LINEAS_TENDENCIA = [
                { key: 'incapacidades', nombre: 'Incapacidades', color: '#0284C7' },
                { key: 'accidentes', nombre: 'Accidentes', color: '#DC2626' },
                { key: 'consultas', nombre: 'Consultas', color: '#16A34A' },
                { key: 'examenes', nombre: 'Exámenes', color: '#7C3AED' }
            ];

            // Recharts no trae zoom con drag del mouse (solo el Brush, un slider aparte) -
            // se implementa a mano con el patron oficial "Highlight and zoom": se capturan
            // los eventos de mouse del propio AreaChart, se dibuja un ReferenceArea mientras
            // se arrastra, y al soltar se recorta el arreglo de datos al rango seleccionado.
            function TendenciaChart(props) {
                var todos = props.data;
                var zoomState = React.useState(todos);
                var zoomData = zoomState[0], setZoomData = zoomState[1];
                var leftState = React.useState(''); var left = leftState[0], setLeft = leftState[1];
                var rightState = React.useState(''); var right = rightState[0], setRight = rightState[1];
                var draggingState = React.useState(false); var arrastrando = draggingState[0], setArrastrando = draggingState[1];

                React.useEffect(function () {
                    setZoomData(todos);
                    setLeft('');
                    setRight('');
                    setArrastrando(false);
                }, [todos]);

                function onMouseDown(e) {
                    if (!e || !e.activeLabel) return;
                    setLeft(e.activeLabel);
                    setRight(e.activeLabel);
                    setArrastrando(true);
                }
                function onMouseMove(e) {
                    if (!arrastrando || !e || !e.activeLabel) return;
                    setRight(e.activeLabel);
                }
                function onMouseUp() {
                    if (!arrastrando) return;
                    setArrastrando(false);
                    if (!left || !right || left === right) { setLeft(''); setRight(''); return; }
                    var i1 = todos.findIndex(function (d) { return d.mes === left; });
                    var i2 = todos.findIndex(function (d) { return d.mes === right; });
                    var lo = Math.min(i1, i2), hi = Math.max(i1, i2);
                    setZoomData(todos.slice(lo, hi + 1));
                    setLeft('');
                    setRight('');
                }
                function resetZoom() {
                    setZoomData(todos);
                }

                var haySeleccion = zoomData.length !== todos.length;

                return h('div', null,
                    h('div', { style: { minHeight: 26 } },
                        haySeleccion ? h('button', {
                            type: 'button', className: 'btn btn-sm btn-outline-secondary', onClick: resetZoom
                        }, 'Reset zoom') : h('span', { className: 'fs-11 text-muted' }, 'Arrastra sobre la gráfica para hacer zoom')
                    ),
                    h(R.ResponsiveContainer, { width: '100%', height: 320 },
                        h(R.AreaChart, {
                                data: zoomData, margin: { top: 10, right: 10, left: 0, bottom: 0 },
                                onMouseDown: onMouseDown, onMouseMove: onMouseMove, onMouseUp: onMouseUp
                            },
                            h('defs', null,
                                LINEAS_TENDENCIA.map(function (l) {
                                    return h('linearGradient', { key: 'grad-' + l.key, id: 'grad-' + l.key, x1: 0, y1: 0, x2: 0, y2: 1 },
                                        h('stop', { offset: '5%', stopColor: l.color, stopOpacity: 0.35 }),
                                        h('stop', { offset: '95%', stopColor: l.color, stopOpacity: 0.02 })
                                    );
                                })
                            ),
                            h(R.CartesianGrid, { strokeDasharray: '3 3', vertical: false, stroke: '#e5e9f2' }),
                            h(R.XAxis, { dataKey: 'mes', tick: { fontSize: 11, fill: '#94a3b8' }, axisLine: { stroke: '#e5e9f2' }, tickLine: false, allowDataOverflow: true }),
                            h(R.YAxis, { tick: { fontSize: 11, fill: '#94a3b8' }, axisLine: false, tickLine: false, width: 34 }),
                            h(R.Tooltip, { content: tooltipModern }),
                            h(R.Legend, { iconType: 'circle', wrapperStyle: { fontSize: 12 } }),
                            LINEAS_TENDENCIA.map(function (l) {
                                return h(R.Area, {
                                    key: l.key, type: 'monotone', dataKey: l.key, name: l.nombre,
                                    stroke: l.color, strokeWidth: 2, fill: 'url(#grad-' + l.key + ')',
                                    dot: { r: 3, strokeWidth: 0, fill: l.color },
                                    activeDot: { r: 5 }
                                });
                            }),
                            (left && right && left !== right) ? h(R.ReferenceArea, {
                                x1: left, x2: right, strokeOpacity: 0.3, fill: '#2563EB', fillOpacity: 0.15
                            }) : null
                        )
                    )
                );
            }

            function pintarTendencia(puntos) {
                puntos = puntos || [];
                // "Sin fecha" es un bucket combinado de registros sin fecha reconocida, no un
                // mes real - se excluye de la linea de tiempo para no romper la continuidad,
                // y se muestra aparte como nota (ver memoria dashboard-kpis-use-case).
                var sinFecha = puntos.find(function (p) { return p.mes === 'Sin fecha'; });
                var meses = puntos.filter(function (p) { return p.mes !== 'Sin fecha'; });
                var nota = document.getElementById('notaSinFecha');
                if (sinFecha) {
                    var total = sinFecha.incapacidades + sinFecha.accidentes + sinFecha.consultas + sinFecha.examenes;
                    nota.textContent = total + ' registro(s) con fecha no reconocida, no incluidos en la gráfica de tendencia.';
                } else {
                    nota.textContent = '';
                }

                montar('chartTendencia', h(TendenciaChart, { data: meses }));
            }

            function pintarRamo(porRamo) {
                var data = (porRamo || []).map(function (r) {
                    return { clave: r.clave || '(sin dato)', cantidad: r.cantidad };
                });
                var elemento = h(R.ResponsiveContainer, { width: '100%', height: 300 },
                    h(R.BarChart, { data: data, margin: { top: 10, right: 10, left: 0, bottom: 0 } },
                        h('defs', null,
                            h('linearGradient', { id: 'grad-ramo', x1: 0, y1: 0, x2: 0, y2: 1 },
                                h('stop', { offset: '5%', stopColor: '#0284C7', stopOpacity: 0.95 }),
                                h('stop', { offset: '95%', stopColor: '#0284C7', stopOpacity: 0.55 })
                            )
                        ),
                        h(R.CartesianGrid, { strokeDasharray: '3 3', vertical: false, stroke: '#e5e9f2' }),
                        h(R.XAxis, { dataKey: 'clave', tick: { fontSize: 11, fill: '#94a3b8' }, axisLine: { stroke: '#e5e9f2' }, tickLine: false, angle: -15, textAnchor: 'end', height: 60 }),
                        h(R.YAxis, { tick: { fontSize: 11, fill: '#94a3b8' }, axisLine: false, tickLine: false, width: 34 }),
                        h(R.Tooltip, { content: tooltipModern, cursor: { fill: '#f1f5f9' } }),
                        h(R.Bar, { dataKey: 'cantidad', name: 'Incapacidades', fill: 'url(#grad-ramo)', radius: [6, 6, 0, 0] })
                    )
                );
                montar('chartRamo', elemento);
            }

            function pintarExamen(examen) {
                var colores = ['#16A34A', '#DC2626', '#D97706', '#0284C7'];
                var data = [
                    { name: 'Apto', value: examen.totalApto },
                    { name: 'No apto', value: examen.totalNoApto },
                    { name: 'Apto condicionado', value: examen.totalAptoCondicionado },
                    { name: 'Apto restringido', value: examen.totalAptoRestringido }
                ];
                var total = examen.totalExamenes || 0;
                var centro = h(R.Label, {
                    position: 'center',
                    content: function (props) {
                        var cx = props.viewBox.cx, cy = props.viewBox.cy;
                        return h('g', null,
                            h('text', { x: cx, y: cy - 4, textAnchor: 'middle', fontSize: 22, fontWeight: 700, fill: '#1e293b' }, numero(total)),
                            h('text', { x: cx, y: cy + 16, textAnchor: 'middle', fontSize: 11, fill: '#94a3b8' }, 'Total')
                        );
                    }
                });
                var elemento = h(R.ResponsiveContainer, { width: '100%', height: 300 },
                    h(R.PieChart, null,
                        h(R.Tooltip, { content: tooltipModern }),
                        h(R.Legend, { iconType: 'circle', wrapperStyle: { fontSize: 12 } }),
                        h(R.Pie, { data: data, dataKey: 'value', nameKey: 'name', innerRadius: 55, outerRadius: 90, paddingAngle: 3, cornerRadius: 6 },
                            data.map(function (d, i) { return h(R.Cell, { key: 'c' + i, fill: colores[i], stroke: 'none' }); }),
                            centro
                        )
                    )
                );
                montar('chartExamen', elemento);
            }

            document.getElementById('btnActualizar').addEventListener('click', cargar);
            cargar();
        })();
    </script>
</th:block>
</body>
</html>
