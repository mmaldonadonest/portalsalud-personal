                    }
                    var el = grupo.querySelector('[name="' + s + '"]');
                    if (el && el.tagName === 'SELECT') { r.selects.push(el); } else if (el) { r.textos.push(el); }
                });
                return r;
            }

            function appObs(sel) {
                return sel.parentElement ? sel.parentElement.querySelector('input[type=text]') : null;
            }

            function appEstado(c) {
                var e = [];
                c.selects.forEach(function (s) { e.push(s.value === '1' ? 'si' : s.value === '0' ? 'no' : ''); });
                c.textos.forEach(function (t) {
                    var v = t.value.trim();
                    e.push(!v ? '' : /^(NEGADOS?|NO)$/i.test(v) ? 'no' : 'si');
                });
                if (e.indexOf('si') >= 0) { return 'si'; }
                return e.length && e.every(function (x) { return x === 'no'; }) ? 'no' : '';
            }

            function appEtiqueta(sel) {
                var col = sel.closest('.col-md-6');
                var l = col ? col.querySelector('label') : null;
                return l ? l.textContent.trim() : sel.name;
            }

            // Renglon por categoria. La observacion se puede escribir cuando la categoria es UNA
            // pregunta con observacion o un tag; si agrupa varias preguntas, se resume y su nombre
            // abre el detalle debajo del renglon (exAppDetalle) para marcar cuales.
            async function exAppResumen(pane) {
                var grupo = pane.closest('.accordion-body');
                var detAbierto = pane.querySelector('.exapp-det');
                var detIdx = detAbierto ? detAbierto.dataset.i : null;
                appDetalleCerrar(pane);
                var appPanes = Array.prototype.slice.call(grupo.querySelectorAll('.tab-pane[data-seccion^="APP:"]'));
                var faltan = appPanes.filter(function (p) { return p.dataset.loaded !== 'true'; });
                if (faltan.length) {
                    pane.innerHTML = '<div class="text-muted fs-sm py-2"><span class="spinner-border spinner-border-sm me-1"></span> Cargando antecedentes...</div>';
                    try {
                        var body = new URLSearchParams();
                        body.append('nss', (input.value || '').trim());
                        var csrf = form.querySelector('input[type="hidden"][name]');
                        if (csrf && csrf.name) { body.append(csrf.name, csrf.value); }
                        var resp = await fetch(contextPath + 'api/nss/examen/secciones', { method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' }, body: body.toString() });
                        if (resp.ok) {
                            var htmls = await resp.json();
                            faltan.forEach(function (p) {
                                var h = htmls[p.getAttribute('data-seccion')];
                                if (h) { p.innerHTML = h; p.dataset.loaded = 'true'; }
                            });
                        }
                    } catch (e) { /* abajo se avisa si algo no cargo */ }
                    for (var i = 0; i < faltan.length; i++) { await cargarPaneExamen(faltan[i]); }
                }
                var filas = APP_RESUMEN.map(function (cat, i) {
                    var c = appCampos(grupo, cat[1]);
                    var est = appEstado(c);
                    var editable = (c.selects.length === 1 && appObs(c.selects[0])) || (c.selects.length === 0 && c.textos.length === 1);
                    var obs = '';
                    if (c.selects.length === 1 && appObs(c.selects[0])) { obs = appObs(c.selects[0]).value; }
                    else if (c.textos.length === 1 && !c.selects.length) { obs = c.textos[0].value; }
                    else if (est === 'no') { obs = 'NEGADOS'; }
                    else if (est === 'si' && c.selects.length > 1) {
                        obs = c.selects.filter(function (s) { return s.value === '1'; }).map(function (s) {
                            var o = appObs(s);
                            return appEtiqueta(s) + (o && o.value.trim() && !/NEGAD/i.test(o.value) ? ' (' + o.value.trim() + ')' : '');
                        }).join(', ');
                    }
                    var varias = c.selects.length > 1;
                    var sinCampos = !c.selects.length && !c.textos.length;
                    var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); };
                    // Dos columnas como el FT-SO-17 (16-oct-2026): con No + NEGADOS la observacion es una
                    // nota corta en el mismo renglon; la caja solo aparece con Si o con texto propio.
                    var conCaja = editable && (est === 'si' || (obs.trim() !== '' && !/^NEGAD/i.test(obs.trim())));
                    var nota = conCaja ? ''
                        : editable ? (est === 'no' ? (obs.trim() || 'NEGADOS') : '')
                        : (obs || (varias ? 'Varias preguntas' : '—'));
                    return '<div class="exapp-fila" data-i="' + i + '">'
                        // varias preguntas: el nombre lleva a su pestana (la nota se recorta en pantallas angostas)
                        + (varias
                            ? '<a href="#" class="lbl" title="Ver / ocultar el detalle" onclick="exAppDetalle(this); return false;">' + cat[0] + ' <i class="ri-arrow-down-s-line"></i></a>'
                            : '<span class="lbl">' + cat[0] + '</span>')
                        + '<span class="nota" title="' + esc(nota) + '">' + esc(nota) + '</span>'
                        + '<div class="btn-group exapp-btns" role="group">'
                        + '<button type="button" class="btn btn-outline-secondary' + (est === 'no' ? ' activo-no' : '') + '" onclick="exAppMarcar(this, \'no\')"' + (sinCampos ? ' disabled' : '') + '>No</button>'
                        + '<button type="button" class="btn btn-outline-secondary' + (est === 'si' ? ' activo-si' : '') + '" onclick="exAppMarcar(this, \'si\')"' + (sinCampos ? ' disabled' : '') + '>Sí</button>'
                        + '</div>'
                        + (conCaja
                            ? '<input type="text" class="form-control form-control-sm obs" placeholder="Describe el antecedente" value="' + esc(obs) + '" oninput="exAppObs(this)">'
                            : '')
                        + '</div>';
                });
                pane.innerHTML = '<div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">'
                    + '<span class="fs-sm text-muted">Como el formato' + exFormatoActual() + ': «NEGADOS» en lo que no aplique; marca Sí solo donde haya antecedente.</span>'
                    + '<button type="button" class="btn btn-sm btn-outline-success" onclick="exAppTodoNormal(this)"><i class="ri-check-double-line me-1"></i>Todo normal</button></div>'
                    + '<div class="exapp-lista">' + filas.join('') + '</div>';
                if (detIdx !== null) {
                    var a = pane.querySelector('.exapp-fila[data-i="' + detIdx + '"] a.lbl');
                    if (a) { exAppDetalle(a, true); }
                }
            }

            // Detalle en linea (16-oct-2026): la seccion APP real se MUEVE debajo del renglon (no se
            // copia: duplicaria los campos al guardar) y al cerrar regresa a su pestana oculta.
            function appDetalleCerrar(pane) {
                pane.querySelectorAll('.exapp-det').forEach(function (caja) {
                    var origen = document.getElementById(caja.dataset.origen);
                    var sec = caja.querySelector('.exsec');
                    if (origen && sec) { origen.appendChild(sec); }
                    caja.remove();
                });
                pane.querySelectorAll('.exapp-fila.abierta').forEach(function (f) { f.classList.remove('abierta'); });
            }

            function appCat(el) {
                var fila = el.closest('.exapp-fila');
                var grupo = el.closest('.accordion-body');
                return { fila: fila, grupo: grupo, c: appCampos(grupo, APP_RESUMEN[parseInt(fila.dataset.i, 10)][1]) };
            }

            function appNo(c) {
                c.selects.forEach(function (s) {
                    s.value = '0';
                    var o = appObs(s);
                    if (o && (!o.value.trim() || /NEGAD/i.test(o.value))) { o.value = 'NEGADOS'; }
                });
                c.textos.forEach(function (t) { t.value = 'NEGADOS'; });
            }

            window.exAppMarcar = function (btn, valor) {
                var x = appCat(btn);
                if (valor === 'no') {
                    appNo(x.c);
                } else if (x.c.selects.length > 1) {
                    exAppDetalle(btn, true);   // varias preguntas: el medico marca cuales en el detalle
                    return;
                } else {
                    x.c.selects.forEach(function (s) {
                        s.value = '1';
                        var o = appObs(s);
                        if (o && /NEGAD/i.test(o.value)) { o.value = ''; }
                    });
                    x.c.textos.forEach(function (t) { if (/^(NEGADOS?|NO)$/i.test(t.value.trim())) { t.value = ''; } });
                }
                var pane = x.fila.closest('.tab-pane');
                var i = x.fila.dataset.i;
                exAppResumen(pane).then(function () {
                    var inp = pane.querySelector('.exapp-fila[data-i="' + i + '"] input');
                    if (valor === 'si' && inp) { inp.focus(); }
                });
            };

            window.exAppObs = function (inp) {
                var x = appCat(inp);
                if (x.c.selects.length === 1 && appObs(x.c.selects[0])) { appObs(x.c.selects[0]).value = inp.value; }
                else if (x.c.textos.length === 1) { x.c.textos[0].value = inp.value; }
                // los botones reflejan lo escrito (un antecedente escrito en un tag = Si)
                var est = appEstado(x.c);
                var b = x.fila.querySelectorAll('.exapp-btns button');
                b[0].classList.toggle('activo-no', est === 'no');
                b[1].classList.toggle('activo-si', est === 'si');
            };

            window.exAppDetalle = function (el, soloAbrir) {
                var x = appCat(el);
                var pane = x.fila.closest('.tab-pane');
                var abierta = pane.querySelector('.exapp-det');
                if (abierta && abierta.dataset.i === x.fila.dataset.i) {
                    if (!soloAbrir) { appDetalleCerrar(pane); }
                    return;
                }
                appDetalleCerrar(pane);
                var primero = x.c.selects[0];
                var sec = primero ? primero.closest('.exsec') : null;
                var origen = sec ? sec.closest('.tab-pane') : null;
                if (!sec || !origen) { return; }
                var caja = document.createElement('div');
                caja.className = 'exapp-det';
                caja.dataset.i = x.fila.dataset.i;
                caja.dataset.origen = origen.id;
                caja.appendChild(sec);
                // en dos columnas se abre debajo del PAR de renglones, a todo el ancho
                var lista = x.fila.parentElement;
                var filas = Array.prototype.filter.call(lista.children, function (n) { return n.classList.contains('exapp-fila'); });
                var idx = filas.indexOf(x.fila);
                var cols = getComputedStyle(lista).gridTemplateColumns.split(' ').length;
                var ancla = cols > 1 && idx % 2 === 0 && filas[idx + 1] ? filas[idx + 1] : x.fila;
                ancla.after(caja);
                x.fila.classList.add('abierta');
                exSecPintarSino(caja);
                caja.scrollIntoView({ block: 'nearest' });
            };

            // Cambio de Si/No dentro de un detalle abierto: el renglon del resumen se actualiza
            var exAppTimer = null;
            document.addEventListener('change', function (e) {
                if (e.target.tagName !== 'SELECT' || !e.target.closest('.exapp-det')) { return; }
                var pane = e.target.closest('.tab-pane[data-resumen="app"]');
                clearTimeout(exAppTimer);
                exAppTimer = setTimeout(function () { if (pane) { exAppResumen(pane); } }, 150);
            });

            // Regreso a las pestanas (por si alguna captura no cabe en el resumen) y vuelta al resumen
            window.exAppVerPestanas = function (a) {
                var body = a.closest('.accordion-body');
                var ul = body.querySelector('.examen-tabs');
                var resumen = body.querySelector('.tab-pane[data-resumen]');
                if (resumen) { appDetalleCerrar(resumen); }
                var verTabs = ul.classList.contains('d-none');
                ul.classList.toggle('d-none', !verTabs);
                a.textContent = verTabs ? 'Ver resumen' : 'Ver por pestañas';
                if (!verTabs && resumen) {
                    var b = ul.querySelector('[data-bs-target="#' + resumen.id + '"]');
                    if (b) { bootstrap.Tab.getOrCreateInstance(b).show(); }
                }
            };

            window.exAppTodoNormal = function (btn) {
                var pane = btn.closest('.tab-pane');
                var grupo = pane.closest('.accordion-body');
                APP_RESUMEN.forEach(function (cat) {
                    var c = appCampos(grupo, cat[1]);
                    if (appEstado(c) === '') { appNo(c); }   // solo lo que no tiene respuesta
                });
                exAppResumen(pane);
            };


            // ===== Resumen por seccion (16-oct-2026): heredofamiliares y exploracion fisica =====
            // Un renglon por seccion del grupo con su estado; el nombre abre la seccion real debajo
            // (se MUEVE, como en patologicos) y el boton de palomita aplica su "Todo normal".
            function exListaEstado(sec) {
                var dientes = sec.querySelectorAll('.exini-odonto input[type=hidden]');
                if (dientes.length) {
                    var con = Array.prototype.filter.call(dientes, function (h) { return h.value.trim() !== ''; }).length;
                    return con ? { texto: con + (con === 1 ? ' diente' : ' dientes') + ' con hallazgo' } : { texto: 'Sin hallazgos' };
                }
                var tot = 0, llenos = 0, hall = [], conSino = false;
                var etiqueta = function (el) {
                    var col = el.closest('.col-md-6, .col-12, .celda');
                    var l = col ? col.querySelector('label, .lbl') : null;
                    return l ? l.textContent.trim() : '';
                };
                sec.querySelectorAll('.exsino select').forEach(function (s) {
                    tot++; conSino = true;
                    if (s.value !== '') { llenos++; }
                    if (s.value === '1') {
                        var o = s.parentElement.querySelector('input[type=text]');
                        var ov = o ? o.value.trim() : '';
                        hall.push(etiqueta(s) + (ov && !/NEGAD/i.test(ov) ? ' (' + ov + ')' : ''));
                    }
                });
                sec.querySelectorAll('.exini-okno').forEach(function (fila) {
                    var inp = fila.querySelector('input[type=text]');
                    if (!inp) { return; }
                    tot++;
                    var v = inp.value.trim();
                    if (v) { llenos++; if (!exIniOkNoEsOk(fila, v)) { hall.push(etiqueta(fila) + ': ' + v); } }
                });
                sec.querySelectorAll('.exini-chips input[type=hidden]').forEach(function (h) {
                    tot++; if (h.value.trim()) { llenos++; }
                });
                sec.querySelectorAll('input[type=text][name], input[type=number][name], input[type=date][name], textarea[name]').forEach(function (el) {
                    if (el.closest('.exsino, .exini-okno')) { return; }
                    tot++; if (el.value.trim()) { llenos++; }
                });
                if (hall.length) { return { texto: (conSino ? 'Sí: ' : 'Hallazgos: ') + hall.join(', '), hallazgo: true }; }
                if (!tot) { return { texto: '—' }; }
                if (llenos === tot) { return { texto: conSino ? 'NEGADOS' : 'Normal' }; }
                return { texto: llenos ? llenos + ' de ' + tot + ' capturados' : 'Sin capturar' };
            }

            function exListaSeccion(fila) {
                var pane = fila.closest('.tab-pane');
                var caja = pane.querySelector('.exapp-det[data-origen="' + fila.dataset.sec + '"]');
                var origen = document.getElementById(fila.dataset.sec);
                return (caja && caja.querySelector('.exsec')) || (origen && origen.querySelector('.exsec'));
            }

            function exListaPintarFila(fila) {
                var sec = exListaSeccion(fila);
                var nota = fila.querySelector('.nota');
                if (!sec || !nota) { return; }
                var e = exListaEstado(sec);
                nota.textContent = e.texto;
                nota.title = e.texto;
                nota.classList.toggle('hallazgo', !!e.hallazgo);
            }

            async function exListaResumen(pane) {
                var grupo = pane.closest('.accordion-body');
                var detAbierto = pane.querySelector('.exapp-det');
                var detSec = detAbierto ? detAbierto.dataset.origen : null;
                appDetalleCerrar(pane);
                var panes = Array.prototype.slice.call(grupo.querySelectorAll('.tab-pane[data-seccion]'));
                var faltan = panes.filter(function (p) { return p.dataset.loaded !== 'true'; });
                if (faltan.length) {
                    pane.innerHTML = '<div class="text-muted fs-sm py-2"><span class="spinner-border spinner-border-sm me-1"></span> Cargando secciones...</div>';
                    try {
                        var body = new URLSearchParams();
                        body.append('nss', (input.value || '').trim());
                        var csrf = form.querySelector('input[type="hidden"][name]');
                        if (csrf && csrf.name) { body.append(csrf.name, csrf.value); }
                        var resp = await fetch(contextPath + 'api/nss/examen/secciones', { method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' }, body: body.toString() });
                        if (resp.ok) {
                            var htmls = await resp.json();
                            faltan.forEach(function (p) {
                                var h = htmls[p.getAttribute('data-seccion')];
                                if (h) { p.innerHTML = h; p.dataset.loaded = 'true'; }
                            });
                        }
                    } catch (e) { /* las que falten se piden una por una */ }
                    for (var i = 0; i < faltan.length; i++) { await cargarPaneExamen(faltan[i]); }
                }
                var filas = panes.filter(function (p) { return !exOcultoTipo(p); }).map(function (p) {
                    var sec = p.querySelector('.exsec');
                    var normal = sec ? sec.querySelector('.card-header [onclick^="exSecTodoNormal"]') : null;
                    var nombre = p.getAttribute('data-seccion');
                    // como lo llama el examen inicial: el grupo ya se llama "Exploracion fisica"
                    if (nombre === 'Exploración física') { nombre = 'Signos vitales y exploración general'; }
                    return '<div class="exapp-fila" data-sec="' + p.id + '">'
                        + '<a href="#" class="lbl" title="Ver / ocultar la sección" onclick="exListaDetalle(this); return false;">' + nombre + ' <i class="ri-arrow-down-s-line"></i></a>'
                        + '<span class="nota"></span>'
                        + (normal ? '<button type="button" class="btn btn-sm btn-outline-success exlista-ok" title="Todo normal en esta sección" onclick="exListaNormal(this)"><i class="ri-check-line"></i></button>' : '<span></span>')
                        + '</div>';
                });
                var todos = panes.some(function (p) { return !exOcultoTipo(p) && p.querySelector('.card-header [onclick^="exSecTodoNormal"]'); });
                pane.innerHTML = '<div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">'
                    + '<span class="fs-sm text-muted">Pica el nombre para capturar la sección; la palomita aplica «Todo normal» en lo vacío.</span>'
                    + (todos ? '<button type="button" class="btn btn-sm btn-outline-success" onclick="exListaTodoNormal(this)"><i class="ri-check-double-line me-1"></i>Todo normal</button>' : '')
                    + '</div><div class="exapp-lista">' + filas.join('') + '</div>';
                pane.querySelectorAll('.exapp-fila').forEach(exListaPintarFila);
                if (detSec) {
                    var a = pane.querySelector('.exapp-fila[data-sec="' + detSec + '"] a.lbl');
                    if (a) { exListaDetalle(a, true); }
                }
            }

            window.exListaDetalle = function (el, soloAbrir) {
                var fila = el.closest('.exapp-fila');
                var pane = fila.closest('.tab-pane');
                var abierta = pane.querySelector('.exapp-det');
                if (abierta && abierta.dataset.origen === fila.dataset.sec) {
                    if (!soloAbrir) { appDetalleCerrar(pane); exListaPintarFila(fila); }
                    return;
                }
                appDetalleCerrar(pane);
                var origen = document.getElementById(fila.dataset.sec);
                var sec = origen ? origen.querySelector('.exsec') : null;
                if (!sec) { return; }
                var caja = document.createElement('div');
                caja.className = 'exapp-det';
                caja.dataset.origen = origen.id;
                caja.appendChild(sec);
                var lista = fila.parentElement;
                var filas = Array.prototype.filter.call(lista.children, function (n) { return n.classList.contains('exapp-fila'); });
                var idx = filas.indexOf(fila);
                var cols = getComputedStyle(lista).gridTemplateColumns.split(' ').length;
                var ancla = cols > 1 && idx % 2 === 0 && filas[idx + 1] ? filas[idx + 1] : fila;
                ancla.after(caja);
                fila.classList.add('abierta');
                exSecPintarSino(caja);
                caja.scrollIntoView({ block: 'nearest' });
            };

            window.exListaNormal = function (btn) {
                var fila = btn.closest('.exapp-fila');
                var sec = exListaSeccion(fila);
                var b = sec ? sec.querySelector('.card-header [onclick^="exSecTodoNormal"]') : null;
                if (b) { exSecTodoNormal(b); }
                exListaPintarFila(fila);
            };

            window.exListaTodoNormal = function (btn) {
                btn.closest('.tab-pane').querySelectorAll('.exlista-ok').forEach(function (b) { exListaNormal(b); });
            };

            // Captura dentro de un detalle abierto: solo se repinta su renglon (sin mover nada,
            // para no quitarle el foco al campo que se esta llenando). Los botones OK/NO, chips y
            // Si/No cambian valores por JS, por eso tambien se repinta despues de cada clic.
            function exListaTrasCaptura(e, diferido) {
                var caja = e.target.closest ? e.target.closest('.exapp-det') : null;
                var pane = caja ? caja.closest('.tab-pane[data-resumen="lista"]') : null;
                if (!pane) { return; }
                var pintar = function () {
                    var fila = pane.querySelector('.exapp-fila[data-sec="' + caja.dataset.origen + '"]');
                    if (fila) { exListaPintarFila(fila); }
                };
                if (diferido) { setTimeout(pintar, 0); } else { pintar(); }
            }
            document.addEventListener('change', function (e) { exListaTrasCaptura(e, false); });
            document.addEventListener('input', function (e) { exListaTrasCaptura(e, false); });
            document.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('button')) { exListaTrasCaptura(e, true); } });

            // Post incapacidad (29-oct-2026): fecha de termino = inicio + dias - 1 (el dia de inicio cuenta como
            // dia de incapacidad: 1 dia desde el 05 termina el 05). Se calcula y queda de solo lectura para que no
            // contradiga a los dias; si falta el inicio o los dias, el campo queda libre como antes.
            // Las fechas se teclean como texto dd/mm/aaaa (mas rapido que el control de fecha del navegador); lo
            // que se guarda es el hidden con el name del campo, en ISO (examen-seccion.html).
            function exIncIso(txt) {
                var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(txt || '');
                if (!m || +m[3] < 1900) { return ''; }
                var f = new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
                // 31/02 no existe: Date lo pasaria a marzo
                if (f.getUTCDate() !== +m[1] || f.getUTCMonth() !== +m[2] - 1) { return ''; }
                return m[3] + '-' + m[2] + '-' + m[1];
            }
            function exIncDmy(iso) {
                return /^\d{4}-\d{2}-\d{2}$/.test(iso || '') ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : (iso || '');
            }
            function exIncOculto(vis) { return vis.parentElement.querySelector('input[type="hidden"]'); }
            function exIncTermino(raiz) {
                // al cargar la seccion el texto visible se llena con lo guardado
                raiz.querySelectorAll('.exinc-fecha').forEach(function (v) {
                    var h = exIncOculto(v);
                    if (h && !v.value && h.value) { v.value = exIncDmy(h.value); }
                });
                var ini = raiz.querySelector('[name="TAG.EXM_INC_INICIO"]');
                var dias = raiz.querySelector('[name="TAG.EXM_INC_DIAS"]');
                var fin = raiz.querySelector('[name="TAG.EXM_INC_TERMINO"]');
                var finVis = raiz.querySelector('.exinc-fecha[data-para="TAG.EXM_INC_TERMINO"]');
                if (!ini || !dias || !fin) { return; }
                var n = /^\s*\d+\s*$/.test(dias.value) ? parseInt(dias.value, 10) : 0;
                var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ini.value || '');
                var resumen = raiz.querySelector('.exinc-resumen');
                var cal = finVis ? finVis.parentElement.querySelector('.exinc-cal') : null;
                if (!m || n < 1) {
                    if (finVis) { finVis.readOnly = false; finVis.title = ''; }
                    if (cal) { cal.disabled = false; }
                    if (resumen) { resumen.textContent = ''; }
                    return;
                }
                // UTC para que el cambio de horario no corra el dia
                var f = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3] + n - 1));
                fin.value = f.toISOString().slice(0, 10);
                if (finVis) {
                    finVis.value = exIncDmy(fin.value);
                    finVis.classList.remove('is-invalid');
                    finVis.readOnly = true;
                    finVis.title = 'Se calcula: fecha de inicio + días de incapacidad - 1';
                }
                if (cal) { cal.disabled = true; }
                if (resumen) {
                    resumen.innerHTML = '<i class="ri-information-line me-1"></i><b>' + n + (n === 1 ? ' día' : ' días')
                        + '</b> de incapacidad: del <b>' + exIncDmy(ini.value) + '</b> al <b>' + exIncDmy(fin.value) + '</b>';
                }
            }
            // Teclear solo digitos: las diagonales se ponen solas (11122025 -> 11/12/2025)
            function exIncFecha(vis) {
                var d = vis.value.replace(/\D/g, '').slice(0, 8);
                vis.value = d.slice(0, 2) + (d.length > 2 ? '/' + d.slice(2, 4) : '') + (d.length > 4 ? '/' + d.slice(4) : '');
                var iso = exIncIso(vis.value);
                var h = exIncOculto(vis);
                if (h) { h.value = iso; }
                vis.classList.toggle('is-invalid', d.length === 8 && !iso);
                return iso;
            }
            window.exIncCalendario = function (btn) {
                var grupo = btn.parentElement;
                var picker = grupo.querySelector('.exinc-picker');
                var vis = grupo.querySelector('.exinc-fecha');
                var h = exIncOculto(vis);
                picker.value = h ? h.value : '';
                picker.onchange = function () {
                    vis.value = exIncDmy(picker.value);
                    vis.dispatchEvent(new Event('input', { bubbles: true }));
                };
                try { picker.showPicker(); } catch (err) { vis.focus(); }
            };
            document.addEventListener('input', function (e) {
                var t = e.target;
                if (!t || !t.closest) { return; }
                var raiz = t.closest('.exsec') || document;
                if (t.classList.contains('exinc-fecha')) {
                    var iso = exIncFecha(t);
                    exIncTermino(raiz);
                    // captura fluida: con la fecha de inicio completa el foco pasa a los dias
                    if (iso && t.getAttribute('data-para') === 'TAG.EXM_INC_INICIO') {
                        var dias = raiz.querySelector('[name="TAG.EXM_INC_DIAS"]');
                        if (dias) { dias.focus(); dias.select(); }
                    }
                } else if (t.name === 'TAG.EXM_INC_DIAS') {
                    exIncTermino(raiz);
                }
            });

            // Carga el formulario de una seccion dentro de su tab-pane (una sola vez -
            // si ya tiene data-loaded="true" no vuelve a pedirlo al servidor).
            async function cargarPaneExamen(pane) {
                if (pane && pane.dataset.resumen === 'app') {
                    await exAppResumen(pane);   // se repinta cada vez que se muestra: refleja lo de las pestanas
                    return;
                }
                if (pane && pane.dataset.resumen === 'lista') {
                    await exListaResumen(pane);
                    return;
                }
                if (!pane || pane.dataset.loaded === 'true' || pane.dataset.loading === 'true') {
                    return;
                }
                var seccion = pane.getAttribute('data-seccion');
                var tab = document.querySelector('.examen-tabs [data-bs-target="#' + pane.id + '"]');
                var nss = (tab && tab.getAttribute('data-nss')) || (input.value || '').trim();
                pane.dataset.loading = 'true';
                pane.innerHTML = '<div class="text-muted fs-sm py-2"><span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Cargando...</div>';
                try {
                    var body = new URLSearchParams();
                    body.append('data', seccion);
                    body.append('nss', nss);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }
                    var response = await fetch(contextPath + 'api/nss/examen/seccion', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'text/html' },
                        body: body.toString()
                    });
                    if (!response.ok) {
                        pane.innerHTML = '<div class="alert alert-danger mb-0">Error al cargar la sección (HTTP ' + response.status + ').</div>';
                        return;
                    }
                    pane.innerHTML = await response.text();
                    pane.dataset.loaded = 'true';
                    exIncTermino(pane);
                } catch (error) {
                    pane.innerHTML = '<div class="alert alert-danger mb-0">Error de red al cargar la sección.</div>';
                } finally {
                    pane.dataset.loading = 'false';
                }
            }

            // Delegado en #moduleContent (existe desde el arranque de la pagina) en vez de
            // #examenAccordion (se inyecta despues via innerHTML cuando se abre el modulo
            // Examen - un addEventListener directo sobre el no encontraria nada todavia).
            // El tab que arranca activo por default (el primero de cada grupo) no dispara
            // "shown.bs.tab" al renderizarse (no hay cambio de tab, ya nace activo) - se
            // carga aparte cuando el usuario abre el acordeon de ese grupo por primera vez.
            var moduleContentEl = document.getElementById('moduleContent');
            if (moduleContentEl) {
                moduleContentEl.addEventListener('shown.bs.collapse', function (e) {
                    if (!e.target.closest('#examenAccordion')) {
                        return;
                    }
                    // al abrir un grupo, Bootstrap cierra el que estaba abierto arriba y todo sube: sin
                    // esto el grupo recien abierto quedaba fuera de pantalla (casi en la firma)
                    var grupoAbierto = e.target.closest('.examen-grupo');
                    if (grupoAbierto && e.target.parentElement === grupoAbierto) { grupoAbierto.scrollIntoView({ block: 'start' }); }
                    cargarPaneExamen(e.target.querySelector('.examen-tab-content .tab-pane.active'));
                });
                // Cambios de tab subsecuentes (clic del usuario).
                moduleContentEl.addEventListener('shown.bs.tab', function (e) {
                    if (!e.target.closest('#examenAccordion')) {
                        return;
                    }
                    var target = e.target.getAttribute('data-bs-target');
                    var paneTab = target ? document.querySelector(target) : null;
                    // el resumen de patologicos cambia los select de las pestanas APP sin tocar sus
                    // botones: al mostrar una pestana se repintan desde el select
                    cargarPaneExamen(paneTab).then(function () { if (paneTab) { exSecPintarSino(paneTab); } });
                });
            }

            // "Abrir todo" (equivale a openAll() del PHP): expande todos los grupos del acordeon y
            // carga todas las secciones - las que nacen activas via cargarPaneExamen directo y las
            // demas activando su tab, para que quede TODO cargado y navegable sin clics.
            window.abrirTodoExamen = async function (btn) {
                var acordeon = document.getElementById('examenAccordion');
                if (!acordeon) {
                    return;
                }
                if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span>Cargando...'; }
                var grupos = acordeon.querySelectorAll('.accordion-collapse');
                // sin data-bs-parent, abrir un grupo ya no cierra los demas: quedan todos visibles
                grupos.forEach(function (g) { g.classList.add('show'); g.removeAttribute('data-bs-parent'); });
                acordeon.querySelectorAll('.accordion-button').forEach(function (b) { b.classList.remove('collapsed'); b.setAttribute('aria-expanded', 'true'); });
                // Una sola peticion con todas las secciones (antes: una por pane, 46 en total).
                var panes = Array.prototype.slice.call(acordeon.querySelectorAll('.examen-tab-content .tab-pane'));
                var nssTodo = (input.value || '').trim();
                var cargadoEnBloque = false;
                try {
                    var bodyTodo = new URLSearchParams();
                    bodyTodo.append('nss', nssTodo);
                    var csrfTodo = form.querySelector('input[type="hidden"][name]');
                    if (csrfTodo && csrfTodo.name) { bodyTodo.append(csrfTodo.name, csrfTodo.value); }
                    var respTodo = await fetch(contextPath + 'api/nss/examen/secciones', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
                        body: bodyTodo.toString()
                    });
                    if (respTodo.ok) {
                        var htmls = await respTodo.json();
                        panes.forEach(function (p) {
                            if (p.dataset.loaded === 'true') { return; }
                            var h = htmls[p.getAttribute('data-seccion')];
                            if (h) { p.innerHTML = h; p.dataset.loaded = 'true'; }
                        });
                        cargadoEnBloque = true;
                    }
                } catch (e) { /* cae al modo uno por uno */ }
                if (!cargadoEnBloque) {
                    for (var i = 0; i < panes.length; i++) {
                        await cargarPaneExamen(panes[i]);
                    }
                }
                // el resumen de patologicos no viene del servidor: se pinta sobre lo ya cargado
                var resumenes = acordeon.querySelectorAll('.tab-pane[data-resumen="app"]');
                for (var r = 0; r < resumenes.length; r++) { await exAppResumen(resumenes[r]); }
                var listas = acordeon.querySelectorAll('.tab-pane[data-resumen="lista"]');
                for (var q = 0; q < listas.length; q++) { await exListaResumen(listas[q]); }
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ri-folder-open-line me-1"></i>Abrir todo'; }
            };

            // Antecedentes laborales - trabajos previos (20-oct-2026): una tarjeta por trabajo. Los guardados se
            // pintan desde el servidor (SERV_MED_TAG, mismo lugar que el examen inicial y el impreso); "Agregar"
            // clona la <template id="trabajoPlantilla">. Maximo el del formato (data-max, 4).
            // Al quitar uno, los que quedan se renumeran 1, 2, 3... en "No. trabajo" y en el indice de sus name
            // (trabajos[0..n-1].campo), para que el guardado no reciba huecos.
            function trabajosTarjetas(body) {
                return body.querySelectorAll(':scope > [data-trabajo-row]');
            }
            function trabajosEstado(body) {
                var n = trabajosTarjetas(body).length;
                var barra = document.getElementById('trabajosBarra');
                var max = barra ? parseInt(barra.getAttribute('data-max') || '4', 10) : 4;
                var vacio = document.getElementById('trabajosVacio');
                var maximo = document.getElementById('trabajosMaximo');
                var agregar = document.getElementById('trabajosAgregar');
                if (vacio) { vacio.style.display = n ? 'none' : ''; }
                if (maximo) { maximo.style.display = n >= max ? '' : 'none'; }
                if (agregar) { agregar.disabled = n >= max; }
            }
            // Vista tipo asistente (20-oct-2026): una tarjeta a la vez (clase "activo"); la barra #trabajosNav
            // tiene un boton por trabajo con su empresa; Anterior/Siguiente en el pie de cada tarjeta.
            function trabajoActivo(body) {
                var t = body.querySelector(':scope > [data-trabajo-row].activo');
                return t ? +t.getAttribute('data-trabajo-row') : 0;
            }
            function trabajosPintar(body, activo) {
                var tarjetas = trabajosTarjetas(body);
                var n = tarjetas.length;
                if (activo === undefined || activo === null) { activo = trabajoActivo(body); }
                activo = Math.max(0, Math.min(activo, n - 1));
                tarjetas.forEach(function (t, k) {
                    t.classList.toggle('activo', k === activo);
                    var titulo = t.querySelector('.trabajo-titulo');
                    if (titulo) { titulo.textContent = 'Trabajo previo ' + (k + 1) + ' de ' + n; }
                    var ant = t.querySelector('.trabajo-ant');
                    var sig = t.querySelector('.trabajo-sig');
                    if (ant) { ant.disabled = k === 0; }
                    if (sig) { sig.disabled = k === n - 1; }
                });
                var nav = document.getElementById('trabajosNav');
                if (nav) {
                    nav.innerHTML = '';
                    tarjetas.forEach(function (t, k) {
                        var b = document.createElement('button');
                        b.type = 'button';
                        b.className = 'btn btn-sm ' + (k === activo ? 'btn-primary' : 'btn-outline-secondary');
                        var empresa = t.querySelector('input[name$=".empresa"]');
                        var nombre = empresa && empresa.value.trim() ? empresa.value.trim() : '';
                        b.textContent = 'Trabajo ' + (k + 1);
                        if (nombre) {
                            var s = document.createElement('small');
                            s.className = 'ms-1 opacity-75';
                            s.textContent = '· ' + (nombre.length > 22 ? nombre.slice(0, 21) + '…' : nombre);
                            b.appendChild(s);
                        }
                        b.onclick = function () { trabajosIr(k); };
                        nav.appendChild(b);
                    });
                    nav.classList.toggle('d-none', n === 0);
                }
            }
            // la empresa se ve en la barra mientras se escribe (oninput del #trabajosBody)
            window.trabajosAlEscribir = function (e) {
                var body = document.getElementById('trabajosBody');
                if (body && e.target && /\.empresa$/.test(e.target.name || '')) { trabajosPintar(body); }
            };
            window.trabajosIr = function (k) {
                var body = document.getElementById('trabajosBody');
                if (body) { trabajosPintar(body, k); }
            };
            window.trabajosPaso = function (d) {
                var body = document.getElementById('trabajosBody');
                if (body) { trabajosPintar(body, trabajoActivo(body) + d); }
            };
            function renumerarTrabajos(body) {
                trabajosTarjetas(body).forEach(function (t, k) {
                    t.setAttribute('data-trabajo-row', String(k));
                    t.querySelectorAll('input[name]').forEach(function (inp) {
                        var campo = inp.name.replace(/^trabajos\[\d+\]\./, '');
                        inp.name = 'trabajos[' + k + '].' + campo;
                        inp.id = 'trabajo' + k + '_' + campo;
                        var lbl = inp.previousElementSibling;
                        if (lbl && lbl.tagName === 'LABEL') { lbl.htmlFor = inp.id; }
                        if (campo === 'nombre') { inp.value = String(k + 1); }
                    });
                });
                trabajosEstado(body);
            }
            window.quitarTrabajoExamen = function (btn) {
                var body = document.getElementById('trabajosBody');
                var tarjeta = btn.closest('[data-trabajo-row]');
                if (!body || !tarjeta) { return; }
                // se queda en el anterior al quitado (o en el primero)
                var quitado = +tarjeta.getAttribute('data-trabajo-row');
                tarjeta.remove();
                renumerarTrabajos(body);
                trabajosPintar(body, Math.max(0, quitado - 1));
            };
            window.agregarTrabajoExamen = function () {
                var body = document.getElementById('trabajosBody');
                var plantilla = document.getElementById('trabajoPlantilla');
                if (!body || !plantilla) {
                    return;
                }
                var barra = document.getElementById('trabajosBarra');
                var max = barra ? parseInt(barra.getAttribute('data-max') || '4', 10) : 4;
                var idx = trabajosTarjetas(body).length;
                if (idx >= max) {
                    trabajosEstado(body);
                    return;
                }
                var html = plantilla.innerHTML.replace(/@I@/g, String(idx)).replace(/@N@/g, String(idx + 1));
                var tmp = document.createElement('div');
                tmp.innerHTML = html.trim();
                var tarjeta = tmp.firstElementChild;
                body.appendChild(tarjeta);
                trabajosEstado(body);
                trabajosPintar(body, idx);
                var empresa = tarjeta.querySelector('input[name$=".empresa"]');
                if (empresa) { empresa.focus(); }
            };

            // Guarda el examen completo: recolecta los campos de las secciones cargadas + firma.
            // Las secciones ahora viven en los tab-panes del acordeon (#examenAccordion), no en
            // un contenedor unico - solo importan los panes con contenido real (data-loaded),
            // los que nunca se visitaron siguen con el placeholder "Selecciona esta pestaña..."
            // sin inputs, asi que igual no aportarian campos aunque se incluyeran.
            window.guardarExamen = async function (btn) {
                var cont = document.getElementById('examenAccordion');
                var trabajos = document.getElementById('trabajosPrevios');
                // Diagnostico solo es obligatorio si esa seccion esta abierta - las secciones no
                // cargadas no se mandan (evita clobber), asi que no tiene sentido exigirlo si el
                // usuario esta guardando otras secciones sin haber tocado Diagnostico esta vez.
                // Regla del PO: diagnostico ICD obligatorio - pero solo al cerrar el examen (cuando
                // se guarda un dictamen). Exigirlo con solo tener la pestana cargada bloqueaba
                // cualquier guardado tras "Abrir todo", incluso cambiar la firma.
                var diagEl = document.getElementById('examenDiagnostico');
                var dictamenEl = document.querySelector('select[name="SERV_MED_RESULTADO_EXAMEN.DICTAMEN"]');
                // FT-SO-19 no trae Diagnostico: en ese tipo no se exige (VisibilidadTipo)
                if (diagEl && !exOcultoTipo(diagEl) && !diagEl.value.trim() && dictamenEl && dictamenEl.value) {
                    pintarResultadoInline(document.getElementById('examenGuardarResult'),
                            'Para guardar un dictamen captura el diagnóstico actual (Cierre → Diagnóstico: buscador ICD o escrito).', true);
                    // Llevar al usuario al campo: abrir el grupo y la pestana de Diagnostico, y
                    // enfocar el buscador ICD (el cuadro tambien se puede escribir desde 29-oct-2026).
                    var paneDiag = diagEl.closest('.tab-pane');
                    var grupoDiag = diagEl.closest('.accordion-collapse');
                    if (grupoDiag && !grupoDiag.classList.contains('show')) {
                        var hdr = document.querySelector('[data-bs-target="#' + grupoDiag.id + '"]');
                        if (hdr) { hdr.click(); }
                    }
                    if (paneDiag) {
                        var tabDiag = document.querySelector('.examen-tabs [data-bs-target="#' + paneDiag.id + '"]');
                        if (tabDiag) { tabDiag.click(); }
                    }
                    var buscador = document.getElementById('examenIcdConsult');
                    setTimeout(function () {
                        var destino = buscador || diagEl;
                        destino.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        destino.focus();
                        destino.classList.add('is-invalid');
                        setTimeout(function () { destino.classList.remove('is-invalid'); }, 4000);
                    }, 400);
                    return;
                }
                var nss = (input.value || '').trim();
                var body = new URLSearchParams();
                body.append('nss', nss);
                if (cont) {
                    cont.querySelectorAll('input[name], select[name], textarea[name]').forEach(function (el) {
                        body.append(el.name, el.value);
                    });
                }
                if (trabajos) {
                    trabajos.querySelectorAll('input[name], select[name], textarea[name]').forEach(function (el) {
                        body.append(el.name, el.value);
                    });
                }
                var firmaEl = document.getElementById('firma');
                if (firmaEl) {
                    body.append('firma', firmaEl.value);
                }
                var csrf = form.querySelector('input[type="hidden"][name]');
                if (csrf && csrf.name) {
                    body.append(csrf.name, csrf.value);
                }
                if (btn.disabled) {
                    return;
                }
                // Resultado inline junto al boton: el status global (#nssSearchStatus) queda
                // pegado al buscador NSS, muy arriba, fuera de vista cuando el examen esta
                // mas abajo en la pantalla - sin esto el usuario nunca veia si se guardo o no.
                var resultEl = document.getElementById('examenGuardarResult');
                function mostrarResultadoExamen(texto, esError) {
                    if (resultEl) {
                        pintarResultadoInline(resultEl, texto, esError);
                    } else {
                        status.textContent = texto;
                    }
                }
                var originalHtml = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Guardando...';
                mostrarResultadoExamen('Guardando examen...', false);
                // Documento firmado -> PDF al momento (docs/plan-descarga-documento-firmado.md,
                // opcion A): si el examen lleva firma, la pestana del documento se abre AQUI, en
                // el clic (los navegadores bloquean window.open despues de un await), y se
                // navega al expediente con ?auto=1 (lanza el dialogo de imprimir / guardar como
                // PDF) solo si el guardado fue exitoso; si falla, se cierra.
                // Se abre el expediente al guardar cuando el documento queda firmado: firma nueva
                // en el recuadro, o dictamen guardado con una firma ya almacenada en el WS.
                var firmaNueva = !!(firmaEl && firmaEl.value);
                var canvasFirma = document.getElementById('firmaCanvas');
                var firmaAlmacenada = !!(canvasFirma && canvasFirma.dataset.firmaGuardada);
                var conDictamen = !!(dictamenEl && dictamenEl.value);
                var conFirma = firmaNueva || (firmaAlmacenada && conDictamen);
                var urlDocumento = contextPath + 'api/nss/examen/imprimir-pdf?nss=' + encodeURIComponent(nss);
                var ventanaDoc = null;
                if (conFirma) {
                    try {
                        ventanaDoc = window.open('', '_blank');
                        if (ventanaDoc) {
                            ventanaDoc.document.write('<p style="font:14px system-ui;padding:24px">Guardando el examen y generando el expediente para imprimir…</p>');
                        }
                    } catch (e) { ventanaDoc = null; }
                }
                // 28-oct-2026: ya no hay "Guardar tipo" arriba. Si el tipo cambio, se guarda AQUI primero (mismo
                // guardado de Datos generales: tambien SpO2, cintura, cadera y agencia como esten), para que el
                // examen y el expediente que se abre salgan con el formato del tipo nuevo.
                var arribaTipo = document.getElementById('examenTipoArriba');
                var tipoPendiente = !!arribaTipo && arribaTipo.value !== (arribaTipo.getAttribute('data-guardado') || '');
                try {
                    if (tipoPendiente) {
                        var dgForm = document.getElementById('datosGeneralesExamenForm');
                        var dgBody = new URLSearchParams(new FormData(dgForm));
                        if (csrf && csrf.name) { dgBody.append(csrf.name, csrf.value); }
                        var rTipo = await fetch(contextPath + 'api/nss/examen/datos-generales/save', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'text/plain' },
                            body: dgBody.toString()
                        });
                        if (!rTipo.ok) {
                            var txtTipo = await rTipo.text();
                            if (ventanaDoc) { ventanaDoc.close(); }
                            mostrarResultadoExamen('No se guardó el tipo de examen (HTTP ' + rTipo.status + '): ' + txtTipo
                                    + '. El examen tampoco se guardó.', true);
                            return;
                        }
                        var selTipo = document.getElementById('examenTipo');
                        if (selTipo) { exAplicarTipo(selTipo.value, true); }
                    }
                    var response = await fetch(contextPath + 'api/nss/examen/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'text/plain' },
                        body: body.toString()
                    });
                    var txt = await response.text();
                    // el dictamen quedo guardado: habilita (o no) la carta compromiso FT-SO-25
                    if (response.ok && dictamenEl) {
                        dictamenEl.setAttribute('data-guardado', dictamenEl.value);
                        exCartaVisible(dictamenEl);
                    }
                    if (response.ok && conFirma) {
                        if (ventanaDoc) {
                            ventanaDoc.location.href = urlDocumento;
                        }
                        mostrarResultadoExamen('Examen: ' + txt, false);
                        if (resultEl) {
                            // enlace por si el navegador bloqueo la pestana
                            var a = document.createElement('a');
                            a.href = urlDocumento;
                            a.target = '_blank';
                            a.className = 'ms-2';
                            a.innerHTML = '<i class="ri-printer-line me-1"></i>Descargar expediente (PDF)';
                            resultEl.appendChild(a);
                        }
                    } else {
                        if (ventanaDoc) { ventanaDoc.close(); }
                        mostrarResultadoExamen(response.ok ? ('Examen: ' + txt)
                                : ('Error al guardar (HTTP ' + response.status + '): ' + txt), !response.ok);
                        // Guardado sin firmar en este momento (16-oct-2026): no se abre pestana sola,
                        // pero queda a la mano el expediente con lo recien guardado
                        if (response.ok && resultEl) {
                            var aImp = document.createElement('a');
                            aImp.href = urlDocumento;
                            aImp.target = '_blank';
                            aImp.className = 'ms-2';
                            aImp.innerHTML = '<i class="ri-printer-line me-1"></i>Imprimir expediente';
                            resultEl.appendChild(aImp);
                        }
                    }
                } catch (error) {
                    if (ventanaDoc) { ventanaDoc.close(); }
                    mostrarResultadoExamen('Error de red al guardar el examen.', true);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                }
            };

            // Detalle de una consulta (viewConsultaDetails) en el modal.
            window.verConsulta = function (btn) {
                cargarDetalle('api/nss/expediente/detalle', btn.getAttribute('data-id-consulta'), 'Detalle de consulta');
            };

            // Detalle de una incapacidad (viewIncapDetails) en el modal.
            window.verIncapacidad = function (btn) {
                cargarDetalle('api/nss/incapacidades/detalle', btn.getAttribute('data-id-consulta'), 'Detalle de incapacidad');
            };

            // Seguimiento de un caso de accidente (historial + evidencias) en el modal.
            window.verSeguimientoAccidente = function (btn) {
                cargarDetalle('api/nss/accidentes/detalle', btn.getAttribute('data-id-accidente'), 'Seguimiento de accidente');
            };

            // Agrega una entrada de seguimiento (o cierra el caso) y refresca el modal.
            window.guardarSeguimientoAccidente = async function (btn) {
                var regId = btn.getAttribute('data-accidente-regid');
                var tipo = btn.getAttribute('data-tipo');
                var obsEl = document.getElementById('accSeguimientoObs');
                var statusEl = document.getElementById('accSeguimientoStatus');
                var observaciones = obsEl ? obsEl.value.trim() : '';
                if (!observaciones) {
                    if (statusEl) {
                        statusEl.innerHTML = '<span class="text-danger">Escribe una observación.</span>';
                    }
                    return;
                }
                var body = new URLSearchParams();
                body.append('accidenteRegId', regId);
                body.append('tipo', tipo);
                body.append('observaciones', observaciones);
                var csrf = form.querySelector('input[type="hidden"][name]');
                if (csrf && csrf.name) {
                    body.append(csrf.name, csrf.value);
                }
                btn.disabled = true;
                try {
                    var response = await fetch(contextPath + 'api/nss/accidentes/seguimiento/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'text/plain' },
                        body: body.toString()
                    });
                    var txt = await response.text();
                    if (response.ok) {
                        await cargarDetalle('api/nss/accidentes/detalle', regId, 'Seguimiento de accidente');
                        // El modal ya se refresco, pero la lista de accidentes de #moduleContent
                        // (detras del modal) se cargo ANTES de este cambio - su badge de Estado
                        // se queda desactualizado (ej. sigue en ABIERTO tras cerrar el caso) hasta
                        // que se refresque tambien.
                        loadModuleView('api/nss/accidentes', (input.value || '').trim());
                    } else if (statusEl) {
                        statusEl.innerHTML = '<span class="text-danger">' + (txt || ('Error HTTP ' + response.status)) + '</span>';
                    }
                } catch (error) {
                    if (statusEl) {
                        statusEl.innerHTML = '<span class="text-danger">Error de red al guardar el seguimiento.</span>';
                    }
                } finally {
                    btn.disabled = false;
                }
            };

            // Sube evidencias (mismo endpoint/mecanismo que los adjuntos de Consulta,
            // relacion = "accidente-<id>") y refresca el modal.
            window.subirEvidenciaAccidente = async function (btn) {
                var nss = btn.getAttribute('data-nss');
                var relacion = btn.getAttribute('data-relacion');
                var regId = btn.getAttribute('data-accidente-regid');
                var fileInput = document.getElementById('accEvidenciaFiles');
                if (!fileInput || !fileInput.files || !fileInput.files.length) {
                    return;
                }
                var fd = new FormData();
                fd.append('nss', nss);
                fd.append('relacion', relacion);
                for (var i = 0; i < fileInput.files.length; i++) {
                    fd.append('file', fileInput.files[i]);
                }
                var headers = {};
                var csrf = form.querySelector('input[type="hidden"][name]');
                if (csrf) {
                    headers['X-CSRF-TOKEN'] = csrf.value;
                }
                btn.disabled = true;
                try {
                    var response = await fetch(contextPath + 'api/nss/consulta/file', {
                        method: 'POST', headers: headers, body: fd
                    });
                    if (response.ok) {
                        await cargarDetalle('api/nss/accidentes/detalle', regId, 'Seguimiento de accidente');
                    }
                } catch (error) {
                    // silencioso, igual que subirArchivo - el usuario ve que la lista no cambio
                } finally {
                    btn.disabled = false;
                }
            };

            window.borrarEvidenciaAccidente = async function (btn) {
                var id = btn.getAttribute('data-id');
                var regId = btn.getAttribute('data-accidente-regid');
                var nssEv = btn.getAttribute('data-nss') || (input.value || '').trim();
                var nombreEv = btn.getAttribute('data-nombre') || 'esta evidencia';
                if (!window.confirm('¿Borrar «' + nombreEv + '»? Dejará de verse en el expediente.')) {
                    return;
                }
                var headers = {};
                var csrf = form.querySelector('input[type="hidden"][name]');
                if (csrf) {
                    headers['X-CSRF-TOKEN'] = csrf.value;
                }
                try {
                    var response = await fetch(contextPath + 'api/nss/consulta/file/' + encodeURIComponent(id) + '/delete?nss=' + encodeURIComponent(nssEv), {
                        method: 'POST', headers: headers
                    });
                    if (response.ok) {
                        await cargarDetalle('api/nss/accidentes/detalle', regId, 'Seguimiento de accidente');
                    }
                } catch (error) {
                    // silencioso, igual que borrarArchivo
                }
            };

            // Reporte de incapacidades por rango de fechas (todas las NSS, no solo la actual).
            window.generarReporteIncapacidades = async function (btn) {
                var ini = document.getElementById('reporteFechaInicial');
                var fin = document.getElementById('reporteFechaFinal');
                var out = document.getElementById('reporteIncapacidadesResult');
                if (!ini || !fin || !out) {
                    return;
                }
                if (!ini.value || !fin.value) {
                    out.innerHTML = '<div class="alert alert-warning mb-0">Indica ambas fechas.</div>';
                    return;
                }
                var textoOriginal = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Generar';
                out.innerHTML = '';
                try {
                    var body = new URLSearchParams();
                    body.append('fechaInicial', ini.value);
                    body.append('fechaFinal', fin.value);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }
                    var response = await fetch(contextPath + 'api/nss/incapacidades/reporte', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'text/html' },
                        body: body.toString()
                    });
                    var texto = await response.text();
                    if (!response.ok) {
                        out.innerHTML = '<div class="alert alert-danger mb-0">' + escapeHtml(texto || ('Error HTTP ' + response.status)) + '</div>';
                        return;
                    }
                    out.innerHTML = texto;
                } catch (error) {
                    out.innerHTML = '<div class="alert alert-danger mb-0">Error de red al generar el reporte.</div>';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = textoOriginal;
                }
            };

            function escapeHtml(s) {
                return (s || '').replace(/[&<>"']/g, function (ch) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
                });
            }

            // Filtro cliente de una tabla (input dentro de la misma .card). Reutilizable.
            window.filtrarConsultas = function (input) {
                var card = input.closest('.card');
                var table = card ? card.querySelector('table') : null;
                if (!table) {
                    return;
                }
                var q = (input.value || '').toLowerCase();
                // Si la misma tarjeta tiene un filtro de ramo y/o rubro (Incapacidades), se
                // combinan con el buscador de texto; en el resto de las tablas no existen esos
                // selects y no cambia nada.
                var ramoSelect = card.querySelector('[data-filtro-ramo]');
                var ramo = ramoSelect ? ramoSelect.value : '';
                var rubroSelect = card.querySelector('[data-filtro-rubro]');
                var rubro = rubroSelect ? rubroSelect.value.toLowerCase() : '';
                table.querySelectorAll('tbody tr').forEach(function (tr) {
                    var matchTexto = tr.textContent.toLowerCase().indexOf(q) >= 0;
                    var matchRamo = !ramo || tr.getAttribute('data-ramo') === ramo;
                    var matchRubro = !rubro || (tr.getAttribute('data-rubro') || '').toLowerCase() === rubro;
                    tr.style.display = (matchTexto && matchRamo && matchRubro) ? '' : 'none';
                });
            };

            // Filtro de ramo (Incapacidades): reusa filtrarConsultas para combinarse con el
            // buscador de texto (y el filtro de rubro) de la misma tarjeta, si existe.
            window.filtrarPorRamo = function (select) {
                var card = select.closest('.card');
                var input = card ? card.querySelector('input[oninput]') : null;
                if (input) {
                    window.filtrarConsultas(input);
                    return;
                }
                var table = card ? card.querySelector('table') : null;
                if (!table) {
                    return;
                }
                var ramo = select.value;
                table.querySelectorAll('tbody tr').forEach(function (tr) {
                    tr.style.display = (!ramo || tr.getAttribute('data-ramo') === ramo) ? '' : 'none';
                });
            };

            // Filtro de rubro (Interna/IMSS, Incapacidades): mismo patron que filtrarPorRamo.
            window.filtrarPorRubro = function (select) {
                var card = select.closest('.card');
                var input = card ? card.querySelector('input[oninput]') : null;
                if (input) {
                    window.filtrarConsultas(input);
                    return;
                }
                var table = card ? card.querySelector('table') : null;
                if (!table) {
                    return;
                }
                var rubro = select.value.toLowerCase();
                table.querySelectorAll('tbody tr').forEach(function (tr) {
                    tr.style.display = (!rubro || (tr.getAttribute('data-rubro') || '').toLowerCase() === rubro) ? '' : 'none';
                });
            };

            // Exporta la tabla de la misma .card a un archivo Excel (.xls). Respeta el filtro
            // (solo filas visibles) y omite columnas marcadas con [data-no-export].
            window.exportarConsultasExcel = function (btn) {
                var card = btn.closest('.card');
                var table = card ? card.querySelector('table') : null;
                if (!table) {
                    return;
                }
                var name = table.getAttribute('data-export-name') || 'export';
                var html = '<meta charset="utf-8"><table border="1"><thead><tr>';
                table.querySelectorAll('thead th').forEach(function (th) {
                    if (th.hasAttribute('data-no-export')) { return; }
                    html += '<th>' + escapeHtml(th.textContent.trim()) + '</th>';
                });
                html += '</tr></thead><tbody>';
                table.querySelectorAll('tbody tr').forEach(function (tr) {
                    if (tr.style.display === 'none') { return; }
                    html += '<tr>';
                    tr.querySelectorAll('td').forEach(function (td) {
                        if (td.hasAttribute('data-no-export')) { return; }
                        html += '<td>' + escapeHtml(td.textContent.trim()) + '</td>';
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';

                var bom = String.fromCharCode(0xFEFF);
                var blob = new Blob([bom + html], { type: 'application/vnd.ms-excel' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = name + '.xls';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                doSearch();
            });

            // Shortcut: si la pagina se abrio con un NSS pre-cargado (?nss=...), buscar automaticamente.
            if ((input.value || '').trim()) {
                doSearch();
            }
        }());
    </script>
</th:block>
</body>
</html>
