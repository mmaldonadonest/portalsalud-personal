<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::title}, ~{:: nssContent}, ~{::th:block[@id='pageScripts']}, ~{::th:block[@id='pageStyles']})}">
<head>
    <title>Busqueda NSS | Portal Salud Personal</title>
</head>
<body>

<th:block id="pageStyles">
    <style>
        /* Item de modulo activo en el submenu lateral: reusa el azul primario del tema. */
        #nssModulesSub .nav-sub-link.active {
            background-color: rgba(80, 111, 217, 0.12);
            color: #506fd9;
            font-weight: 600;
            border-radius: 4px;
        }
        #nssModulesSub .nav-sub-link.active::before {
            background-color: #506fd9;
        }
    </style>
</th:block>

<th:block th:fragment="nssContent">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <ol class="breadcrumb fs-sm mb-1">
                <li class="breadcrumb-item"><a th:href="@{/home}" href="/home">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Busqueda NSS</li>
            </ol>
            <h4 class="main-title mb-0">Busqueda por NSS</h4>
        </div>
    </div>

    <div class="card card-one">
        <div class="card-header">
            <h6 class="card-title mb-0">Consulta de derechohabiente</h6>
        </div>
        <div class="card-body">
            <form id="nssSearchForm" class="row g-2 align-items-end" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-md-8">
                    <label class="form-label" for="nssInput">NSS</label>
                    <input id="nssInput" name="nss" type="text" class="form-control"
                           placeholder="Ej. 30048315698" th:value="${nssQuery}" required>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary" type="submit">Buscar</button>
                </div>
            </form>

            <div id="nssSearchStatus" class="mt-3 text-muted fs-sm">Ingresa un NSS para consultar.</div>

            <div id="nssSearchResult" class="mt-3" style="display: none;"></div>
        </div>
    </div>

    <!-- Area donde se cargan las vistas de los modulos (expediente, etc.) -->
    <div id="moduleContent" class="mt-3"></div>

    <!-- Modal de detalle de consulta (U04) -->
    <div class="modal fade" id="consultaModal" tabindex="-1" aria-labelledby="consultaModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title mb-0" id="consultaModalTitle">Detalle de consulta</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="consultaModalBody"></div>
            </div>
        </div>
    </div>
</th:block>

<th:block id="pageScripts">
    <script>
        (function () {
            var form = document.getElementById('nssSearchForm');
            var status = document.getElementById('nssSearchStatus');
            var result = document.getElementById('nssSearchResult');
            var input = document.getElementById('nssInput');

            if (!form || !status || !result || !input) {
                return;
            }

            // Sesion/CSRF expirada: cualquier POST AJAX que devuelva 401/403 (tipico
            // tras dejar la pagina abierta mas que el timeout de sesion) redirige al
            // login en vez de mostrar un "Error 403" confuso. Se envuelve fetch una vez.
            var _portalFetch = window.fetch.bind(window);
            window.fetch = function (input, init) {
                return _portalFetch(input, init).then(function (resp) {
                    if (resp.status === 401 || resp.status === 403) {
                        window.location.href = contextPath + 'login?expired';
                        // Promesa que nunca resuelve: frena el manejo posterior al navegar.
                        return new Promise(function () {});
                    }
                    return resp;
                });
            };

            async function doSearch() {
                var nss = (input.value || '').trim();

                if (!nss) {
                    status.textContent = 'El NSS es obligatorio.';
                    result.style.display = 'none';
                    return;
                }

                status.textContent = 'Consultando...';
                result.style.display = 'none';

                try {
                    // Contrato equivalente a rest/dashboard/searchEmploye.php:
                    // XHR POST form-urlencoded con el parametro 'data' (el NSS), respuesta HTML.
                    var body = new URLSearchParams();
                    body.append('data', nss);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }

                    var response = await fetch(contextPath + 'api/nss/search', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'text/html'
                        },
                        body: body.toString()
                    });

                    if (!response.ok) {
                        status.textContent = 'Error al consultar. Codigo HTTP: ' + response.status;
                        result.style.display = 'none';
                        return;
                    }

                    var html = await response.text();
                    status.textContent = 'Consulta realizada.';
                    result.innerHTML = html;
                    result.style.display = 'block';

                    // Reiniciamos el menu lateral de modulos y el area de contenido; si es
                    // empleado (el fragmento incluye #nssEmpleadoMarker), cargamos los modulos.
                    resetSidebarModules();
                    var mc = document.getElementById('moduleContent');
                    if (mc) { mc.innerHTML = ''; }
                    if (document.getElementById('nssEmpleadoMarker')) {
                        loadSidebarModules(nss);
                    }
                } catch (error) {
                    status.textContent = 'Error de red al consultar: ' + error;
                    result.style.display = 'none';
                }
            }

            function resetSidebarModules() {
                var group = document.getElementById('nssModulesGroup');
                var sub = document.getElementById('nssModulesSub');
                if (sub) { sub.innerHTML = ''; }
                if (group) { group.style.display = 'none'; }
            }

            // Carga los modulos permitidos (validateModules) como submenu lateral.
            async function loadSidebarModules(nss) {
                var group = document.getElementById('nssModulesGroup');
                var sub = document.getElementById('nssModulesSub');
                if (!group || !sub) {
                    return;
                }
                try {
                    var body = new URLSearchParams();
                    body.append('data', nss);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }

                    var response = await fetch(contextPath + 'api/nss/modules', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'text/html'
                        },
                        body: body.toString()
                    });

                    if (response.ok) {
                        sub.innerHTML = await response.text();
                        // Solo mostramos el grupo si hay al menos un modulo permitido.
                        if (sub.querySelector('a')) {
                            group.style.display = '';
                        } else {
                            // El WS respondio bien pero sin modulos: el usuario logueado
                            // no tiene rol/menus en el ORDS (consulta_app_rol_usuario) para app 13.
                            status.textContent = 'Ficha cargada, pero el usuario logueado no tiene modulos'
                                + ' asignados en el ORDS (validateModules). Revisa el rol del usuario.';
                        }
                    } else {
                        status.textContent = 'Ficha cargada, pero no se pudieron cargar los modulos'
                            + ' del menu (HTTP ' + response.status + ').';
                    }
                } catch (error) {
                    // Los modulos son complementarios: si fallan, no rompemos la ficha.
                    status.textContent = 'Ficha cargada, pero fallo la carga de modulos del menu: ' + error;
                }
            }

            // Carga la vista de un modulo (POST form-urlencoded con el NSS) en #moduleContent.
            async function loadModuleView(path, nss) {
                var mc = document.getElementById('moduleContent');
                if (!mc) {
                    return;
                }
                mc.innerHTML = '<div class="text-muted fs-sm">Cargando...</div>';
                mc.scrollIntoView({ behavior: 'smooth', block: 'start' });
                try {
                    var body = new URLSearchParams();
                    body.append('data', nss);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }
                    var response = await fetch(contextPath + path, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'text/html'
                        },
                        body: body.toString()
                    });
                    if (response.ok) {
                        mc.innerHTML = await response.text();
                        // Reenfocar tras cargar: el scrollIntoView de arriba se hizo con el
                        // placeholder "Cargando..." (una linea) - una vez que el contenido real
                        // crece (o la pagina se acomoda distinto), ese scroll queda desalineado.
                        mc.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        // Si el modulo trae el canvas de firma, inicializar el signature pad.
                        if (document.getElementById('firmaCanvas')) {
                            initSignaturePad();
                        }
                    } else {
                        mc.innerHTML = '<div class="alert alert-danger mb-0">Error al cargar el modulo (HTTP ' + response.status + ').</div>';
                    }
                } catch (error) {
                    mc.innerHTML = '<div class="alert alert-danger mb-0">Error de red al cargar el modulo.</div>';
                }
            }

            // Item activo del submenu: azul institucional del tema en el modulo seleccionado.
            function marcarModuloActivo(btn) {
                var sub = document.getElementById('nssModulesSub');
                if (sub) {
                    sub.querySelectorAll('.nav-sub-link.active').forEach(function (el) {
                        el.classList.remove('active');
                    });
                }
                btn.classList.add('active');
            }

            // Handler de los modulos del sidebar. Despacha por data-action; los modulos
            // aun no implementados (sin action) muestran mensaje placeholder.
            window.abrirModulo = function (btn) {
                marcarModuloActivo(btn);
                var action = btn.getAttribute('data-action');
                var nss = btn.getAttribute('data-nss');
                if (action === 'expediente') {
                    loadModuleView('api/nss/expediente', nss);
                    return;
                }
                if (action === 'consulta-form') {
                    loadModuleView('api/nss/consulta/form', nss);
                    return;
                }
                if (action === 'incapacidades') {
                    loadModuleView('api/nss/incapacidades', nss);
                    return;
                }
                if (action === 'incapacidad-form') {
                    loadModuleView('api/nss/incapacidades/form', nss);
                    return;
                }
                if (action === 'archivos') {
                    loadArchivos(nss, btn.getAttribute('data-tipo'));
                    return;
                }
                if (action === 'pretest') {
                    loadModuleView('api/nss/pretest', nss);
                    return;
                }
                if (action === 'examen') {
                    loadModuleView('api/nss/examen', nss);
                    return;
                }
                if (action === 'antidoping') {
                    loadModuleView('api/nss/antidoping', nss);
                    return;
                }
                if (action === 'accidentes') {
                    loadModuleView('api/nss/accidentes', nss);
                    return;
                }
                if (action === 'maternidad') {
                    loadModuleView('api/nss/maternidad', nss);
                    return;
                }
                var idMenu = btn.getAttribute('data-id-menu');
                status.textContent = 'Modulo "' + btn.textContent.trim() + '" (id ' + idMenu +
                    ', NSS ' + nss + ') disponible en una proxima entrega.';
            };

            // Busqueda ICD: inyecta los resultados bajo el input; addIcd los agrega al textarea
            // destino. Generico (ids por parametro, con default = el form de Consulta Medica)
            // para poder reusarse tambien desde el Diagnostico del Examen Medico sin duplicar
            // fragmento/backend - guarda el id del textarea destino en data-target del contenedor
            // de resultados, asi addIcd() sabe donde agregar la clave sin necesitar mas parametros.
            // todo=true: lista el catalogo completo (el WS con texto vacio regresa todo) para
            // quien no sabe por donde empezar; el autocompletar sigue pidiendo 3 letras.
            window.buscarIcd = async function (inputId, resultId, targetId, todo) {
                inputId = inputId || 'icdConsult';
                resultId = resultId || 'icdResult';
                targetId = targetId || 'diagnostico';
                var input = document.getElementById(inputId);
                var out = document.getElementById(resultId);
                if (!input || !out) {
                    return;
                }
                out.setAttribute('data-target', targetId);
                if (!todo) {
                    resetIcdTodo(out);
                }
                var q = todo ? '' : (input.value || '').trim();
                if (!q && !todo) {
                    out.innerHTML = '';
                    return;
                }
                out.innerHTML = '<div class="text-muted fs-sm">Buscando...</div>';
                try {
                    var body = new URLSearchParams();
                    body.append('icd', q);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }
                    var response = await fetch(contextPath + 'api/nss/icd', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'text/html'
                        },
                        body: body.toString()
                    });
                    if (response.ok) {
                        out.innerHTML = await response.text();
                    } else {
                        out.innerHTML = '';
                    }
                } catch (error) {
                    out.innerHTML = '';
                }
            };

            // Regresa el boton "Ver todo el catalogo" del buscador a su estado inicial cuando la
            // lista completa ya no esta en pantalla (se tecleo otra busqueda o se eligio una clave).
            function resetIcdTodo(out) {
                if (!out) { return; }
                out.dataset.todo = '';
                var btnTodo = document.getElementById(out.id === 'examenIcdResult' ? 'examenIcdTodoBtn' : 'icdConsultTodoBtn');
                if (btnTodo) { btnTodo.innerHTML = '<i class="ri-list-check me-1"></i>Ver todo el catálogo'; }
            }

            // "Ver todo el catalogo" hace toggle: primer clic lista todo, segundo lo oculta.
            window.toggleIcdCatalogo = async function (btn, inputId, resultId, targetId) {
                var out = document.getElementById(resultId);
                if (!out) {
                    return;
                }
                if (out.dataset.todo === '1') {
                    out.innerHTML = '';
                    out.dataset.todo = '';
                    btn.innerHTML = '<i class="ri-list-check me-1"></i>Ver todo el catálogo';
                    return;
                }
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span>Cargando...';
                await buscarIcd(inputId, resultId, targetId, true);
                out.dataset.todo = '1';
                btn.disabled = false;
                btn.innerHTML = '<i class="ri-eye-off-line me-1"></i>Ocultar catálogo';
            };

            // Autocompleta desde 3 letras, con debounce (300ms) para no disparar una peticion
            // por cada tecla. Un timer por inputId (independiente entre los distintos buscadores
            // ICD: Consulta, Diagnostico del Examen, y cada slot de Diagnosticos secundarios).
            var icdDebounceTimers = {};
            window.buscarIcdDebounced = function (inputId, resultId, targetId) {
                inputId = inputId || 'icdConsult';
                resultId = resultId || 'icdResult';
                targetId = targetId || 'diagnostico';
                var input = document.getElementById(inputId);
                var out = document.getElementById(resultId);
                if (!input || !out) {
                    return;
                }
                if (icdDebounceTimers[inputId]) {
                    clearTimeout(icdDebounceTimers[inputId]);
                }
                var q = (input.value || '').trim();
                if (q.length < 3) {
                    out.innerHTML = '';
                    return;
                }
                icdDebounceTimers[inputId] = setTimeout(function () {
                    buscarIcd(inputId, resultId, targetId);
                }, 300);
            };

            window.addIcd = function (btn) {
                var text = btn.getAttribute('data-icd');
                var out = btn.closest('[data-target]');
                var targetId = out ? out.getAttribute('data-target') : 'diagnostico';
                var ta = document.getElementById(targetId);
                if (ta) {
                    // La misma clave no se agrega dos veces (antes cada clic la repetia).
                    var clave = (text.split(' - ')[0] || '').trim();
                    var yaEsta = clave && (' ' + ta.value + ' ').indexOf(' ' + clave + ' ') !== -1;
                    if (!yaEsta) {
                        ta.value = (ta.value ? ta.value + ' ' : '') + text;
                    }
                }
                if (out) {
                    out.innerHTML = '';
                    resetIcdTodo(out);
                }
            };

            // Signature pad en canvas (mouse + touch) -> data URL en el campo oculto #firma.
            window.initSignaturePad = function () {
                var canvas = document.getElementById('firmaCanvas');
                var hidden = document.getElementById('firma');
                if (!canvas || !hidden) {
                    return;
                }
                var ctx = canvas.getContext('2d');
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#000';
                var drawing = false;
                var last = null;

                // Firma ya guardada (examen: data-firma-guardada en el canvas): se pinta como
                // contenido inicial para que el usuario la vea, pero #firma se queda VACIO - si no
                // firma de nuevo, guardar no la pisa. Al primer trazo se borra y se reemplaza.
                var guardada = canvas.dataset.firmaGuardada || '';
                var mostrandoGuardada = false;
                var etiqueta = document.getElementById('firmaEstado');
                function pintarGuardada() {
                    if (!guardada) { return; }
                    var img = new Image();
                    img.onload = function () {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        mostrandoGuardada = true;
                        hidden.value = '';
                        if (etiqueta) { etiqueta.textContent = 'Firma guardada: es la que aparece en el expediente impreso. Para cambiarla, firma encima y guarda.'; }
                    };
                    img.src = guardada;
                }
                pintarGuardada();

                function pos(e) {
                    var r = canvas.getBoundingClientRect();
                    var t = (e.touches && e.touches.length) ? e.touches[0] : e;
                    return { x: t.clientX - r.left, y: t.clientY - r.top };
                }
                function start(e) {
                    if (mostrandoGuardada) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        mostrandoGuardada = false;
                        if (etiqueta) { etiqueta.textContent = 'Nueva firma: al guardar reemplaza a la anterior y abre el expediente para imprimir.'; }
                    }
                    drawing = true; last = pos(e); e.preventDefault();
                }
                function move(e) {
                    if (!drawing) { return; }
                    var p = pos(e);
                    ctx.beginPath();
                    ctx.moveTo(last.x, last.y);
                    ctx.lineTo(p.x, p.y);
                    ctx.stroke();
                    last = p;
                    hidden.value = canvas.toDataURL('image/png');
                    e.preventDefault();
                }
                function end() { drawing = false; }

                canvas.addEventListener('mousedown', start);
                canvas.addEventListener('mousemove', move);
                window.addEventListener('mouseup', end);
                canvas.addEventListener('touchstart', start, { passive: false });
                canvas.addEventListener('touchmove', move, { passive: false });
                canvas.addEventListener('touchend', end);

                var clearBtn = document.getElementById('firmaClear');
                if (clearBtn) {
                    clearBtn.onclick = function () {
                        // Solo limpia el recuadro para firmar de nuevo. NO borra la firma guardada
                        // en el WS: si se guarda sin trazo nuevo, se conserva la anterior.
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        hidden.value = '';
                        mostrandoGuardada = false;
                        if (etiqueta) {
                            etiqueta.textContent = guardada
                                ? 'Recuadro limpio. Firma y guarda para reemplazar la firma guardada; si guardas sin firmar, se conserva la anterior.'
                                : '';
                        }
                    };
                }
            };

            // Calcula IMC = peso / talla^2 en el formulario de alta de consulta.
            window.calcImc = function () {
                var f = document.getElementById('consultaAltaForm');
                if (!f) {
                    return;
                }
                var peso = parseFloat(f.peso.value);
                var talla = parseFloat(f.talla.value);
                if (peso > 0 && talla > 0) {
                    f.imc.value = (peso / (talla * talla)).toFixed(2);
                }
            };

            // Estilo comun para los mensajes de resultado inline (junto al boton "Guardar")
            // en toda la pantalla de NSS: icono + color semantico Bootstrap (success/danger),
            // en vez de solo texto de color. Un solo lugar para no repetir el mismo className
            // en cada guardarX() - lo usan guardarRegistro() y guardarExamen().
            function pintarResultadoInline(el, texto, esError) {
                if (!el) {
                    return;
                }
                el.className = 'fs-sm d-inline-flex align-items-center gap-1 ' + (esError ? 'text-danger' : 'text-success');
                el.innerHTML = '';
                var icono = document.createElement('i');
                icono.className = esError ? 'ri-error-warning-line' : 'ri-checkbox-circle-line';
                el.appendChild(icono);
                el.appendChild(document.createTextNode(texto));
            }

            // Guardado generico de un alta (consulta / incapacidad / antidoping / accidente) +
            // subida de adjuntos. Bloquea doble-click (guard explicito + disabled), muestra
            // spinner mientras esta en vuelo, y opcionalmente limpia el formulario al exito
            // (opts.resetOnSuccess) u ejecuta un callback (opts.onSuccess) - ej. volver a la
            // lista - sin tocar el comportamiento de las pantallas que no los piden.
            async function guardarRegistro(btn, opts) {
                if (btn.disabled) {
                    return;
                }
                var formEl = document.getElementById(opts.formId);
                if (!formEl) {
                    return;
                }
                var body = new URLSearchParams(new FormData(formEl));
                // Documento firmado -> PDF al momento (mismo patron que guardarExamen): si el
                // registro lleva firma y opts.documentoUrl(formEl) da una URL, la pestana se abre
                // AQUI en el clic (window.open tras un await lo bloquea el navegador) y se navega
                // al documento con ?auto=1 solo si el guardado fue exitoso; si falla, se cierra.
                var firmaEl = formEl.querySelector('#firma');
                var urlDocumento = (typeof opts.documentoUrl === 'function' && firmaEl && firmaEl.value)
                        ? opts.documentoUrl(formEl) : null;
                var ventanaDoc = null;
                if (urlDocumento) {
                    try {
                        ventanaDoc = window.open('', '_blank');
                        if (ventanaDoc) {
                            ventanaDoc.document.write('<p style="font:14px system-ui;padding:24px">Guardando y generando el documento para imprimir…</p>');
                        }
                    } catch (e) { ventanaDoc = null; }
                }
                var csrf = form.querySelector('input[type="hidden"][name]');
                if (csrf && csrf.name) {
                    body.append(csrf.name, csrf.value);
                }
                var originalHtml = btn.innerHTML;
                // Resultado inline (opcional): ademas del status global de arriba (lejos de
                // la vista si el formulario esta mas abajo en la pantalla, ej. Examen), si
                // opts.resultElId apunta a un elemento cercano al boton, se usa para mostrar
                // el mismo mensaje justo ahi, imposible de perder de vista.
                var resultEl = opts.resultElId ? document.getElementById(opts.resultElId) : null;
                function mostrarResultado(texto, esError) {
                    if (resultEl) {
                        pintarResultadoInline(resultEl, texto, esError);
                        status.textContent = '';
                    } else {
                        status.textContent = texto;
                    }
                }
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Guardando...';
                mostrarResultado('Guardando ' + opts.label + '...', false);
                try {
                    var response = await fetch(contextPath + opts.savePath, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'text/plain'
                        },
                        body: body.toString()
                    });
                    var txt = await response.text();
                    if (response.ok) {
                        mostrarResultado(txt, false);
                        var fileInput = document.getElementById(opts.fileInputId);
                        if (fileInput && fileInput.files && fileInput.files.length) {
                            mostrarResultado(txt + ' Subiendo adjuntos...', false);
                            var up = await subirAdjuntos(formEl, fileInput.files);

                        if (urlDocumento) {
                            if (ventanaDoc) {
                                ventanaDoc.location.href = urlDocumento;
                            }
                            if (resultEl) {
                                // enlace por si el navegador bloqueo la pestana

                        }
                        if (opts.resetOnSuccess) {
                            formEl.reset();
                        }
                        if (typeof opts.onSuccess === 'function') {
                            opts.onSuccess();
                        }
                    } else {
                        if (ventanaDoc) { ventanaDoc.close(); }
                        mostrarResultado('Error al registrar (HTTP ' + response.status + '): ' + txt, true);
                    }
                } catch (error) {
                    if (ventanaDoc) { ventanaDoc.close(); }
                    mostrarResultado('Error de red al registrar.', true);

            async function folioYaExiste(formId, listPath) {

            // Examen medico (U07): cada grupo (acordeon) tiene sus secciones como tabs.
            // El contenido de un tab se carga UNA vez (lazy, al activarse por primera
            // vez) y se queda en el DOM al cambiar de tab - a diferencia del viejo
            // boton-toggle, cambiar de tab ya no borra lo que no hayas guardado.
            //
            // El badge del grupo cuenta las secciones marcadas con la palomita (data-checked),
            // NO las simplemente visitadas/cargadas - es una marca deliberada del usuario
            // ("ya revise/conteste esto"), a diferencia de solo abrir el tab. Se prefirio asi
            // porque el WS no da una senal confiable de "tiene datos reales" (ver conversacion
            // 2026-08-26: PR_SERVICIO_MED_CONSULTA rellena todo con defaults tipo "sin
            // observaciones"/0 aunque la seccion nunca se haya contestado) - la unica fuente
            // de verdad que queda es que el usuario mismo la marque.
            function actualizarBadgeGrupoExamen(grupo) {
                if (!grupo) {
                    return;
                }
                var badge = grupo.querySelector('.examen-grupo-badge');
                if (!badge) {
                    return;
                }
                var total = grupo.querySelectorAll('.examen-tabs .nav-link[data-checked="true"]').length;
                if (total > 0) {
                    badge.textContent = total;
                    badge.classList.remove('d-none');
                } else {
                    badge.classList.add('d-none');
                }
            }

            // Palomita manual en cada tab: clic marca/desmarca en verde y ajusta el contador
            // del grupo. stopPropagation evita que el clic tambien dispare el cambio de tab
            // (data-bs-toggle="tab" esta en el boton padre, no en el icono).
            window.toggleTabCheck = function (icon, event) {
                event.stopPropagation();
                var tab = icon.closest('.nav-link');
                var marcar = tab.getAttribute('data-checked') !== 'true';
                tab.setAttribute('data-checked', marcar ? 'true' : 'false');
                icon.classList.toggle('ri-checkbox-blank-circle-line', !marcar);
                icon.classList.toggle('ri-checkbox-circle-fill', marcar);
                icon.classList.toggle('examen-tab-check--on', marcar);
                actualizarBadgeGrupoExamen(tab.closest('.examen-grupo'));
            };

            // Carga el formulario de una seccion dentro de su tab-pane (una sola vez -
            // si ya tiene data-loaded="true" no vuelve a pedirlo al servidor).
            async function cargarPaneExamen(pane) {
                if (!pane || pane.dataset.loaded === 'true' || pane.dataset.loading === 'true') {
                    return;
                }
                var seccion = pane.getAttribute('data-seccion');
                var tab = document.querySelector('.examen-tabs [data-bs-target="#' + pane.id + '"]');
                var nss = (tab && tab.getAttribute('data-nss')) || (input.value || '').trim();
                pane.dataset.loading = 'true';
                pane.innerHTML = '<div class="text-muted fs-sm py-2"><span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Cargando...</div>';
                try {
                    var body = new URLSearchParams();
                    body.append('data', seccion);
                    body.append('nss', nss);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }
                    var response = await fetch(contextPath + 'api/nss/examen/seccion', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'text/html' },
                        body: body.toString()
                    });
                    if (!response.ok) {
                        pane.innerHTML = '<div class="alert alert-danger mb-0">Error al cargar la seccion (HTTP ' + response.status + ').</div>';
                        return;
                    }
                    pane.innerHTML = await response.text();
                    pane.dataset.loaded = 'true';
                } catch (error) {
                    pane.innerHTML = '<div class="alert alert-danger mb-0">Error de red al cargar la seccion.</div>';
                } finally {
                    pane.dataset.loading = 'false';
                }
            }

            // Delegado en #moduleContent (existe desde el arranque de la pagina) en vez de
            // #examenAccordion (se inyecta despues via innerHTML cuando se abre el modulo
            // Examen - un addEventListener directo sobre el no encontraria nada todavia).
            // El tab que arranca activo por default (el primero de cada grupo) no dispara
            // "shown.bs.tab" al renderizarse (no hay cambio de tab, ya nace activo) - se
            // carga aparte cuando el usuario abre el acordeon de ese grupo por primera vez.
            var moduleContentEl = document.getElementById('moduleContent');
            if (moduleContentEl) {
                moduleContentEl.addEventListener('shown.bs.collapse', function (e) {
                    if (!e.target.closest('#examenAccordion')) {
                        return;
                    }
                    cargarPaneExamen(e.target.querySelector('.examen-tab-content .tab-pane.active'));
                });
                // Cambios de tab subsecuentes (clic del usuario).
                moduleContentEl.addEventListener('shown.bs.tab', function (e) {
                    if (!e.target.closest('#examenAccordion')) {
                        return;
                    }
                    var target = e.target.getAttribute('data-bs-target');
                    cargarPaneExamen(target ? document.querySelector(target) : null);
                });
            }

            // "Abrir todo" (equivale a openAll() del PHP): expande todos los grupos del acordeon y
            // carga todas las secciones - las que nacen activas via cargarPaneExamen directo y las
            // demas activando su tab, para que quede TODO cargado y navegable sin clics.
            window.abrirTodoExamen = async function (btn) {
                var acordeon = document.getElementById('examenAccordion');
                if (!acordeon) {
                    return;
                }
                if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span>Cargando...'; }
                var grupos = acordeon.querySelectorAll('.accordion-collapse');
                // sin data-bs-parent, abrir un grupo ya no cierra los demas: quedan todos visibles
                grupos.forEach(function (g) { g.classList.add('show'); g.removeAttribute('data-bs-parent'); });
                acordeon.querySelectorAll('.accordion-button').forEach(function (b) { b.classList.remove('collapsed'); b.setAttribute('aria-expanded', 'true'); });
                // Una sola peticion con todas las secciones (antes: una por pane, 46 en total).
                var panes = Array.prototype.slice.call(acordeon.querySelectorAll('.examen-tab-content .tab-pane'));
                var nssTodo = (input.value || '').trim();
                var cargadoEnBloque = false;
                try {
                    var bodyTodo = new URLSearchParams();
                    bodyTodo.append('nss', nssTodo);
                    var csrfTodo = form.querySelector('input[type="hidden"][name]');
                    if (csrfTodo && csrfTodo.name) { bodyTodo.append(csrfTodo.name, csrfTodo.value); }
                    var respTodo = await fetch(contextPath + 'api/nss/examen/secciones', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
                        body: bodyTodo.toString()
                    });
                    if (respTodo.ok) {
                        var htmls = await respTodo.json();
                        panes.forEach(function (p) {
                            if (p.dataset.loaded === 'true') { return; }
                            var h = htmls[p.getAttribute('data-seccion')];
                            if (h) { p.innerHTML = h; p.dataset.loaded = 'true'; }
                        });
                        cargadoEnBloque = true;
                    }
                } catch (e) { /* cae al modo uno por uno */ }
                if (!cargadoEnBloque) {
                    for (var i = 0; i < panes.length; i++) {
                        await cargarPaneExamen(panes[i]);
                    }
                }
                if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ri-folder-open-line me-1"></i>Abrir todo'; }
            };

            // Antecedentes laborales - trabajos previos: fila repetible dentro de #trabajosPrevios.
            // No se precarga desde el WS (ver comentario en examen-shell.html); solo agrega/quita filas nuevas.
            var trabajoContador = 0;
            window.agregarTrabajoExamen = function () {
                var body = document.getElementById('trabajosBody');
                var vacio = document.getElementById('trabajosVacio');
                if (!body) {
                    return;
                }
                var idx = trabajoContador++;
                var campos = ['nombre', 'giro', 'puesto', 'turno', 'antiguedad', 'salida', 'riesgos', 'epp', 'descripcion', 'observaciones'];
                var tr = document.createElement('tr');
                tr.setAttribute('data-trabajo-row', String(idx));
                campos.forEach(function (campo) {
                    var td = document.createElement('td');
                    var inp = document.createElement('input');
                    inp.type = 'text';
                    inp.className = 'form-control form-control-sm';
                    inp.name = 'trabajos[' + idx + '].' + campo;
                    if (campo === 'nombre') {
                        inp.value = String(idx + 1);
                    }
                    td.appendChild(inp);
                    tr.appendChild(td);
                });
                var tdBtn = document.createElement('td');
                var btnQuitar = document.createElement('button');
                btnQuitar.type = 'button';
                btnQuitar.className = 'btn btn-sm btn-outline-danger';
                btnQuitar.innerHTML = '<i class="ri-delete-bin-line"></i>';
                btnQuitar.onclick = function () {
                    tr.remove();
                    if (vacio) {
                        vacio.style.display = body.children.length ? 'none' : '';
                    }
                };
                tdBtn.appendChild(btnQuitar);
                tr.appendChild(tdBtn);
                body.appendChild(tr);
                if (vacio) {
                    vacio.style.display = 'none';
                }
            };

            // Guarda el examen completo: recolecta los campos de las secciones cargadas + firma.
            // Las secciones ahora viven en los tab-panes del acordeon (#examenAccordion), no en
            // un contenedor unico - solo importan los panes con contenido real (data-loaded),
            // los que nunca se visitaron siguen con el placeholder "Selecciona esta pestaña..."
            // sin inputs, asi que igual no aportarian campos aunque se incluyeran.
            window.guardarExamen = async function (btn) {
                var cont = document.getElementById('examenAccordion');
                var trabajos = document.getElementById('trabajosPrevios');
                // Diagnostico solo es obligatorio si esa seccion esta abierta - las secciones no
                // cargadas no se mandan (evita clobber), asi que no tiene sentido exigirlo si el
                // usuario esta guardando otras secciones sin haber tocado Diagnostico esta vez.
                // Regla del PO: diagnostico ICD obligatorio - pero solo al cerrar el examen (cuando
                // se guarda un dictamen). Exigirlo con solo tener la pestana cargada bloqueaba
                // cualquier guardado tras "Abrir todo", incluso cambiar la firma.
                var diagEl = document.getElementById('examenDiagnostico');
                var dictamenEl = document.querySelector('select[name="SERV_MED_RESULTADO_EXAMEN.DICTAMEN"]');
                if (diagEl && !diagEl.value.trim() && dictamenEl && dictamenEl.value) {
                    pintarResultadoInline(document.getElementById('examenGuardarResult'),
                            'Para guardar un dictamen selecciona al menos un diagnóstico del catálogo ICD (Cierre → Diagnóstico → Buscar diagnóstico).', true);
                    // Llevar al usuario al campo: abrir el grupo y la pestana de Diagnostico, y
                    // enfocar el buscador ICD (el cuadro de diagnostico es solo lectura).
                    var paneDiag = diagEl.closest('.tab-pane');
                    var grupoDiag = diagEl.closest('.accordion-collapse');
                    if (grupoDiag && !grupoDiag.classList.contains('show')) {
                        var hdr = document.querySelector('[data-bs-target="#' + grupoDiag.id + '"]');
                        if (hdr) { hdr.click(); }
                    }
                    if (paneDiag) {
                        var tabDiag = document.querySelector('.examen-tabs [data-bs-target="#' + paneDiag.id + '"]');
                        if (tabDiag) { tabDiag.click(); }
                    }
                    var buscador = document.getElementById('examenIcdConsult');
                    setTimeout(function () {
                        var destino = buscador || diagEl;
                        destino.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        destino.focus();
                        destino.classList.add('is-invalid');
                        setTimeout(function () { destino.classList.remove('is-invalid'); }, 4000);
                    }, 400);
                    return;
                }
                var nss = (input.value || '').trim();
                var body = new URLSearchParams();
                body.append('nss', nss);
                if (cont) {
                    cont.querySelectorAll('input[name], select[name], textarea[name]').forEach(function (el) {
                        body.append(el.name, el.value);
                    });
                }
                if (trabajos) {
                    trabajos.querySelectorAll('input[name], select[name], textarea[name]').forEach(function (el) {
                        body.append(el.name, el.value);
                    });
                }
                var firmaEl = document.getElementById('firma');
                if (firmaEl) {
                    body.append('firma', firmaEl.value);
                }
                var csrf = form.querySelector('input[type="hidden"][name]');
                if (csrf && csrf.name) {
                    body.append(csrf.name, csrf.value);
                }
                if (btn.disabled) {
                    return;
                }
                // Resultado inline junto al boton: el status global (#nssSearchStatus) queda
                // pegado al buscador NSS, muy arriba, fuera de vista cuando el examen esta
                // mas abajo en la pantalla - sin esto el usuario nunca veia si se guardo o no.
                var resultEl = document.getElementById('examenGuardarResult');
                function mostrarResultadoExamen(texto, esError) {
                    if (resultEl) {
                        pintarResultadoInline(resultEl, texto, esError);
                    } else {
                        status.textContent = texto;
                    }
                }
                var originalHtml = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Guardando...';
                mostrarResultadoExamen('Guardando examen...', false);
                // Documento firmado -> PDF al momento (docs/plan-descarga-documento-firmado.md,
                // opcion A): si el examen lleva firma, la pestana del documento se abre AQUI, en
                // el clic (los navegadores bloquean window.open despues de un await), y se
                // navega al expediente con ?auto=1 (lanza el dialogo de imprimir / guardar como
                // PDF) solo si el guardado fue exitoso; si falla, se cierra.
                // Se abre el expediente al guardar cuando el documento queda firmado: firma nueva
                // en el recuadro, o dictamen guardado con una firma ya almacenada en el WS.
                var firmaNueva = !!(firmaEl && firmaEl.value);
                var canvasFirma = document.getElementById('firmaCanvas');
                var firmaAlmacenada = !!(canvasFirma && canvasFirma.dataset.firmaGuardada);
                var conDictamen = !!(dictamenEl && dictamenEl.value);
                var conFirma = firmaNueva || (firmaAlmacenada && conDictamen);
                var urlDocumento = contextPath + 'api/nss/examen/imprimir?nss=' + encodeURIComponent(nss) + '&auto=1';
                var ventanaDoc = null;
                if (conFirma) {
                    try {
                        ventanaDoc = window.open('', '_blank');
                        if (ventanaDoc) {
                            ventanaDoc.document.write('<p style="font:14px system-ui;padding:24px">Guardando el examen y generando el expediente para imprimir…</p>');
                        }
                    } catch (e) { ventanaDoc = null; }
                }
                try {
                    var response = await fetch(contextPath + 'api/nss/examen/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'text/plain' },
                        body: body.toString()
                    });
                    var txt = await response.text();
                    if (response.ok && conFirma) {
                        if (ventanaDoc) {
                            ventanaDoc.location.href = urlDocumento;
                        }
                        mostrarResultadoExamen('Examen: ' + txt, false);
                        if (resultEl) {
                            // enlace por si el navegador bloqueo la pestana
                            var a = document.createElement('a');
                            a.href = urlDocumento;
                            a.target = '_blank';
                            a.className = 'ms-2';
                            a.innerHTML = '<i class="ri-printer-line me-1"></i>Descargar expediente (PDF)';
                            resultEl.appendChild(a);
                        }
                    } else {
                        if (ventanaDoc) { ventanaDoc.close(); }
                        mostrarResultadoExamen(response.ok ? ('Examen: ' + txt)
                                : ('Error al guardar (HTTP ' + response.status + '): ' + txt), !response.ok);
                    }
                } catch (error) {
                    if (ventanaDoc) { ventanaDoc.close(); }
                    mostrarResultadoExamen('Error de red al guardar el examen.', true);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                }
            };

            // Detalle de una consulta (viewConsultaDetails) en el modal.
            window.verConsulta = function (btn) {
                cargarDetalle('api/nss/expediente/detalle', btn.getAttribute('data-id-consulta'), 'Detalle de consulta');
            };

            // Detalle de una incapacidad (viewIncapDetails) en el modal.
            window.verIncapacidad = function (btn) {
                cargarDetalle('api/nss/incapacidades/detalle', btn.getAttribute('data-id-consulta'), 'Detalle de incapacidad');
            };

            // Seguimiento de un caso de accidente (historial + evidencias) en el modal.
            window.verSeguimientoAccidente = function (btn) {
                cargarDetalle('api/nss/accidentes/detalle', btn.getAttribute('data-id-accidente'), 'Seguimiento de accidente');
            };

            // Agrega una entrada de seguimiento (o cierra el caso) y refresca el modal.
            window.guardarSeguimientoAccidente = async function (btn) {
                var regId = btn.getAttribute('data-accidente-regid');
                var tipo = btn.getAttribute('data-tipo');
                var obsEl = document.getElementById('accSeguimientoObs');
                var statusEl = document.getElementById('accSeguimientoStatus');
                var observaciones = obsEl ? obsEl.value.trim() : '';
                if (!observaciones) {
                    if (statusEl) {
                        statusEl.innerHTML = '<span class="text-danger">Escribe una observacion.</span>';
                    }
                    return;
                }
                var body = new URLSearchParams();
                body.append('accidenteRegId', regId);
                body.append('tipo', tipo);
                body.append('observaciones', observaciones);
                var csrf = form.querySelector('input[type="hidden"][name]');
                if (csrf && csrf.name) {
                    body.append(csrf.name, csrf.value);
                }
                btn.disabled = true;
                try {
                    var response = await fetch(contextPath + 'api/nss/accidentes/seguimiento/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'text/plain' },
                        body: body.toString()
                    });
                    var txt = await response.text();
                    if (response.ok) {
                        await cargarDetalle('api/nss/accidentes/detalle', regId, 'Seguimiento de accidente');
                        // El modal ya se refresco, pero la lista de accidentes de #moduleContent
                        // (detras del modal) se cargo ANTES de este cambio - su badge de Estado
                        // se queda desactualizado (ej. sigue en ABIERTO tras cerrar el caso) hasta
                        // que se refresque tambien.
                        loadModuleView('api/nss/accidentes', (input.value || '').trim());
                    } else if (statusEl) {
                        statusEl.innerHTML = '<span class="text-danger">' + (txt || ('Error HTTP ' + response.status)) + '</span>';
                    }
                } catch (error) {
                    if (statusEl) {
                        statusEl.innerHTML = '<span class="text-danger">Error de red al guardar el seguimiento.</span>';
                    }
                } finally {
                    btn.disabled = false;
                }
            };

            // Sube evidencias (mismo endpoint/mecanismo que los adjuntos de Consulta,
            // relacion = "accidente-<id>") y refresca el modal.
            window.subirEvidenciaAccidente = async function (btn) {
                var nss = btn.getAttribute('data-nss');
                var relacion = btn.getAttribute('data-relacion');
                var regId = btn.getAttribute('data-accidente-regid');
                var fileInput = document.getElementById('accEvidenciaFiles');
                if (!fileInput || !fileInput.files || !fileInput.files.length) {
                    return;
                }
                var fd = new FormData();
                fd.append('nss', nss);
                fd.append('relacion', relacion);
                for (var i = 0; i < fileInput.files.length; i++) {
                    fd.append('file', fileInput.files[i]);
                }
                var headers = {};
                var csrf = form.querySelector('input[type="hidden"][name]');
                if (csrf) {
                    headers['X-CSRF-TOKEN'] = csrf.value;
                }
                btn.disabled = true;
                try {
                    var response = await fetch(contextPath + 'api/nss/consulta/file', {
                        method: 'POST', headers: headers, body: fd
                    });
                    if (response.ok) {
                        await cargarDetalle('api/nss/accidentes/detalle', regId, 'Seguimiento de accidente');
                    }
                } catch (error) {
                    // silencioso, igual que subirArchivo - el usuario ve que la lista no cambio
                } finally {
                    btn.disabled = false;
                }
            };

            window.borrarEvidenciaAccidente = async function (btn) {
                var id = btn.getAttribute('data-id');
                var regId = btn.getAttribute('data-accidente-regid');
                var headers = {};
                var csrf = form.querySelector('input[type="hidden"][name]');
                if (csrf) {
                    headers['X-CSRF-TOKEN'] = csrf.value;
                }
                try {
                    var response = await fetch(contextPath + 'api/nss/consulta/file/' + encodeURIComponent(id) + '/delete', {
                        method: 'POST', headers: headers
                    });
                    if (response.ok) {
                        await cargarDetalle('api/nss/accidentes/detalle', regId, 'Seguimiento de accidente');
                    }
                } catch (error) {
                    // silencioso, igual que borrarArchivo
                }
            };

            // Reporte de incapacidades por rango de fechas (todas las NSS, no solo la actual).
            window.generarReporteIncapacidades = async function (btn) {
                var ini = document.getElementById('reporteFechaInicial');
                var fin = document.getElementById('reporteFechaFinal');
                var out = document.getElementById('reporteIncapacidadesResult');
                if (!ini || !fin || !out) {
                    return;
                }
                if (!ini.value || !fin.value) {
                    out.innerHTML = '<div class="alert alert-warning mb-0">Indica ambas fechas.</div>';
                    return;
                }
                var textoOriginal = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Generar';
                out.innerHTML = '';
                try {
                    var body = new URLSearchParams();
                    body.append('fechaInicial', ini.value);
                    body.append('fechaFinal', fin.value);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }
                    var response = await fetch(contextPath + 'api/nss/incapacidades/reporte', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'text/html' },
                        body: body.toString()
                    });
                    var texto = await response.text();
                    if (!response.ok) {
                        out.innerHTML = '<div class="alert alert-danger mb-0">' + escapeHtml(texto || ('Error HTTP ' + response.status)) + '</div>';
                        return;
                    }
                    out.innerHTML = texto;
                } catch (error) {
                    out.innerHTML = '<div class="alert alert-danger mb-0">Error de red al generar el reporte.</div>';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = textoOriginal;
                }
            };

            function escapeHtml(s) {
                return (s || '').replace(/[&<>"']/g, function (ch) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
                });
            }

            // Filtro cliente de una tabla (input dentro de la misma .card). Reutilizable.
            window.filtrarConsultas = function (input) {
                var card = input.closest('.card');
                var table = card ? card.querySelector('table') : null;
                if (!table) {
                    return;
                }
                var q = (input.value || '').toLowerCase();
                // Si la misma tarjeta tiene un filtro de ramo y/o rubro (Incapacidades), se
                // combinan con el buscador de texto; en el resto de las tablas no existen esos
                // selects y no cambia nada.
                var ramoSelect = card.querySelector('[data-filtro-ramo]');
                var ramo = ramoSelect ? ramoSelect.value : '';
                var rubroSelect = card.querySelector('[data-filtro-rubro]');
                var rubro = rubroSelect ? rubroSelect.value.toLowerCase() : '';
                table.querySelectorAll('tbody tr').forEach(function (tr) {
                    var matchTexto = tr.textContent.toLowerCase().indexOf(q) >= 0;
                    var matchRamo = !ramo || tr.getAttribute('data-ramo') === ramo;
                    var matchRubro = !rubro || (tr.getAttribute('data-rubro') || '').toLowerCase() === rubro;
                    tr.style.display = (matchTexto && matchRamo && matchRubro) ? '' : 'none';
                });
            };

            // Filtro de ramo (Incapacidades): reusa filtrarConsultas para combinarse con el
            // buscador de texto (y el filtro de rubro) de la misma tarjeta, si existe.
            window.filtrarPorRamo = function (select) {
                var card = select.closest('.card');
                var input = card ? card.querySelector('input[oninput]') : null;
                if (input) {
                    window.filtrarConsultas(input);
                    return;
                }
                var table = card ? card.querySelector('table') : null;
                if (!table) {
                    return;
                }
                var ramo = select.value;
                table.querySelectorAll('tbody tr').forEach(function (tr) {
                    tr.style.display = (!ramo || tr.getAttribute('data-ramo') === ramo) ? '' : 'none';
                });
            };

            // Filtro de rubro (Interna/IMSS, Incapacidades): mismo patron que filtrarPorRamo.
            window.filtrarPorRubro = function (select) {
                var card = select.closest('.card');
                var input = card ? card.querySelector('input[oninput]') : null;
                if (input) {
                    window.filtrarConsultas(input);
                    return;
                }
                var table = card ? card.querySelector('table') : null;
                if (!table) {
                    return;
                }
                var rubro = select.value.toLowerCase();
                table.querySelectorAll('tbody tr').forEach(function (tr) {
                    tr.style.display = (!rubro || (tr.getAttribute('data-rubro') || '').toLowerCase() === rubro) ? '' : 'none';
                });
            };

            // Exporta la tabla de la misma .card a un archivo Excel (.xls). Respeta el filtro
            // (solo filas visibles) y omite columnas marcadas con [data-no-export].
            window.exportarConsultasExcel = function (btn) {
                var card = btn.closest('.card');
                var table = card ? card.querySelector('table') : null;
                if (!table) {
                    return;
                }
                var name = table.getAttribute('data-export-name') || 'export';
                var html = '<meta charset="utf-8"><table border="1"><thead><tr>';
                table.querySelectorAll('thead th').forEach(function (th) {
                    if (th.hasAttribute('data-no-export')) { return; }
                    html += '<th>' + escapeHtml(th.textContent.trim()) + '</th>';
                });
                html += '</tr></thead><tbody>';
                table.querySelectorAll('tbody tr').forEach(function (tr) {
                    if (tr.style.display === 'none') { return; }
                    html += '<tr>';
                    tr.querySelectorAll('td').forEach(function (td) {
                        if (td.hasAttribute('data-no-export')) { return; }
                        html += '<td>' + escapeHtml(td.textContent.trim()) + '</td>';
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';

                var bom = String.fromCharCode(0xFEFF);
                var blob = new Blob([bom + html], { type: 'application/vnd.ms-excel' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = name + '.xls';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            form.addEventListener('submit', function (event) {
                event.preventDefault();
                doSearch();
            });

            // Shortcut: si la pagina se abrio con un NSS pre-cargado (?nss=...), buscar automaticamente.
            if ((input.value || '').trim()) {
                doSearch();
            }
        }());
    </script>
</th:block>
</body>
