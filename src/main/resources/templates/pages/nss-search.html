            // Acomoda el modulo al formato del tipo (16-oct-2026): al ELEGIR el tipo (vista previa,
            // "(sin guardar)") y al guardarlo. Cada tipo ve lo de su formato (VisibilidadTipo.java,
            // clases "ocultar-en-N"); si la pestana activa quedo oculta pasa a la primera visible y
            // los resumenes por seccion se repintan. Deja un log en la consola para validar.
            window.exAplicarTipo = function (valor, guardado) {
                var sel = document.getElementById('examenTipo');
                if (!sel) { return; }
                var sinTipo = !valor;
                var nombre = sinTipo ? 'Sin tipo de examen' : sel.options[sel.selectedIndex].text;
                // selector de arriba (20-oct-2026): mismo valor y color que el de Datos generales. "Sin guardar"
                // mientras el tipo elegido no sea el que esta en BD (data-guardado); al guardar se actualiza.
                var arriba = document.getElementById('examenTipoArriba');
                var pendiente = !guardado;
                if (arriba) {
                    if (guardado) { arriba.setAttribute('data-guardado', valor); }
                    pendiente = valor !== (arriba.getAttribute('data-guardado') || '');
                    arriba.value = valor;
                    // (^|\s) y no \b: \b tambien corta "examen-tipo-select" y le quitaba el estilo
                    arriba.className = arriba.className.replace(/(^|\s)tipo-\S*/g, ' ').trim() + ' tipo-' + valor;
                }
                var sinGuardar = document.getElementById('examenTipoSinGuardar');
                if (sinGuardar) { sinGuardar.classList.toggle('d-none', !pendiente); }
                // aviso: Admision (1) es el examen inicial y se captura en su propio menu
                var aviso = document.getElementById('examenAvisoInicial');
                if (aviso) { aviso.classList.toggle('d-none', valor !== '1'); }
                // el badge de "Datos generales del examen" dice lo mismo que el selector de arriba
                var badgeDatos = document.getElementById('examenTipoBadgeDatos');
                if (badgeDatos) {
                    badgeDatos.textContent = nombre + (pendiente ? ' (sin guardar)' : '');
                    badgeDatos.className = 'badge text-dark ms-2 ' + (sinTipo ? 'bg-warning' : 'bg-light');
                }
                var fmt = document.getElementById('examenFormatoTag');
                if (fmt) {
                    var mapa = {};
                    (fmt.getAttribute('data-formatos') || '').split(',').forEach(function (p) { var kv = p.split('='); mapa[kv[0]] = kv[1]; });
                    fmt.textContent = mapa[valor] || '';
                    fmt.classList.toggle('d-none', sinTipo);
                }
                var acordeon = document.getElementById('examenAccordion');
                if (!acordeon) { return; }
                acordeon.className = acordeon.className.replace(/\btipo-\S*/g, '').trim() + ' tipo-' + valor;
                var extra = document.getElementById('examenExtraAccordion');
                if (extra) { extra.className = extra.className.replace(/\btipo-\S*/g, '').trim() + ' tipo-' + valor; }
                acordeon.querySelectorAll('.examen-tabs').forEach(function (ul) {
                    var activa = ul.querySelector('.nav-link.active');
                    if (!activa || !exOcultoTipo(activa)) { return; }
                    var visible = [].find.call(ul.querySelectorAll('.nav-item'), function (li) { return !exOcultoTipo(li); });
                    if (visible) { bootstrap.Tab.getOrCreateInstance(visible.querySelector('.nav-link')).show(); }
                });
                acordeon.querySelectorAll('.tab-pane[data-resumen="lista"]').forEach(function (p) {
                    if (p.querySelector('.exapp-lista')) { exListaResumen(p); }
                });
                var visibles = function (raiz) {
                    return raiz ? [].filter.call(raiz.querySelectorAll(':scope > .accordion-item'), function (g) { return getComputedStyle(g).display !== 'none'; })
                        .map(function (g) { return g.querySelector('.accordion-button').textContent.trim().replace(/\s+/g, ' '); }) : [];
                };
                console.info('[examen] tipo ' + (valor || '(vacío)') + ' «' + nombre + '» ' + (fmt ? fmt.textContent : '')
                        + (pendiente ? ' (sin guardar)' : ' (guardado)') + '\n  grupos: ' + visibles(acordeon).join(' | ')
                        + '\n  otros datos: ' + visibles(extra).join(' | '));
            };

            // " FT-SO-xx" del tipo actual (examen-shell.html, #examenFormatoTag) o "" sin tipo
            window.exFormatoActual = function () {
                var fmt = document.getElementById('examenFormatoTag');
                return fmt && !fmt.classList.contains('d-none') && fmt.textContent.trim() ? ' ' + fmt.textContent.trim() : '';
            };

            // true si el elemento (o su grupo/seccion) no va en el tipo de examen actual
            window.exOcultoTipo = function (el) {
                var acordeon = document.getElementById('examenAccordion');
                var m = acordeon ? /(?:^|\s)tipo-(\S*)/.exec(acordeon.className) : null;
                return !!(el && m && el.closest('.ocultar-en-' + m[1]));
            };

            // ===== Examen medico inicial (fragments/examen-inicial-shell.html) =====
            // Asistente por hojas con borrador que se guarda solo: cada cambio en la hoja activa
            // dispara un autoguardado (debounce) a /api/nss/examen-inicial/borrador con los campos
            // de ESA hoja; el servidor los funde con el borrador existente. Nada viaja al WS hasta
            // "Finalizar". Todo cuelga de window.* porque el fragmento se inyecta con innerHTML.
            var exIniTimer = null;
            var exIniPendiente = false;

            function exIniRoot() {
                return document.getElementById('exIni');
            }

            function exIniHojaActiva() {
                var root = exIniRoot();
                return root ? parseInt(root.getAttribute('data-hoja'), 10) || 1 : 1;
            }

            function exIniCamposDe(section) {
                var datos = {};
                section.querySelectorAll('input[name], select[name], textarea[name]').forEach(function (el) {
                    if (el.type === 'hidden' && (el.name === 'nss' || el.name === 'hoja' || el.name === 'firma')) {
                        return;
                    }
                    datos[el.name] = el.value;
                });
                return datos;
            }

            function exIniMarcarGuardado(texto, esError) {
                var el = document.getElementById('exIniGuardado');
                if (!el) {
                    return;
                }
                el.textContent = texto;
                el.classList.toggle('err', !!esError);
            }

            // Boton "Abrir examen inicial" del aviso de solicitud OCR pendiente (fragments/nss-result.html).
            // loadModuleView es local a este closure, por eso el puente.
            window.abrirExamenInicialPrueba = function (nss) {
                loadModuleView('api/nss/examen-inicial', nss);
            };

            // Mascara de telefono a 10 digitos: en pantalla "55 1234 5678"; lo que se guarda es
            // el hidden hermano (name=contactoEmertelefonoN) con los digitos de corrido.
            window.exIniMascaraTel = function (inp) {
                var d = inp.value.replace(/[^0-9]/g, '').slice(0, 10);
                var out = d;
                if (d.length > 6) { out = d.slice(0, 2) + ' ' + d.slice(2, 6) + ' ' + d.slice(6); }
                else if (d.length > 2) { out = d.slice(0, 2) + ' ' + d.slice(2); }
                inp.value = out;
                var hidden = inp.previousElementSibling;
                while (hidden && hidden.type !== 'hidden') { hidden = hidden.previousElementSibling; }
                if (hidden && hidden.value !== d) {
                    hidden.value = d;
                    hidden.dispatchEvent(new Event('change', { bubbles: true }));
                }
            };

            window.exIniInit = function () {
                var root = exIniRoot();
                var formEl = document.getElementById('exIniForm');
                if (!root || !formEl) {
                    return;
                }
                // Cualquier cambio en la hoja activa programa un autoguardado. 'input' cubre
                // texto mientras se escribe; 'change' cubre selects, fechas y los Si/No (que
                // disparan change a mano en exIniSino).
                ['input', 'change'].forEach(function (evt) {
                    formEl.addEventListener(evt, function (e) {
                        if (e.target && e.target.name) {
                            // observacion que faltaba (Si sin observacion): se quita el rojo al escribir
                            if (e.target.classList.contains('is-invalid') && e.target.dataset.tipo !== 'OKNO' && e.target.value.trim()) {
                                e.target.classList.remove('is-invalid');
                            }
                            exIniProgramarAutosave();
                            // el switch "Todo normal" del bloque refleja el estado real
                            exIniRefrescarSwitches();
                        }
                    });
                });
                exIniRefrescarSwitches();
                // odontograma por caras: se pinta desde el texto guardado
                root.querySelectorAll('.exini-odonto .diente').forEach(exIniPintarDiente);
                // Enter en un campo de texto pasa al siguiente campo en vez de no hacer nada
                // (comodidad heredada de Excel: Enter = siguiente celda).
                formEl.addEventListener('keydown', function (e) {
                    if (e.key !== 'Enter' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') {
                        return;
                    }
                    e.preventDefault();
                    var focusables = Array.prototype.slice.call(formEl.querySelectorAll('section:not([hidden]) input:not([type=hidden]), section:not([hidden]) select, section:not([hidden]) textarea, section:not([hidden]) .exini-sino'));
                    var i = focusables.indexOf(e.target);
                    if (i >= 0 && i + 1 < focusables.length) {
                        focusables[i + 1].focus();
                    }
                });
                exIniPintarNav();
            };

            function exIniProgramarAutosave() {
                exIniPendiente = true;
                exIniMarcarGuardado('Cambios sin guardar…', false);
                if (exIniTimer) {
                    clearTimeout(exIniTimer);
                }
                exIniTimer = setTimeout(function () { exIniAutosave(); }, 1200);
            }

            // Los autoguardados van en fila (exIniCola): el que sale al dejar una hoja y el que
            // programa la hoja nueva no deben viajar en paralelo, o el servidor fusiona sobre un
            // borrador viejo. Los datos se toman al momento de encolar (no al enviar).
            var exIniCola = Promise.resolve();
            window.exIniAutosave = function (hojaForzada) {
                var root = exIniRoot();
                if (!root) {
                    return exIniCola;
                }
                if (exIniTimer) {
                    clearTimeout(exIniTimer);
                    exIniTimer = null;
                }
                var hoja = hojaForzada || exIniHojaActiva();
                var section = root.querySelector('section.exini-hoja[data-hoja="' + hoja + '"]');
                if (!section) {
                    return exIniCola;
                }
                var cuerpo = JSON.stringify({ nss: root.getAttribute('data-nss'), hoja: hoja, datos: exIniCamposDe(section) });
                exIniCola = exIniCola.then(function () { return exIniEnviarBorrador(cuerpo); });
                return exIniCola;
            };

            async function exIniEnviarBorrador(cuerpo) {
                var t = document.querySelector('meta[name="_csrf"]');
                var h = document.querySelector('meta[name="_csrf_header"]');
                var headers = { 'Content-Type': 'application/json', 'Accept': 'text/plain' };
                if (t && h) { headers[h.content] = t.content; }
                try {
                    var response = await fetch(contextPath + 'api/nss/examen-inicial/borrador', {
                        method: 'POST', headers: headers,
                        body: cuerpo
                    });
                    var txt = await response.text();
                    if (response.ok) {
                        exIniPendiente = false;
                        exIniMarcarGuardado('Guardado ' + txt, false);
                        exIniPintarStepper();
                    } else {
                        exIniMarcarGuardado('No se pudo guardar el borrador (HTTP ' + response.status + '): ' + txt, true);
                    }
                } catch (error) {
                    exIniMarcarGuardado('Sin conexión: el borrador no se guardó', true);
                }
            }

            // n = numero de hoja, o delta (+1/-1) si relativo=true.
            window.exIniIr = function (n, relativo) {
                var root = exIniRoot();
                if (!root) {
                    return;
                }
                var total = parseInt(root.getAttribute('data-total-hojas'), 10) || 10;
                var actual = exIniHojaActiva();
                var destino = relativo ? actual + n : n;
                if (destino < 1 || destino > total || destino === actual) {
                    return;
                }
                // La hoja que se abandona se guarda ya (sin esperar el debounce)
                if (exIniPendiente) {
                    exIniAutosave(actual);
                }
                root.querySelectorAll('section.exini-hoja').forEach(function (s) {
                    s.hidden = parseInt(s.getAttribute('data-hoja'), 10) !== destino;
                });
                root.setAttribute('data-hoja', String(destino));
                var hojaInput = document.getElementById('exIniHoja');
                if (hojaInput) {
                    hojaInput.value = String(destino);
                }
                exIniPintarNav();
                // Recordar en que hoja se quedo (aunque no haya cambios): se manda la hoja
                // destino con sus campos tal cual estan.
                exIniAutosave(destino);
                root.scrollIntoView({ behavior: 'smooth', block: 'start' });
                var primero = root.querySelector('section.exini-hoja[data-hoja="' + destino + '"] input:not([type=hidden]), section.exini-hoja[data-hoja="' + destino + '"] .exini-sino');
                if (primero) {
                    setTimeout(function () { primero.focus(); }, 300);
                }
            };

            function exIniPintarNav() {
                var root = exIniRoot();
                if (!root) {
                    return;
                }
                var total = parseInt(root.getAttribute('data-total-hojas'), 10) || 10;
                var actual = exIniHojaActiva();
                var pos = document.getElementById('exIniPos');
                if (pos) { pos.textContent = 'Hoja ' + actual + ' de ' + total; }
                var prev = document.getElementById('exIniPrev');
                var next = document.getElementById('exIniNext');
                if (prev) { prev.disabled = actual <= 1; }
                if (next) { next.disabled = actual >= total; }
                root.querySelectorAll('#exIniStepper button[data-ir]').forEach(function (b) {
                    b.classList.toggle('activa', parseInt(b.getAttribute('data-ir'), 10) === actual);
                });
            }

            // Barra de avance de cada hoja del stepper, calculada en el navegador con lo que hay
            // en pantalla (el servidor la calcula igual al recargar).
            function exIniPintarStepper() {
                var root = exIniRoot();
                if (!root) {
                    return;
                }
                root.querySelectorAll('section.exini-hoja').forEach(function (s) {
                    var n = parseInt(s.getAttribute('data-hoja'), 10);
                    var campos = s.querySelectorAll('input[name]:not([type=hidden]), select[name], textarea[name], input[type=hidden][name]:not([name=nss]):not([name=hoja]):not([name=firma])');
                    var llenos = 0;
                    campos.forEach(function (el) { if (el.value && String(el.value).trim() !== '') { llenos++; } });
                    var btn = root.querySelector('#exIniStepper button[data-ir="' + n + '"]');
                    if (btn) {
                        var bar = btn.querySelector('.p span');
                        if (bar) { bar.style.width = (campos.length ? Math.round(100 * llenos / campos.length) : 0) + '%'; }
                        btn.classList.toggle('completa', campos.length > 0 && llenos === campos.length);
                    }
                });
            }

            // Si/No como botones: el valor vive en el hidden; S/N por teclado sobre el grupo.
            // `valor` es '1' (Si) o '0' (No); lo que se GUARDA sale de data-si/data-no del grupo
            // (default 1/0; orientacion en Exploracion fisica guarda "Sí"/"No" porque el WS lo
            // tiene como texto y el impreso lo pinta literal).
            function exIniValoresSino(grupo) {
                return { si: grupo.getAttribute('data-si') || '1', no: grupo.getAttribute('data-no') || '0' };
            }

            function exIniPintarSino(grupo) {
                var v = exIniValoresSino(grupo);
                var hidden = grupo.querySelector('input[type=hidden]');
                var botones = grupo.querySelectorAll('button');
                botones[0].classList.toggle('activo-si', hidden.value === v.si);
                botones[1].classList.toggle('activo-no', hidden.value === v.no);
            }

            window.exIniSino = function (btn, valor) {
                var grupo = btn.closest('.exini-sino');
                if (!grupo) {
                    return;
                }
                var v = exIniValoresSino(grupo);
                var hidden = grupo.querySelector('input[type=hidden]');
                var nuevo = valor === '1' ? v.si : v.no;
                // segundo clic en el mismo = sin contestar
                hidden.value = hidden.value === nuevo ? '' : nuevo;
                exIniPintarSino(grupo);
                var fila = grupo.closest('.exini-fila');
                var obs = fila ? fila.querySelector('input[type=text]') : null;
                // FT-SO-04: "NEGADOS" es la observacion predeterminada SOLO del No. Con Si se
                // limpia para escribir el antecedente; al volver a No (heredofamiliares) regresa.
                var bloque = grupo.closest('.exini-bloque');
                var sw = bloque ? bloque.querySelector('.exini-switch input[data-modo="negados"]') : null;
                if (obs && hidden.value === v.si && /NEGAD/i.test(obs.value)) {
                    obs.value = '';
                } else if (obs && sw && hidden.value === v.no && obs.value.trim() === '') {
                    obs.value = 'NEGADOS';
                }
                hidden.dispatchEvent(new Event('change', { bubbles: true }));
                // Con Si, llevar el cursor a las observaciones de esa fila
                if (hidden.value === v.si && obs) {
                    obs.focus();
                }
            };

            // Chips de UNA opcion (constitucion, emocional, fascies, marcha): el texto literal
            // del legacy va al hidden; clic en la activa la desmarca.
            window.exIniChip = function (btn) {
                var grupo = btn.closest('.exini-chips');
                var hidden = grupo.querySelector('input[type=hidden]');
                var val = btn.getAttribute('data-val');
                hidden.value = hidden.value === val ? '' : val;
                grupo.querySelectorAll('button').forEach(function (b) {
                    b.classList.toggle('activo', b.getAttribute('data-val') === hidden.value);
                });
                hidden.dispatchEvent(new Event('change', { bubbles: true }));
            };

            // Inmunizaciones: Todo Si / Todo No sobre las 7 vacunas (no toca COVID ni las fechas)
            window.exSecTodasVacunas = function (btn, valor) {
                var card = btn.closest('.exsec');
                card.querySelectorAll('.exinm .exini-chips').forEach(function (grupo) {
                    var hidden = grupo.querySelector('input[type=hidden]');
                    if (!hidden) { return; }
                    hidden.value = valor;
                    grupo.querySelectorAll('button').forEach(function (b) {
                        b.classList.toggle('activo', b.getAttribute('data-val') === valor);
                    });
                    hidden.dispatchEvent(new Event('change', { bubbles: true }));
                });
            };

            // No / Si + detalle (pension, examen-seccion.html :: sinoTexto). El hidden lleva "NO",
            // el detalle escrito o "SI"; clic en el boton activo lo deja sin contestar.
            window.exSinoTexto = function (btn) {
                var cont = btn.closest('.exsino-txt');
                var hidden = cont.querySelector('input[type=hidden]');
                var det = cont.querySelector('input[type=text]');
                var modo = btn.classList.contains('activo') ? '' : btn.getAttribute('data-val');
                cont.querySelectorAll('.exini-chips button').forEach(function (b) {
                    b.classList.toggle('activo', b.getAttribute('data-val') === modo);
                });
                if (modo === 'si') {
                    det.disabled = false;
                    hidden.value = det.value.trim() || 'SI';
                    det.focus();
                } else {
                    det.value = '';
                    det.disabled = true;
                    hidden.value = modo === 'no' ? 'NO' : '';
                }
                hidden.dispatchEvent(new Event('change', { bubbles: true }));
            };

            window.exSinoTextoDetalle = function (det) {
                var hidden = det.closest('.exsino-txt').querySelector('input[type=hidden]');
                hidden.value = det.value.trim() || 'SI';
                hidden.dispatchEvent(new Event('change', { bubbles: true }));
            };

            // OK / NO del FT-SO-04 rev. 05: el valor es el texto del input. OK = texto del formato
            // (data-normal); NO = hallazgo escrito (en los de dos opciones arranca con data-alterno).
            // "Normal" (lo que ponia el "Todo normal" anterior) y "20/20" (agudeza visual) cuentan como OK.
            function exIniOkNoEsOk(fila, valor) {
                var v = (valor || '').trim().toUpperCase();
                return v !== '' && (v === (fila.getAttribute('data-normal') || '').toUpperCase() || v === 'NORMAL' || v === '20/20');
            }

            function exIniOkNoPintar(fila) {
                var inp = fila.querySelector('input[data-tipo="OKNO"]');
                var b = fila.querySelectorAll('.exini-okno-btns button');
                var v = inp.value.trim();
                var ok = exIniOkNoEsOk(fila, v);
                var pide = fila.classList.contains('pide-hallazgo');
                var alterno = (fila.getAttribute('data-alterno') || '').toUpperCase();
                b[0].classList.toggle('activo-ok', ok);
                // NO solo cuando consta: se eligio en esta captura (pide) o empieza con la otra opcion
                // ("PRESENTES ..."). Un texto viejo del PHP ("Simetricos") no se marca ni OK ni NO.
                b[1].classList.toggle('activo-hallazgo', !ok && (pide || (alterno !== '' && v.toUpperCase().indexOf(alterno) === 0)));
                // NO sin escribir el hallazgo: se marca en rojo (vacio no se guarda como normal)
                inp.classList.toggle('is-invalid', pide && v === '');
            }

            window.exIniOkNo = function (btn, ok) {
                var fila = btn.closest('.exini-okno');
                var inp = fila.querySelector('input[data-tipo="OKNO"]');
                var normal = fila.getAttribute('data-normal') || '';
                var alterno = fila.getAttribute('data-alterno') || '';
                var esOk = exIniOkNoEsOk(fila, inp.value);
                // NO activo = lo que se ve en el boton (un texto viejo sin marca no cuenta: no se borra)
                var esNo = fila.querySelectorAll('.exini-okno-btns button')[1].classList.contains('activo-hallazgo');
                fila.classList.remove('pide-hallazgo');
                if (ok) {
                    // segundo clic en el activo = sin contestar, como Si/No
                    inp.value = esOk ? '' : normal;
                } else if (esNo) {
                    inp.value = '';
                } else {
                    fila.classList.add('pide-hallazgo');
                    // un texto previo que no es el normal (p.ej. del PHP) se conserva como hallazgo
                    if (esOk || !inp.value.trim()) {
                        inp.value = alterno ? alterno + ' ' : '';
                    }
                    inp.focus();
                    inp.setSelectionRange(inp.value.length, inp.value.length);
                }
                exIniOkNoPintar(fila);
                inp.dispatchEvent(new Event('change', { bubbles: true }));
            };

            window.exIniOkNoEscribe = function (inp) {
                var fila = inp.closest('.exini-okno');
                if (exIniOkNoEsOk(fila, inp.value)) { fila.classList.remove('pide-hallazgo'); }
                else if (inp.value.trim() !== '') { fila.classList.add('pide-hallazgo'); }
                exIniOkNoPintar(fila);
            };

            // Modulo Examen medico (examen-seccion.html, 15-oct-2026, FT-SO-17): "Todo normal" por
            // seccion. okno = OK con el texto del formato; negados = No + "NEGADOS"; sino = No.
            // Solo llena lo vacio: no pisa un hallazgo ni un Si capturado.
            window.exSecTodoNormal = function (btn) {
                var card = btn.closest('.exsec');
                var modo = btn.getAttribute('data-modo');
                if (modo === 'okno') {
                    exIniAplicarNormal(card, 'okno');
                    return;
                }
                card.querySelectorAll('select[name]').forEach(function (sel) {
                    if (sel.value !== '') { return; }
                    sel.value = '0';
                    var obs = sel.parentElement.querySelector('input[type=text]');
                    if (modo === 'negados' && obs && !obs.value.trim()) { obs.value = 'NEGADOS'; }
                });
                if (modo === 'negados') {
                    // los No que ya estaban, sin observacion, tambien llevan NEGADOS (como el formato)
                    card.querySelectorAll('select[name]').forEach(function (sel) {
                        var obs = sel.parentElement.querySelector('input[type=text]');
                        if (sel.value === '0' && obs && !obs.value.trim()) { obs.value = 'NEGADOS'; }
                    });
                }
                exSecPintarSino(card);
            };

            // Si/No con botones (16-oct-2026, examen-seccion.html): el select oculto sigue siendo el
            // valor (lo usan Todo normal, NEGADOS, el resumen de patologicos y el guardado); los
            // botones solo lo cambian y se repintan desde el. Clic en el activo = sin contestar.
            window.exSecSinoBtn = function (btn) {
                var cont = btn.closest('.exsino');
                var sel = cont.querySelector('select');
                var v = btn.getAttribute('data-val');
                sel.value = sel.value === v ? '' : v;
                sel.dispatchEvent(new Event('change', { bubbles: true }));
                exSecPintarSino(cont);
                var obs = cont.querySelector('input[type=text]');
                if (sel.value === '1' && obs) { obs.focus(); }
            };

            window.exSecPintarSino = function (raiz) {
                var conts = raiz.classList && raiz.classList.contains('exsino') ? [raiz] : raiz.querySelectorAll('.exsino');
                Array.prototype.forEach.call(conts, function (c) {
                    var s = c.querySelector('select');
                    var b = c.querySelectorAll('.exsec-sino-btns button');
                    if (!s || b.length < 2) { return; }
                    b[0].classList.toggle('activo-si', s.value === '1');
                    b[1].classList.toggle('activo-no', s.value !== '' && s.value !== '1');
                });
                // odontograma (Dientes): se colorea desde el texto de cada DIENTE_nn al mostrarse
                if (raiz.querySelectorAll) { raiz.querySelectorAll('.exini-odonto .diente').forEach(exIniPintarDiente); }
            };

            // "NEGADOS" solo acompana al No: con Si se borra para escribir el antecedente
            window.exSecSino = function (sel) {
                var obs = sel.parentElement.querySelector('input[type=text]');
                if (!obs) { return; }
                // "NEGADOS" y el "Interrogado/Negado" que escribia el PHP
                if (sel.value === '1' && /NEGAD/i.test(obs.value)) {
                    obs.value = '';
                    obs.focus();
                } else if (sel.value === '1') {
                    obs.focus();
                }
            };

            // Agencia (FT-SO-04 rev. 05) cuando la base no la trae: predeterminado del formato u
            // "Otro" especificando. El valor que se guarda vive en el hidden agenciaExamen.
            window.exIniAgencia = function (el, modo) {
                var box = el.closest('.exini-agencia');
                var hid = box.querySelector('input[name="agenciaExamen"]');
                var txt = box.querySelector('input[type=text]');
                var botones = box.querySelectorAll('.exini-chips button');
                if (modo === 'pre') {
                    txt.hidden = true;
                    hid.value = box.getAttribute('data-pre');
                } else if (modo === 'otro') {
                    txt.hidden = false;
                    hid.value = txt.value.trim();
                    txt.focus();
                } else {
                    hid.value = txt.value.trim();
                }
                botones[0].classList.toggle('activo', txt.hidden);
                botones[1].classList.toggle('activo', !txt.hidden);
                txt.classList.toggle('is-invalid', !txt.hidden && !txt.value.trim());
                hid.dispatchEvent(new Event('change', { bubbles: true }));
            };

            // Odontograma: pincel (hallazgo elegido) + clic por diente. El estado vive en el
            // hidden del diente (C/A/E/P/X o vacio = sano); clic con el mismo hallazgo lo quita.
            var exIniPincelEstado = '';

            window.exIniPincelSel = function (btn) {
                exIniPincelEstado = btn.getAttribute('data-estado') || '';
                btn.closest('.exini-pincel').querySelectorAll('button').forEach(function (b) {
                    b.classList.toggle('activo', b === btn);
                });
            };

            // Diente por caras (FT-SO-04 rev. 05). Texto en la columna DIENTE_nn:
            //   "X" / "P" (o "C"/"A"/"E" del sistema anterior) = diente completo;
            //   "C:O,M A:D" = hallazgo por caras (O oclusal, V vestibular, L lingual/palatino, M mesial, D distal);
            //   cualquier otra palabra = nota vieja, se conserva al final tal cual.
            var EXINI_CARAS = ['O', 'V', 'L', 'M', 'D'];
            var EXINI_NOMBRE = { C: 'caries', A: 'amalgama', E: 'endodoncia', P: 'prótesis', X: 'ausente',
                O: 'oclusal', V: 'vestibular', L: 'lingual/palatino', M: 'mesial', D: 'distal' };

            function exIniLeerDiente(valor) {
                var d = { completo: '', caras: {}, extra: [] };
                (valor || '').trim().split(/\s+/).forEach(function (t) {
                    if (!t) { return; }
                    var m = /^([CAE]):([OVLMD](?:,[OVLMD])*)$/i.exec(t);
                    if (m) {
                        m[2].toUpperCase().split(',').forEach(function (c) { d.caras[c] = m[1].toUpperCase(); });
                    } else if (/^[CAEPX]$/i.test(t)) {
                        d.completo = t.toUpperCase();
                    } else {
                        d.extra.push(t);
                    }
                });
                return d;
            }

            function exIniEscribirDiente(d) {
                var partes = d.completo ? [d.completo] : [];
                ['C', 'A', 'E'].forEach(function (h) {
                    var cs = EXINI_CARAS.filter(function (c) { return d.caras[c] === h; });
                    if (cs.length) { partes.push(h + ':' + cs.join(',')); }
                });
                return partes.concat(d.extra).join(' ');
            }

            window.exIniPintarDiente = function (div) {
                var hidden = div.querySelector('input[type=hidden]');
                var d = exIniLeerDiente(hidden.value);
                // C/A/E del sistema anterior (diente completo): se pintan en las 5 caras
                var todo = /^[CAE]$/.test(d.completo) ? d.completo : '';
                div.querySelectorAll('.cara').forEach(function (p) {
                    var h = todo || d.caras[p.getAttribute('data-cara')] || '';
                    p.classList.remove('f-C', 'f-A', 'f-E');
                    if (h) { p.classList.add('f-' + h); }
                });
                div.classList.toggle('d-P', d.completo === 'P');
                div.classList.toggle('d-X', d.completo === 'X');
                div.classList.toggle('d-otro', d.extra.length > 0);
                div.querySelector('.est').textContent = d.completo === 'P' || d.completo === 'X' ? d.completo : (d.extra.length ? '·' : '');
                var desc = [];
                if (d.completo) { desc.push(EXINI_NOMBRE[d.completo] + (todo ? ' (diente completo)' : '')); }
                ['C', 'A', 'E'].forEach(function (h) {
                    var cs = EXINI_CARAS.filter(function (c) { return d.caras[c] === h; });
                    if (cs.length) { desc.push(EXINI_NOMBRE[h] + ': ' + cs.map(function (c) { return EXINI_NOMBRE[c]; }).join(', ')); }
                });
                if (d.extra.length) { desc.push('nota anterior: ' + d.extra.join(' ')); }
                div.title = 'Diente ' + div.getAttribute('data-diente') + ': ' + (desc.length ? desc.join('; ') : 'sano');
            };

            window.exIniDiente = function (div, ev) {
                var hidden = div.querySelector('input[type=hidden]');
                var d = exIniLeerDiente(hidden.value);
                var caraEl = ev && ev.target && ev.target.closest ? ev.target.closest('.cara') : null;
                var cara = caraEl ? caraEl.getAttribute('data-cara') : '';
                var p = exIniPincelEstado;
                if (p === 'P' || p === 'X') {
                    // diente completo: segundo clic lo quita; al marcarlo se borran las caras
                    d.completo = d.completo === p ? '' : p;
                    if (d.completo) { d.caras = {}; }
                } else if (p) {
                    if (!cara) { return; }   // C/A/E van por cara
                    if (d.completo === 'P' || d.completo === 'X') { d.completo = ''; }
                    if (/^[CAE]$/.test(d.completo)) {
                        // diente completo del sistema anterior: pasa a sus 5 caras para poder editar una
                        EXINI_CARAS.forEach(function (c) { d.caras[c] = d.completo; });
                        d.completo = '';
                    }
                    d.caras[cara] = d.caras[cara] === p ? undefined : p;
                } else {
                    // Sano: en una cara la limpia; fuera de las caras limpia el diente (las notas viejas se quedan)
                    if (/^[CAE]$/.test(d.completo) && cara) {
                        EXINI_CARAS.forEach(function (c) { d.caras[c] = d.completo; });
                    }
                    d.completo = '';
                    if (cara) { d.caras[cara] = undefined; } else { d.caras = {}; }
                }
                hidden.value = exIniEscribirDiente(d);
                exIniPintarDiente(div);
                hidden.dispatchEvent(new Event('change', { bubbles: true }));
            };

            // IMC = peso / talla^2, calculado al escribir peso o talla (talla en m; si capturan
            // cm, >3, se convierte). Se puede corregir a mano despues.
            window.exIniImc = function (inp) {
                var cont = inp.closest('.exini-vitales');
                if (!cont) {
                    return;
                }
                var peso = parseFloat((cont.querySelector('input[name$=".PESO"]') || {}).value);
                var talla = parseFloat((cont.querySelector('input[name$=".TALLA"]') || {}).value);
                var imc = cont.querySelector('input[name$=".IMC"]');
                if (!imc || !(peso > 0) || !(talla > 0)) {
                    return;
                }
                if (talla > 3) { talla = talla / 100; }
                imc.value = (peso / (talla * talla)).toFixed(1);
            };

            window.exIniTecla = function (grupo, e) {
                var k = (e.key || '').toLowerCase();
                var botones = grupo.querySelectorAll('button');
                if (k === 's' || k === '1') { e.preventDefault(); exIniSino(botones[0], '1'); }
                else if (k === 'n' || k === '0') { e.preventDefault(); exIniSino(botones[1], '0'); }
                else if (k === 'enter') {
                    // Enter: siguiente grupo Si/No de la misma hoja (Tab ya lo hace solo)
                    e.preventDefault();
                    var todos = Array.prototype.slice.call(grupo.closest('section').querySelectorAll('.exini-sino'));
                    var i = todos.indexOf(grupo);
                    if (i >= 0 && i + 1 < todos.length) { todos[i + 1].focus(); }
                }
            };

            // "Todo normal" como switch en la banda de cada bloque. ENCENDER aplica lo normal al
            // bloque completo (sino: todo No y observaciones en blanco; texto: todo "Normal";
            // exploracion: Si/serenidad/normal solo en lo sin contestar, sin tocar signos
            // vitales). APAGAR limpia el bloque (sin contestar / vacio). Tras cualquier cambio
            // el switch se recalcula para reflejar si el bloque sigue "todo normal" o no.
            function exIniAplicarNormal(bloque, modo) {
                var cambiados = 0;
                if (modo === 'si') {
                    // sub-grupos de exploracion general (actitud, orientacion, lenguaje): lo normal es Si
                    bloque.querySelectorAll('.exini-sino').forEach(function (g) {
                        var hidden = g.querySelector('input[type=hidden]');
                        var si = exIniValoresSino(g).si;
                        if (hidden.value !== si) { hidden.value = si; exIniPintarSino(g); cambiados++; }
                    });
                } else if (modo === 'sino' || modo === 'negados') {
                    // negados (heredofamiliares): el FT-SO-04 trae "NEGADOS" como observacion predeterminada
                    var obsNormal = modo === 'negados' ? 'NEGADOS' : '';
                    bloque.querySelectorAll('.exini-sino').forEach(function (g) {
                        var hidden = g.querySelector('input[type=hidden]');
                        var fila = g.closest('.exini-fila');
                        var obs = fila ? fila.querySelector('input[type=text]') : null;
                        if (obs && obs.value !== obsNormal) { obs.value = obsNormal; cambiados++; }
                        var no = exIniValoresSino(g).no;
                        if (hidden.value !== no) { hidden.value = no; exIniPintarSino(g); cambiados++; }
                    });
                } else if (modo === 'okno') {
                    // solo lo vacio: un NO con hallazgo escrito no se pisa
                    bloque.querySelectorAll('.exini-okno').forEach(function (fila) {
                        var inp = fila.querySelector('input[data-tipo="OKNO"]');
                        if (inp.value.trim() === '') {
                            fila.classList.remove('pide-hallazgo');
                            inp.value = fila.getAttribute('data-normal');
                            exIniOkNoPintar(fila);
                            cambiados++;
                        }
                    });
                    bloque.querySelectorAll('.exini-chips[data-normal]').forEach(function (g) {
                        if (g.querySelector('input[type=hidden]').value) { return; }
                        var pref = g.querySelector('button[data-val="' + g.getAttribute('data-normal') + '"]');
                        if (pref) { exIniChip(pref); cambiados++; }
                    });
                } else if (modo === 'exploracion') {
                    bloque.querySelectorAll('.exini-sino').forEach(function (g) {
                        var hidden = g.querySelector('input[type=hidden]');
                        if (!hidden.value) { hidden.value = exIniValoresSino(g).si; exIniPintarSino(g); cambiados++; }
                    });
                    bloque.querySelectorAll('.exini-chips').forEach(function (g) {
                        var hidden = g.querySelector('input[type=hidden]');
                        if (hidden.value) { return; }
                        var pref = g.querySelector('button[data-val="normal"], button[data-val="serenidad"]');
                        if (pref) { exIniChip(pref); cambiados++; }
                    });
                } else {
                    bloque.querySelectorAll('input[data-tipo="TEXT"]').forEach(function (inp) {
                        if (inp.value.trim() !== 'Normal') { inp.value = 'Normal'; cambiados++; }
                    });
                }
                return cambiados;
            }

            function exIniLimpiarBloque(bloque, modo) {
                bloque.querySelectorAll('.exini-sino').forEach(function (g) {
                    var hidden = g.querySelector('input[type=hidden]');
                    hidden.value = '';
                    exIniPintarSino(g);
                    var fila = g.closest('.exini-fila');
                    var obs = fila ? fila.querySelector('input[type=text]') : null;
                    if (obs) { obs.value = ''; }
                });
                if (modo === 'exploracion') {
                    bloque.querySelectorAll('.exini-chips').forEach(function (g) {
                        g.querySelector('input[type=hidden]').value = '';
                        g.querySelectorAll('button').forEach(function (b) { b.classList.remove('activo'); });
                    });
                } else if (modo === 'texto') {
                    bloque.querySelectorAll('input[data-tipo="TEXT"]').forEach(function (inp) { inp.value = ''; });
                } else if (modo === 'okno') {
                    bloque.querySelectorAll('.exini-okno').forEach(function (fila) {
                        fila.classList.remove('pide-hallazgo');
                        fila.querySelector('input[data-tipo="OKNO"]').value = '';
                        exIniOkNoPintar(fila);
                    });
                    bloque.querySelectorAll('.exini-chips[data-normal]').forEach(function (g) {
                        g.querySelector('input[type=hidden]').value = '';
                        g.querySelectorAll('button').forEach(function (b) { b.classList.remove('activo'); });
                    });
                }
            }

            // true si el bloque esta "todo normal" segun su modo
            function exIniEsNormal(bloque, modo) {
                var ok = true;
                if (modo === 'si') {
                    bloque.querySelectorAll('.exini-sino').forEach(function (g) {
                        if (g.querySelector('input[type=hidden]').value !== exIniValoresSino(g).si) { ok = false; }
                    });
                } else if (modo === 'sino' || modo === 'negados') {
                    bloque.querySelectorAll('.exini-sino').forEach(function (g) {
                        if (g.querySelector('input[type=hidden]').value !== exIniValoresSino(g).no) { ok = false; }
                        var fila = g.closest('.exini-fila');
                        var obs = fila ? fila.querySelector('input[type=text]') : null;
                        if (modo === 'negados' && obs && obs.value.trim().toUpperCase() !== 'NEGADOS') { ok = false; }
                    });
                } else if (modo === 'okno') {
                    bloque.querySelectorAll('.exini-okno').forEach(function (fila) {
                        if (!exIniOkNoEsOk(fila, fila.querySelector('input[data-tipo="OKNO"]').value)) { ok = false; }
                    });
                    bloque.querySelectorAll('.exini-chips[data-normal]').forEach(function (g) {
                        if (g.querySelector('input[type=hidden]').value.toUpperCase() !== g.getAttribute('data-normal').toUpperCase()) { ok = false; }
                    });
                } else if (modo === 'exploracion') {
                    bloque.querySelectorAll('.exini-sino').forEach(function (g) {
                        if (g.querySelector('input[type=hidden]').value !== exIniValoresSino(g).si) { ok = false; }
                    });
                    bloque.querySelectorAll('.exini-chips').forEach(function (g) {
                        var v = g.querySelector('input[type=hidden]').value;
                        var tieneNormal = !!g.querySelector('button[data-val="normal"], button[data-val="serenidad"]');
                        if (tieneNormal && v !== 'normal' && v !== 'serenidad') { ok = false; }
                    });
                } else {
                    bloque.querySelectorAll('input[data-tipo="TEXT"]').forEach(function (inp) {
                        if (inp.value.trim() !== 'Normal') { ok = false; }
                    });
                }
                return ok;
            }

            window.exIniRefrescarSwitches = function () {
                var root = exIniRoot();
                if (!root) { return; }
                root.querySelectorAll('.exini-switch input[type=checkbox]').forEach(function (sw) {
                    var bloque = sw.closest('.exini-grupo') || sw.closest('.exini-bloque');
                    if (bloque) { sw.checked = exIniEsNormal(bloque, sw.getAttribute('data-modo')); }
                });
            };

            window.exIniSwitchNormal = function (sw) {
                // un switch dentro de un sub-grupo (Actitud, Orientacion, Lenguaje) solo manda ahi
                var bloque = sw.closest('.exini-grupo') || sw.closest('.exini-bloque');
                if (!bloque) { return; }
                var modo = sw.getAttribute('data-modo');
                if (sw.checked) {
                    exIniAplicarNormal(bloque, modo);
                } else {
                    exIniLimpiarBloque(bloque, modo);
                }
                exIniProgramarAutosave();
                // el estado real lo dice exIniEsNormal (en exploracion puede quedar incompleto), y
                // el switch del bloque padre / de los sub-grupos se recalcula a la vez
                exIniRefrescarSwitches();
            };

            // "Tomar examen": la solicitud OCR estaba asignada a otro usuario; se reasigna al de
            // la sesion y se recarga el shell para que desaparezca el aviso y Finalizar funcione.
            window.exIniTomar = async function (btn) {
                var id = btn.getAttribute('data-id');
                if (!window.confirm('¿Tomar este examen? Quien lo tenía asignado dejará de poder finalizarlo.')) {
                    return;
                }
                btn.disabled = true;
                try {
                    var h = {};
                    var t = document.querySelector('meta[name="_csrf"]');
                    var n = document.querySelector('meta[name="_csrf_header"]');
                    if (t && n) { h[n.content] = t.content; }
                    var r = await fetch(contextPath + 'api/examen-inicial/bandeja/' + id + '/tomar', { method: 'POST', headers: h });
                    if (!r.ok) { throw new Error(await r.text()); }
                    loadModuleView('api/nss/examen-inicial', exIniRoot().getAttribute('data-nss'));
                } catch (err) {
                    btn.disabled = false;
                    window.alert('No se pudo tomar el examen: ' + (err && err.message ? err.message : err));
                }
            };

            // Finalizar: manda el formulario COMPLETO (las 10 hojas, no solo la activa) para que
            // nada quede fuera del borrador, y el servidor reparte al WS + tags. Con firma, se
            // abre el expediente impreso (mismo mecanismo que guardarExamen, via guardarRegistro).
            window.exIniFinalizar = function (btn) {
                var diag = document.getElementById('examenDiagnostico');
                var dictamen = document.querySelector('#exIniForm [name="SERV_MED_RESULTADO_EXAMEN.DICTAMEN"]');
                var resultEl = document.getElementById('exIniResult');
                if (dictamen && !dictamen.value) {
                    pintarResultadoInline(resultEl, 'Selecciona el resultado del examen antes de finalizar.', true);
                    // el dictamen es un hidden con botones al lado: llevar la vista ahi
                    var grupoDictamen = dictamen.closest('.exini-dictamen');
                    (grupoDictamen || dictamen).scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
                if (diag && !diag.value.trim()) {
                    pintarResultadoInline(resultEl, 'Captura el diagnóstico actual (buscador ICD o escrito) antes de finalizar.', true);
                    var buscador = document.getElementById('examenIcdConsult');
                    if (buscador) { buscador.focus(); }
                    return;
                }
                // Antecedente en Si sin observacion (heredofamiliares, patologicos): solo AVISO. El
                // FT-SO-04 no la hace obligatoria (decision 15-oct-2026); el medico decide si sigue.
                // Si no sigue, se lleva al primer renglon pendiente.
                var pendientes = [];
                document.querySelectorAll('#exIniForm section[data-hoja="3"] .exini-sino, #exIniForm section[data-hoja="5"] .exini-sino').forEach(function (g) {
                    var fila = g.closest('.exini-fila');
                    var obs = fila ? fila.querySelector('input[type=text]') : null;
                    var esSi = g.querySelector('input[type=hidden]').value === exIniValoresSino(g).si;
                    if (obs) { obs.classList.toggle('is-invalid', esSi && !obs.value.trim()); }
                    if (obs && esSi && !obs.value.trim()) { pendientes.push(fila); }
                });
                var nombres = pendientes.map(function (f) { return f.querySelector('.lbl').textContent.trim(); });
                if (pendientes.length && !window.confirm('Hay ' + pendientes.length + ' antecedente(s) en Sí sin observación:\n\n'
                        + nombres.join(', ') + '\n\n¿Finalizar de todos modos?\n(Cancelar te lleva a escribirlas.)')) {
                    pintarResultadoInline(resultEl, 'Antecedentes en Sí sin observación (' + pendientes.length + '): ' + nombres.join(', ') + '.', true);
                    var hojaSec = pendientes[0].closest('section.exini-hoja');
                    var irBtn = hojaSec ? document.querySelector('#exIniStepper button[data-ir="' + hojaSec.getAttribute('data-hoja') + '"]') : null;
                    if (irBtn) { irBtn.click(); }
                    setTimeout(function () { pendientes[0].querySelector('input[type=text]').focus(); }, 300);
                    return;
                }
                // Confirmacion segun el dictamen: que queda registrado y que sigue
                var etiquetas = { apto: 'APTO', no_apto: 'NO APTO', apto_condicionado: 'APTO CONDICIONADO', apto_restringido: 'APTO RESTRINGIDO' };
                var msg = '¿Finalizar el examen inicial con dictamen ' + (etiquetas[dictamen.value] || dictamen.value) + '?\n\n';
                if (dictamen.value === 'no_apto') {
                    msg += 'La persona quedará registrada como NO APTA para ingreso. Para cambiarlo habrá que aplicarle un nuevo examen inicial.';
                } else if (dictamen.value === 'apto_condicionado') {
                    msg += 'Quedará registrada como apta con condición. Recuerda dejar la condición en Carta compromiso / Restricciones médicas.';
                } else if (dictamen.value === 'apto_restringido') {
                    msg += 'Quedará registrada como apta con restricción. Recuerda capturar la restricción en Restricciones médicas.';
                } else {
                    msg += 'Quedará registrada como apta para ingreso.';
                }
                msg += '\n\nSe guarda como examen de Admisión y se abre el expediente para imprimir.';
                if (exIniRoot().getAttribute('data-tiene-inicial') === 'true') {
                    msg += '\nEsta persona ya tenía un examen inicial: el nuevo lo reemplaza.';
                }
                if (!window.confirm(msg)) {
                    return;
                }
                var nss = exIniRoot().getAttribute('data-nss');
                guardarRegistro(btn, {
                    formId: 'exIniForm',
                    savePath: 'api/nss/examen-inicial/finalizar',
                    fileInputId: '__none__',
                    label: 'examen inicial',
                    resultElId: 'exIniResult',
                    // Mismo criterio que guardarExamen: trazo nuevo, o firma ya almacenada
                    // en el WS junto con el dictamen. El dictamen ya se validó arriba, así
                    // que llegados aquí siempre tiene valor.
                    firmado: function (formEl) {
                        var firmaEl = formEl.querySelector('#firma');
                        if (firmaEl && firmaEl.value) { return true; }

            async function folioYaExiste(formId, listPath) {

                    // El contenido real es mas grande que el placeholder "Cargando..." -

            // Limites del servidor: FileStoreService.MAX_BYTES (por archivo) y
            // spring.servlet.multipart.max-request-size (por subida). Se revisan al elegir para no
            // esperar a que una subida grande falle al final.
            var MAX_ARCHIVO = 25 * 1024 * 1024;
            var MAX_SUBIDA = 50 * 1024 * 1024;

            function problemaDeTamano(files) {
                var total = 0;
                for (var i = 0; i < files.length; i++) {
                    if (files[i].size > MAX_ARCHIVO) {
                        return '"' + files[i].name + '" pesa ' + (files[i].size / 1048576).toFixed(1)
                            + ' MB; el máximo es 25 MB por archivo.';
                    }
                    total += files[i].size;
                }
                return total > MAX_SUBIDA
                    ? 'Los archivos elegidos suman ' + (total / 1048576).toFixed(1) + ' MB; súbelos en partes (máximo 50 MB por subida).'
                    : null;
            }

            window.subirArchivo = async function (btn) {
                var nss = btn.getAttribute('data-nss') || (input.value || '').trim();
                var tipo = btn.getAttribute('data-tipo');
                var resultEl = document.getElementById('archivoSubirResult');
                var fileInput = document.getElementById('archivoFiles');
                if (!fileInput || !fileInput.files || !fileInput.files.length) {
                    pintarResultadoInline(resultEl, 'Selecciona al menos un PDF.', true);
                    return;
                }
                var problema = problemaDeTamano(fileInput.files);
                if (problema) {
                    pintarResultadoInline(resultEl, problema, true);
                    return;
                }
                var fd = new FormData();
                fd.append('nss', nss);
                fd.append('relacion', tipo);
                for (var i = 0; i < fileInput.files.length; i++) {
                    fd.append('file', fileInput.files[i]);
                }
                var headers = {};
                var csrf = form.querySelector('input[type="hidden"][name]');
                if (csrf) {
                    headers['X-CSRF-TOKEN'] = csrf.value;
                }
                var originalHtml = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> Subiendo...';
                pintarResultadoInline(resultEl, 'Subiendo...', false);
                try {
                    var response = await fetch(contextPath + 'api/nss/consulta/file', {
                        method: 'POST', headers: headers, body: fd
                    });
                    var txt = await response.text();
                    pintarResultadoInline(resultEl, response.ok ? txt : ('Error al subir (HTTP ' + response.status + ').'), !response.ok);
                    if (response.ok) {
                        await loadArchivos(nss, tipo);
                        // loadArchivos reemplaza toda la tarjeta (incluido #archivoSubirResult) -
                        // repintar el mensaje en el span nuevo para que no desaparezca de golpe.
                        pintarResultadoInline(document.getElementById('archivoSubirResult'), txt, false);
                    }
                } catch (error) {
                    pintarResultadoInline(document.getElementById('archivoSubirResult'), 'Error de red al subir.', true);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                }
            };

            // boton-toggle, cambiar de tab ya no borra lo que no hayas guardado.
            //
            // El badge del grupo cuenta las secciones marcadas con la palomita (data-checked),
            // NO las simplemente visitadas/cargadas - es una marca deliberada del usuario
            // ("ya revise/conteste esto"), a diferencia de solo abrir el tab. Se prefirio asi
            // porque el WS no da una senal confiable de "tiene datos reales" (ver conversacion
            // 2026-08-26: PR_SERVICIO_MED_CONSULTA rellena todo con defaults tipo "sin
            // observaciones"/0 aunque la seccion nunca se haya contestado) - la unica fuente
            // de verdad que queda es que el usuario mismo la marque.
            function actualizarBadgeGrupoExamen(grupo) {
                if (!grupo) {
                    return;
                }
                var badge = grupo.querySelector('.examen-grupo-badge');
                if (!badge) {
                    return;
                }
                var total = grupo.querySelectorAll('.examen-tabs .nav-link[data-checked="true"]').length;
                if (total > 0) {

            // Palomita manual en cada tab: clic marca/desmarca en verde y ajusta el contador
            // del grupo. stopPropagation evita que el clic tambien dispare el cambio de tab
            // (data-bs-toggle="tab" esta en el boton padre, no en el icono).
            window.toggleTabCheck = function (icon, event) {
                event.stopPropagation();
                var tab = icon.closest('.nav-link');
                var marcar = tab.getAttribute('data-checked') !== 'true';
                tab.setAttribute('data-checked', marcar ? 'true' : 'false');
                icon.classList.toggle('ri-checkbox-blank-circle-line', !marcar);
                icon.classList.toggle('ri-checkbox-circle-fill', marcar);
                icon.classList.toggle('examen-tab-check--on', marcar);
                actualizarBadgeGrupoExamen(tab.closest('.examen-grupo'));
            };
