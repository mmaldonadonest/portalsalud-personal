<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/app :: layout(~{::title}, ~{:: nssContent}, ~{::th:block[@id='pageScripts']}, ~{::th:block[@id='pageStyles']})}">
<head>
    <title>Búsqueda NSS | Portal Salud Personal</title>
</head>
<body>

<th:block id="pageStyles">
    <style>
        /* Item de modulo activo en el submenu lateral: reusa el azul primario del tema. */
        #nssModulesSub .nav-sub-link.active {
            background-color: rgba(80, 111, 217, 0.12);
            color: #506fd9;
            font-weight: 600;
            border-radius: 4px;
        }
        #nssModulesSub .nav-sub-link.active::before {
            background-color: #506fd9;
        }
    </style>
</th:block>

<th:block th:fragment="nssContent">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div>
            <ol class="breadcrumb fs-sm mb-1">
                <li class="breadcrumb-item"><a th:href="@{/home}" href="/home">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Busqueda NSS</li>
            </ol>
            <h4 class="main-title mb-0">Busqueda por NSS</h4>
        </div>
    </div>

    <div class="card card-one">
        <div class="card-header">
            <h6 class="card-title mb-0">Consulta de derechohabiente</h6>
        </div>
        <div class="card-body">
            <form id="nssSearchForm" class="row g-2 align-items-end" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="col-md-8">
                    <label class="form-label" for="nssInput">NSS</label>
                    <div class="position-relative">
                        <input id="nssInput" name="nss" type="text" class="form-control pe-5"
                               placeholder="Ej. 30048315698" th:value="${nssQuery}" required>
                        <!-- Limpiar: solo se ve con texto; deja la pantalla lista para otra busqueda -->
                        <button id="nssClear" type="button" class="btn-close position-absolute top-50 end-0 translate-middle-y me-3"
                                style="font-size: .7rem; display: none;" aria-label="Limpiar" title="Limpiar"></button>
                    </div>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary" type="submit">Buscar</button>
                </div>
            </form>

            <div id="nssSearchStatus" class="mt-3 text-muted fs-sm">Ingresa un NSS para consultar.</div>

            <div id="nssSearchResult" class="mt-3" style="display: none;"></div>
        </div>
    </div>

    <!-- Area donde se cargan las vistas de los modulos (expediente, etc.) -->
    <div id="moduleContent" class="mt-3"></div>

    <!-- Modal de detalle de consulta (U04) -->
    <div class="modal fade" id="consultaModal" tabindex="-1" aria-labelledby="consultaModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title mb-0" id="consultaModalTitle">Detalle de consulta</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="consultaModalBody"></div>
            </div>
        </div>
    </div>
</th:block>

<th:block id="pageScripts">
    <script>
        (function () {
            var form = document.getElementById('nssSearchForm');
            var status = document.getElementById('nssSearchStatus');
            var result = document.getElementById('nssSearchResult');
            var input = document.getElementById('nssInput');

            if (!form || !status || !result || !input) {
                return;
            }

            // Boton "x" del campo NSS: vacia el campo y lo que dejo la busqueda anterior (ficha,
            // modulos del menu lateral y el modulo abierto), para no confundir a quien busca a otra
            // persona con los datos de la anterior todavia en pantalla.
            var limpiar = document.getElementById('nssClear');
            function mostrarLimpiar() {
                if (limpiar) { limpiar.style.display = input.value ? '' : 'none'; }
            }
            if (limpiar) {
                input.addEventListener('input', mostrarLimpiar);
                limpiar.addEventListener('click', function () {
                    input.value = '';
                    mostrarLimpiar();
                    status.textContent = 'Ingresa un NSS para consultar.';
                    result.innerHTML = '';
                    result.style.display = 'none';
                    resetSidebarModules();
                    var mc = document.getElementById('moduleContent');
                    if (mc) { mc.innerHTML = ''; }
                    input.focus();
                });
                mostrarLimpiar();   // si la pagina llego con ?nss=..., ya hay texto
            }

            // Sesion/CSRF expirada: cualquier POST AJAX que devuelva 401/403 (tipico
            // tras dejar la pagina abierta mas que el timeout de sesion) redirige al
            // login en vez de mostrar un "Error 403" confuso. Se envuelve fetch una vez.
            var _portalFetch = window.fetch.bind(window);
            window.fetch = function (input, init) {
                return _portalFetch(input, init).then(function (resp) {
                    if (resp.status === 401 || resp.status === 403) {
                        window.location.href = contextPath + 'login?expired';
                        // Promesa que nunca resuelve: frena el manejo posterior al navegar.
                        return new Promise(function () {});
                    }
                    return resp;
                });
            };

            async function doSearch() {
                var nss = (input.value || '').trim();

                if (!nss) {
                    status.textContent = 'El NSS es obligatorio.';
                    result.style.display = 'none';
                    return;
                }

                status.textContent = 'Consultando...';
                result.style.display = 'none';

                try {
                    // Contrato equivalente a rest/dashboard/searchEmploye.php:
                    // XHR POST form-urlencoded con el parametro 'data' (el NSS), respuesta HTML.
                    var body = new URLSearchParams();
                    body.append('data', nss);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }

                    var response = await fetch(contextPath + 'api/nss/search', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'text/html'
                        },
                        body: body.toString()
                    });

                    if (!response.ok) {
                        status.textContent = 'Error al consultar. Código HTTP: ' + response.status;
                        result.style.display = 'none';
                        return;
                    }

                    var html = await response.text();
                    status.textContent = 'Consulta realizada.';
                    result.innerHTML = html;
                    result.style.display = 'block';

                    // Reiniciamos el menu lateral de modulos y el area de contenido; si es
                    // empleado (el fragmento incluye #nssEmpleadoMarker), cargamos los modulos.
                    resetSidebarModules();
                    var mc = document.getElementById('moduleContent');
                    if (mc) { mc.innerHTML = ''; }
                    if (document.getElementById('nssEmpleadoMarker')) {
                        loadSidebarModules(nss);
                        // ?abrir=examen-inicial (enlace de la campanita / solicitud OCR): abrir el
                        // modulo directo, una sola vez por carga de pagina.
                        var abrir = new URLSearchParams(window.location.search).get('abrir');
                        if (abrir === 'examen-inicial' && !window.__nssAbrirHecho) {
                            window.__nssAbrirHecho = true;
                            loadModuleView('api/nss/examen-inicial', nss);
                        }
                    }
                } catch (error) {
                    status.textContent = 'Error de red al consultar: ' + error;
                    result.style.display = 'none';
                }
            }

            function resetSidebarModules() {
                var group = document.getElementById('nssModulesGroup');
                var sub = document.getElementById('nssModulesSub');
                if (sub) { sub.innerHTML = ''; }
                if (group) { group.style.display = 'none'; }
            }

            // Carga los modulos permitidos (validateModules) como submenu lateral.
            async function loadSidebarModules(nss) {
                var group = document.getElementById('nssModulesGroup');
                var sub = document.getElementById('nssModulesSub');
                if (!group || !sub) {
                    return;
                }
                try {
                    var body = new URLSearchParams();
                    body.append('data', nss);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }

                    var response = await fetch(contextPath + 'api/nss/modules', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'text/html'
                        },
                        body: body.toString()
                    });

                    if (response.ok) {
                        sub.innerHTML = await response.text();
                        // Solo mostramos el grupo si hay al menos un modulo permitido.
                        if (sub.querySelector('a')) {
                            group.style.display = '';
                        } else {
                            // El WS respondio bien pero sin modulos: el usuario logueado
                            // no tiene rol/menus en el ORDS (consulta_app_rol_usuario) para app 13.
                            status.textContent = 'Ficha cargada, pero el usuario logueado no tiene módulos'
                                + ' asignados en el ORDS (validateModules). Revisa el rol del usuario.';
                        }
                    } else {
                        status.textContent = 'Ficha cargada, pero no se pudieron cargar los módulos'
                            + ' del menú (HTTP ' + response.status + ').';
                    }
                } catch (error) {
                    // Los modulos son complementarios: si fallan, no rompemos la ficha.
                    status.textContent = 'Ficha cargada, pero falló la carga de módulos del menú: ' + error;
                }
            }

            // Carga la vista de un modulo (POST form-urlencoded con el NSS) en #moduleContent.
            async function loadModuleView(path, nss) {
                var mc = document.getElementById('moduleContent');
                if (!mc) {
                    return;
                }
                mc.innerHTML = '<div class="text-muted fs-sm">Cargando...</div>';
                mc.scrollIntoView({ behavior: 'smooth', block: 'start' });
                try {
                    var body = new URLSearchParams();
                    body.append('data', nss);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }
                    var response = await fetch(contextPath + path, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'text/html'
                        },
                        body: body.toString()
                    });
                    if (response.ok) {
                        mc.innerHTML = await response.text();
                        // Reenfocar tras cargar: el scrollIntoView de arriba se hizo con el
                        // placeholder "Cargando..." (una linea) - una vez que el contenido real
                        // crece (o la pagina se acomoda distinto), ese scroll queda desalineado.
                        mc.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        // Si el modulo trae el canvas de firma, inicializar el signature pad.
                        if (document.getElementById('firmaCanvas')) {
                            initSignaturePad();
                        }
                        // Examen inicial: autoguardado, stepper y teclado (ver exIniInit).
                        if (document.getElementById('exIni')) {
                            exIniInit();
                        }
                        if (document.getElementById('antidopingCustodia')) {
                            custodiaInit();
                        }
                        if (document.getElementById('paseSalidaWrap')) {
                            togglePaseSalida();
                            toggleFormatosConsulta();
                        }
                    } else {
                        mc.innerHTML = '<div class="alert alert-danger mb-0">Error al cargar el módulo (HTTP ' + response.status + ').</div>';
                    }
                } catch (error) {
                    mc.innerHTML = '<div class="alert alert-danger mb-0">Error de red al cargar el módulo.</div>';
                }
            }

            // Item activo del submenu: azul institucional del tema en el modulo seleccionado.
            function marcarModuloActivo(btn) {
                var sub = document.getElementById('nssModulesSub');
                if (sub) {
                    sub.querySelectorAll('.nav-sub-link.active').forEach(function (el) {
                        el.classList.remove('active');
                    });
                }
                btn.classList.add('active');
            }

            // Handler de los modulos del sidebar. Despacha por data-action; los modulos
            // aun no implementados (sin action) muestran mensaje placeholder.
            window.abrirModulo = function (btn) {
                marcarModuloActivo(btn);
                var action = btn.getAttribute('data-action');
                var nss = btn.getAttribute('data-nss');
                if (action === 'expediente') {
                    loadModuleView('api/nss/expediente', nss);
                    return;
                }
                if (action === 'consulta-form') {
                    loadModuleView('api/nss/consulta/form', nss);
                    return;
                }
                if (action === 'incapacidades') {
                    loadModuleView('api/nss/incapacidades', nss);
                    return;
                }
                if (action === 'incapacidad-form') {
                    loadModuleView('api/nss/incapacidades/form', nss);
                    return;
                }
                if (action === 'archivos') {
                    loadArchivos(nss, btn.getAttribute('data-tipo'));
                    return;
                }
                if (action === 'pretest') {
                    loadModuleView('api/nss/pretest', nss);
                    return;
                }
                if (action === 'examen') {
                    loadModuleView('api/nss/examen', nss);
                    return;
                }
                if (action === 'examen-inicial') {
                    loadModuleView('api/nss/examen-inicial', nss);
                    return;
                }
                if (action === 'antidoping') {
                    loadModuleView('api/nss/antidoping', nss);
                    return;
                }
                if (action === 'accidentes') {
                    loadModuleView('api/nss/accidentes', nss);
                    return;
                }
                if (action === 'maternidad') {
                    loadModuleView('api/nss/maternidad', nss);
                    return;
                }
                var idMenu = btn.getAttribute('data-id-menu');
                status.textContent = 'Módulo "' + btn.textContent.trim() + '" (id ' + idMenu +
                    ', NSS ' + nss + ') disponible en una proxima entrega.';
            };

            // Busqueda ICD: inyecta los resultados bajo el input; addIcd los agrega al textarea
            // destino. Generico (ids por parametro, con default = el form de Consulta Medica)
            // para poder reusarse tambien desde el Diagnostico del Examen Medico sin duplicar
            // fragmento/backend - guarda el id del textarea destino en data-target del contenedor
            // de resultados, asi addIcd() sabe donde agregar la clave sin necesitar mas parametros.
            // todo=true: lista el catalogo completo (el WS con texto vacio regresa todo) para
            // quien no sabe por donde empezar; el autocompletar sigue pidiendo 3 letras.
            window.buscarIcd = async function (inputId, resultId, targetId, todo) {
                inputId = inputId || 'icdConsult';
                resultId = resultId || 'icdResult';
                targetId = targetId || 'diagnostico';
                var input = document.getElementById(inputId);
                var out = document.getElementById(resultId);
                if (!input || !out) {
                    return;
                }
                out.setAttribute('data-target', targetId);
                if (!todo) {
                    resetIcdTodo(out);
                }
                var q = todo ? '' : (input.value || '').trim();
                if (!q && !todo) {
                    out.innerHTML = '';
                    return;
                }
                out.innerHTML = '<div class="text-muted fs-sm">Buscando...</div>';
                try {
                    var body = new URLSearchParams();
                    body.append('icd', q);
                    var csrf = form.querySelector('input[type="hidden"][name]');
                    if (csrf && csrf.name) {
                        body.append(csrf.name, csrf.value);
                    }
                    var response = await fetch(contextPath + 'api/nss/icd', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'text/html'
                        },
                        body: body.toString()
                    });
                    if (response.ok) {
                        out.innerHTML = await response.text();
                    } else {
                        out.innerHTML = '';
                    }
                } catch (error) {
                    out.innerHTML = '';
                }
            };

            // Regresa el boton "Ver todo el catalogo" del buscador a su estado inicial cuando la
            // lista completa ya no esta en pantalla (se tecleo otra busqueda o se eligio una clave).
            function resetIcdTodo(out) {
                if (!out) { return; }
                out.dataset.todo = '';
                var btnTodo = document.getElementById(out.id === 'examenIcdResult' ? 'examenIcdTodoBtn' : 'icdConsultTodoBtn');
                if (btnTodo) { btnTodo.innerHTML = '<i class="ri-list-check me-1"></i>Ver todo el catálogo'; }
            }

            // "Ver todo el catalogo" hace toggle: primer clic lista todo, segundo lo oculta.
            window.toggleIcdCatalogo = async function (btn, inputId, resultId, targetId) {
                var out = document.getElementById(resultId);
                if (!out) {
                    return;
                }
                if (out.dataset.todo === '1') {
                    out.innerHTML = '';
                    out.dataset.todo = '';
                    btn.innerHTML = '<i class="ri-list-check me-1"></i>Ver todo el catálogo';
                    return;
                }
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span>Cargando...';
                await buscarIcd(inputId, resultId, targetId, true);
                out.dataset.todo = '1';
                btn.disabled = false;
                btn.innerHTML = '<i class="ri-eye-off-line me-1"></i>Ocultar catálogo';
            };

            // Autocompleta desde 3 letras, con debounce (300ms) para no disparar una peticion
            // por cada tecla. Un timer por inputId (independiente entre los distintos buscadores
            // ICD: Consulta, Diagnostico del Examen, y cada slot de Diagnosticos secundarios).
            var icdDebounceTimers = {};
            window.buscarIcdDebounced = function (inputId, resultId, targetId) {
                inputId = inputId || 'icdConsult';
                resultId = resultId || 'icdResult';
                targetId = targetId || 'diagnostico';
                var input = document.getElementById(inputId);
                var out = document.getElementById(resultId);
                if (!input || !out) {
                    return;
                }
                if (icdDebounceTimers[inputId]) {
                    clearTimeout(icdDebounceTimers[inputId]);
                }
                var q = (input.value || '').trim();
                if (q.length < 3) {
                    out.innerHTML = '';
                    return;
                }
                icdDebounceTimers[inputId] = setTimeout(function () {
                    buscarIcd(inputId, resultId, targetId);
                }, 300);
            };

            window.addIcd = function (btn) {
                var text = btn.getAttribute('data-icd');
                var out = btn.closest('[data-target]');
                var targetId = out ? out.getAttribute('data-target') : 'diagnostico';
                var ta = document.getElementById(targetId);
                if (ta) {
                    // La misma clave no se agrega dos veces (antes cada clic la repetia).
                    var clave = (text.split(' - ')[0] || '').trim();
                    var yaEsta = clave && (' ' + ta.value + ' ').indexOf(' ' + clave + ' ') !== -1;
                    if (!yaEsta) {
                        ta.value = (ta.value ? ta.value + ' ' : '') + text;
                    }
                }
                if (out) {
                    out.innerHTML = '';
                    resetIcdTodo(out);
                }
            };

            // Signature pad en canvas (mouse + touch) -> data URL en el campo oculto #firma.
            window.initSignaturePad = function () {
                var canvas = document.getElementById('firmaCanvas');
                var hidden = document.getElementById('firma');
                if (!canvas || !hidden) {
                    return;
                }
                var ctx = canvas.getContext('2d');
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#000';
                var drawing = false;
                var last = null;

                // Firma ya guardada (examen: data-firma-guardada en el canvas): se pinta como
                // contenido inicial para que el usuario la vea, pero #firma se queda VACIO - si no
                // firma de nuevo, guardar no la pisa. Al primer trazo se borra y se reemplaza.
                var guardada = canvas.dataset.firmaGuardada || '';
                var mostrandoGuardada = false;
                var etiqueta = document.getElementById('firmaEstado');
                function pintarGuardada() {
                    if (!guardada) { return; }
                    var img = new Image();
                    img.onload = function () {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        mostrandoGuardada = true;
                        hidden.value = '';
                        if (etiqueta) { etiqueta.textContent = 'Firma guardada: es la que aparece en el expediente impreso. Para cambiarla, firma encima y guarda.'; }
                    };
                    img.src = guardada;
                }
                pintarGuardada();

                function pos(e) {
                    var r = canvas.getBoundingClientRect();
                    var t = (e.touches && e.touches.length) ? e.touches[0] : e;
                    return { x: t.clientX - r.left, y: t.clientY - r.top };
                }
                function start(e) {
                    if (mostrandoGuardada) {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        mostrandoGuardada = false;
                        if (etiqueta) { etiqueta.textContent = 'Nueva firma: al guardar reemplaza a la anterior y abre el expediente para imprimir.'; }
                    }
                    drawing = true; last = pos(e); e.preventDefault();
                }
                function move(e) {
                    if (!drawing) { return; }
                    var p = pos(e);
                    ctx.beginPath();
                    ctx.moveTo(last.x, last.y);
                    ctx.lineTo(p.x, p.y);
                    ctx.stroke();
                    last = p;
                    hidden.value = canvas.toDataURL('image/png');
                    e.preventDefault();
                }
                function end() { drawing = false; }

                canvas.addEventListener('mousedown', start);
                canvas.addEventListener('mousemove', move);
                window.addEventListener('mouseup', end);
                canvas.addEventListener('touchstart', start, { passive: false });
                canvas.addEventListener('touchmove', move, { passive: false });
                canvas.addEventListener('touchend', end);

                var clearBtn = document.getElementById('firmaClear');
                if (clearBtn) {
                    clearBtn.onclick = function () {
                        // Solo limpia el recuadro para firmar de nuevo. NO borra la firma guardada
                        // en el WS: si se guarda sin trazo nuevo, se conserva la anterior.
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        hidden.value = '';
                        mostrandoGuardada = false;
                        if (etiqueta) {
                            etiqueta.textContent = guardada
                                ? 'Recuadro limpio. Firma y guarda para reemplazar la firma guardada; si guardas sin firmar, se conserva la anterior.'
                                : '';
                        }
                    };
                }
            };

            // Calcula IMC = peso / talla^2 en el formulario de alta de consulta.
            window.calcImc = function () {
                var f = document.getElementById('consultaAltaForm');
                if (!f) {
                    return;
                }
                var peso = parseFloat(f.peso.value);
                var talla = parseFloat(f.talla.value);
                if (peso > 0 && talla > 0) {
                    f.imc.value = (peso / (talla * talla)).toFixed(2);
                }
            };

            // Estilo comun para los mensajes de resultado inline (junto al boton "Guardar")
            // en toda la pantalla de NSS: icono + color semantico Bootstrap (success/danger),
            // en vez de solo texto de color. Un solo lugar para no repetir el mismo className
            // en cada guardarX() - lo usan guardarRegistro() y guardarExamen().
            function pintarResultadoInline(el, texto, esError) {
                if (!el) {
                    return;
                }
                el.className = 'fs-sm d-inline-flex align-items-center gap-1 ' + (esError ? 'text-danger' : 'text-success');
                el.innerHTML = '';
                var icono = document.createElement('i');
                icono.className = esError ? 'ri-error-warning-line' : 'ri-checkbox-circle-line';
                el.appendChild(icono);
                el.appendChild(document.createTextNode(texto));
            }

            // Guardado generico de un alta (consulta / incapacidad / antidoping / accidente) +
            // subida de adjuntos. Bloquea doble-click (guard explicito + disabled), muestra
            // spinner mientras esta en vuelo, y opcionalmente limpia el formulario al exito
            // (opts.resetOnSuccess) u ejecuta un callback (opts.onSuccess) - ej. volver a la
            // lista - sin tocar el comportamiento de las pantallas que no los piden.
            async function guardarRegistro(btn, opts) {
                if (btn.disabled) {
                    return;
                }
                var formEl = document.getElementById(opts.formId);
                if (!formEl) {
                    return;
                }
                var body = new URLSearchParams(new FormData(formEl));
                // Documento firmado -> PDF al momento (mismo patron que guardarExamen): si el
                // registro lleva firma y opts.documentoUrl(formEl) da una URL, la pestana se abre
                // AQUI en el clic (window.open tras un await lo bloquea el navegador) y se navega
                // al documento con ?auto=1 solo si el guardado fue exitoso; si falla, se cierra.
                var firmaEl = formEl.querySelector('#firma');
                // Por omision "firmado" = hay trazo nuevo en el recuadro. Un modulo puede
                // ampliarlo con opts.firmado(formEl): el examen inicial lo hace porque su
                // firma puede venir ya almacenada del WS y el trabajador no vuelve a firmar,
                // y sin eso el expediente no se abria nunca en ese caso.
                var firmado = (typeof opts.firmado === 'function')
                        ? !!opts.firmado(formEl)
                        : !!(firmaEl && firmaEl.value);
                var urlDocumento = (typeof opts.documentoUrl === 'function' && firmado)
                        ? opts.documentoUrl(formEl) : null;
                var ventanaDoc = null;
                // La pestana se abre AQUI, en el clic: abrirla despues del await la bloquea el
                // navegador (probado 3-oct: el guardado del examen inicial tarda mas que la
                // ventana de gracia de Chrome). opts.abrirAlTerminar solo cambia el contenido
                // provisional: una pantalla de carga con el estilo del portal en vez del texto
                // plano, y el documento se carga en cuanto el guardado termina.
                if (urlDocumento) {
                    try {
                        ventanaDoc = window.open('', '_blank');
                        if (ventanaDoc) {
                            ventanaDoc.document.write(opts.abrirAlTerminar
                                ? '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Generando documento</title></head>'
                                  + '<body style="margin:0;font:16px system-ui,sans-serif;background:#F8FAFC;color:#20252B;display:flex;align-items:center;justify-content:center;height:100vh">'
                                  + '<div style="text-align:center"><div style="width:46px;height:46px;border:5px solid #E1E6EB;border-top-color:#0057A8;border-radius:50%;margin:0 auto 18px;animation:g 1s linear infinite"></div>'
                                  + '<div style="font-weight:600;color:#003E75;font-size:18px">Generando el expediente para imprimir…</div>'
                                  + '<div style="margin-top:6px;color:#667085">Esta pestaña se actualiza sola al terminar.</div></div>'
                                  + '<style>@keyframes g{to{transform:rotate(360deg)}}</style></body></html>'
                                : '<p style="font:14px system-ui;padding:24px">Guardando y generando el documento para imprimir…</p>');
                        }
                    } catch (e) { ventanaDoc = null; }
                }
                var csrf = form.querySelector('input[type="hidden"][name]');
                if (csrf && csrf.name) {
                    body.append(csrf.name, csrf.value);
                }
                var originalHtml = btn.innerHTML;
                // Resultado inline (opcional): ademas del status global de arriba (lejos de
                // la vista si el formulario esta mas abajo en la pantalla, ej. Examen), si
                // opts.resultElId apunta a un elemento cercano al boton, se usa para mostrar
                // el mismo mensaje justo ahi, imposible de perder de vista.
                var resultEl = opts.resultElId ? document.getElementById(opts.resultElId) : null;
                function mostrarResultado(texto, esError) {
                    if (resultEl) {
                        pintarResultadoInline(resultEl, texto, esError);
                        status.textContent = '';
                    } else {
                        status.textContent = texto;
                    }
                }
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span> ' + (opts.textoBoton || 'Guardando...');
                mostrarResultado('Guardando ' + opts.label + '...', false);
                try {
                    var response = await fetch(contextPath + opts.savePath, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'Accept': 'text/plain'
                        },
                        body: body.toString()
                    });
                    var txt = await response.text();
                    if (response.ok) {
                        mostrarResultado(txt, false);
                        var fileInput = document.getElementById(opts.fileInputId);
                        if (fileInput && fileInput.files && fileInput.files.length) {
                            mostrarResultado(txt + ' Subiendo adjuntos...', false);
                            var up = await subirAdjuntos(formEl, fileInput.files);
                            mostrarResultado(txt + ' ' + up, false);
                        }
                        if (urlDocumento) {
                            if (ventanaDoc) {
                                ventanaDoc.location.href = urlDocumento;
                            }
                            if (resultEl) {
                                // enlace por si el navegador bloqueo la pestana
                                var a = document.createElement('a');
                                a.href = urlDocumento;
                                a.target = '_blank';
                                a.className = 'ms-2';
                                a.innerHTML = '<i class="ri-printer-line me-1"></i>' + (ventanaDoc ? 'Descargar documento (PDF)' : 'Abrir documento (PDF)');
                                if (!ventanaDoc) { a.className = 'btn btn-sm btn-primary ms-2'; }
                                resultEl.appendChild(a);
                            }
                        }
                        if (opts.resetOnSuccess) {
                            formEl.reset();
                        }
                        if (typeof opts.onSuccess === 'function') {
                            opts.onSuccess();
                        }
                    } else {
                        if (ventanaDoc) { ventanaDoc.close(); }
                        mostrarResultado('Error al registrar (HTTP ' + response.status + '): ' + txt, true);
                    }
                } catch (error) {
                    if (ventanaDoc) { ventanaDoc.close(); }
                    mostrarResultado('Error de red al registrar.', true);

                    btn.disabled = false;
                    btn.innerHTML = originalHtml;

            // form.reset() (opts.resetOnSuccess) no toca el canvas de firma - el trazo

            window.guardarConsulta = function (btn) {

                }
                // Pase de salida FT-SO-02: motivo y hora de salida obligatorios (el servidor lo vuelve a revisar)
                var fc = document.getElementById('consultaAltaForm');
                if (fc && fc.tipoConsulta.value === 'pase_salida') {
                    var faltan = [];
                    if (!fc.paseMotivo.value) { faltan.push(fc.paseMotivo); }
                    if (!fc.paseSalida.value) { faltan.push(fc.paseSalida); }
                    [fc.paseMotivo, fc.paseSalida].forEach(function (el) { el.classList.toggle('is-invalid', faltan.indexOf(el) >= 0); });
                    if (faltan.length) {
                        var res = document.getElementById('consultaGuardarResult');

                        if (res) { res.className = 'fs-sm text-danger'; res.textContent = msj; }

                        return;
                    }
                }
                // FT-SO-29 (casilla) y FT-SO-23 (tipo Pruebas Especiales): su dato principal es obligatorio
                // (el servidor lo vuelve a revisar)
                var esPruebas = fc && fc.tipoConsulta.value === 'pruebas_especiales';
                if (fc) {
                    var falta = null;
                    var primerMed = fc.querySelector('#medFilas input[name="medMedicamento"]');
                    var algunMed = Array.prototype.some.call(fc.querySelectorAll('#medFilas input[name="medMedicamento"]'), function (i) { return i.value.trim(); });
                    if (fc.medGenerar.checked && !algunMed) { falta = [primerMed, 'En el pase de medicamento anota al menos un medicamento.']; }
                    else if (esPruebas && !fc.pruebaAnticuerpos.value.trim()) { falta = [fc.pruebaAnticuerpos, 'En pruebas especiales indica la prueba (anticuerpos contra...).']; }
                    if (falta) {
                        falta[0].classList.add('is-invalid');
                        var resF = document.getElementById('consultaGuardarResult');
                        if (resF) { resF.className = 'fs-sm text-danger'; resF.textContent = falta[1]; }
                        status.textContent = falta[1];
                        falta[0].focus();
                        return;
                    }
                }
                // enlaces de los formatos opcionales, con el rel de ESTA consulta (el formulario se limpia al guardar)
                var nssDoc = encodeURIComponent((input.value || '').trim());
                var relDoc = fc ? encodeURIComponent(fc.idArchivoRel.value) : '';
                var extras = [];
                if (fc && fc.medGenerar.checked) { extras.push(['pase-medicamento', 'Pase de medicamento (FT-SO-29)']); }
                if (esPruebas) { extras.push(['pruebas-especiales', 'Pruebas especiales (FT-SO-23)']); }
                guardarRegistro(btn, {
                    formId: 'consultaAltaForm', savePath: 'api/nss/consulta', fileInputId: 'consultaFiles',
                    label: 'consulta', resultElId: 'consultaGuardarResult',
                    // idArchivoRel nuevo tras guardar: reset() lo deja igual y una segunda consulta en la misma
                    // pantalla compartiria adjuntos y pase con la primera (20-oct-2026)
                    resetOnSuccess: true, onSuccess: function () {
                        limpiarFirmaSiExiste(); nuevoIdRelacion('consultaAltaForm'); togglePaseSalida();
                        var filasMed = document.getElementById('medFilas');
                        if (filasMed) { filasMed.innerHTML = ''; }
                        toggleFormatosConsulta();
                        var resEl = document.getElementById('consultaGuardarResult');
                        extras.forEach(function (x) {
                            var a = document.createElement('a');
                            a.href = contextPath + 'api/nss/consulta/' + x[0] + '?nss=' + nssDoc + '&rel=' + relDoc + '&auto=1';
                            a.target = '_blank';
                            a.className = 'btn btn-sm btn-outline-primary ms-2';
                            a.innerHTML = '<i class="ri-printer-line me-1"></i>' + x[1];
                            if (resEl) { resEl.appendChild(a); }

                    },
                    // el WS no devuelve el ID_CONSULTA: el documento se ubica por idArchivoRel. Un pase de
                    // salida abre el FT-SO-02 (la nota medica sigue en el detalle de la consulta).
                    documentoUrl: function (f) {
                        var rel = f.querySelector('input[name="idArchivoRel"]');
                        var doc = f.tipoConsulta && f.tipoConsulta.value === 'pase_salida' ? 'pase-salida' : 'imprimir';
                        return rel && rel.value ? contextPath + 'api/nss/consulta/' + doc + '?nss=' + encodeURIComponent((input.value || '').trim())
                                + '&rel=' + encodeURIComponent(rel.value) + '&auto=1' : null;
                    }

            // Mismo formato que el UUID sin guiones que genera el servidor para el formulario
            function nuevoIdRelacion(formId) {
                var rel = document.querySelector('#' + formId + ' input[name="idArchivoRel"]');
                if (!rel) { return; }
                var b = new Uint8Array(16);
                window.crypto.getRandomValues(b);
                var hex = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
                rel.value = hex;
                rel.defaultValue = hex;
            }

            // FT-SO-29 (casilla) y FT-SO-23 (tipo «Pruebas Especiales», respuesta de SM 20-oct-2026): cada uno
            // muestra sus campos; la fecha de realizacion de la prueba arranca en hoy.
            function hoyIso() {
                var d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

                var pruebas = f.tipoConsulta.value === 'pruebas_especiales';
                document.getElementById('pruebaWrap').style.display = pruebas ? '' : 'none';

            // Varios medicamentos por pase (SM 20-oct-2026): un renglon por medicamento, mismos nombres de campo
            // (el servidor los recibe como listas en el mismo orden). Se arma con DOM, sin plantilla Thymeleaf.
            window.medAgregarFila = function () {
                var cont = document.getElementById('medFilas');
                if (!cont) { return; }
                var fila = document.createElement('div');
                fila.className = 'row g-2 med-fila mb-2';
                // OJO: arreglo de objetos, nunca dos corchetes de apertura seguidos en este script (Thymeleaf
                // los toma como expresion inline, incluso en comentarios, y rompe TODO el script de la pagina)
                var campos = [
                    { nombre: 'medMedicamento', etiqueta: 'Medicamento', col: 'col-md-4', ejemplo: 'Paracetamol' },
                    { nombre: 'medGramaje', etiqueta: 'Gramaje', col: 'col-md-2', ejemplo: '500 mg' },
                    { nombre: 'medDuracion', etiqueta: 'Duración (días)', col: 'col-md-2', ejemplo: '5' },
                    { nombre: 'medFrecuencia', etiqueta: 'Frecuencia', col: 'col-md-3', ejemplo: 'Cada 8 horas' }
                ];
                campos.forEach(function (c) {
                    var col = document.createElement('div');
                    col.className = c.col;
                    var lbl = document.createElement('label');
                    lbl.className = 'form-label fs-sm mb-1';
                    lbl.textContent = c.etiqueta;
                    var inp = document.createElement('input');
                    inp.type = c.nombre === 'medDuracion' ? 'number' : 'text';
                    if (c.nombre === 'medDuracion') { inp.min = '1'; }
                    inp.className = 'form-control form-control-sm';
                    inp.name = c.nombre;
                    inp.placeholder = c.ejemplo;
                    inp.addEventListener('input', function () { inp.classList.remove('is-invalid'); });
                    col.appendChild(lbl);
                    col.appendChild(inp);
                    fila.appendChild(col);
                });
                var colQuitar = document.createElement('div');
                colQuitar.className = 'col-md-1 d-flex align-items-end';
                var quitar = document.createElement('button');
                quitar.type = 'button';
                quitar.className = 'btn btn-sm btn-outline-danger';

            // FT-SO-25 Carta compromiso (20-oct-2026): se ve con dictamen condicionado o restringido y se HABILITA
            // solo cuando ese dictamen ya esta guardado (data-guardado del select, que guardarExamen actualiza).
            function exCartaAplica(v) { return v === 'apto_condicionado' || v === 'apto_restringido'; }
            window.exCartaVisible = function (sel) {
                var carta = sel.parentElement.querySelector('.ex-carta');
                if (!carta) { return; }
                var elegido = sel.value;
                var guardado = sel.getAttribute('data-guardado') || '';
                var habilitado = exCartaAplica(elegido) && elegido === guardado;
                carta.classList.toggle('d-none', !exCartaAplica(elegido));
                var btn = carta.querySelector('.ex-carta-btn');
                if (btn) { btn.disabled = !habilitado; }
                var aviso = carta.querySelector('.ex-carta-aviso');
                if (aviso) { aviso.textContent = habilitado ? 'Sale con el dictamen guardado.' : 'Guarda el examen para habilitar la carta.'; }
                var res = carta.querySelector('.ex-carta-res');

            // Al dejar condicionado o restringido, Observaciones trae la condicion a cumplir (la que imprime la

            // con Apto y un cambio accidental perderia lo escrito; se pregunta junto al campo (20-oct-2026).
            window.exObsDictamen = function (sel) {
                var previo = sel.hasAttribute('data-previo') ? sel.getAttribute('data-previo') : (sel.getAttribute('data-guardado') || '');
                sel.setAttribute('data-previo', sel.value);
                var form = sel.closest('form') || document;

                if (!exCartaAplica(previo) || exCartaAplica(sel.value) || !obs.value.trim()) { return; }

                caja.addEventListener('click', function (ev) {
                    var r = ev.target.getAttribute('data-r');

                    caja.remove();

                obs.insertAdjacentElement('afterend', caja);

            // FT-SO-31 (20-oct-2026): pagina propia con la captura de aptitudes y el formato
            window.exAbrirCertificacion = function () {
                var nssEl = document.querySelector('#datosGeneralesExamenForm input[name="nss"]') || document.getElementById('nssInput');
                var nss = nssEl ? (nssEl.value || '').trim() : '';

            // La pestana se abre en el clic (despues de un await el navegador la bloquea); si el servidor no
            // permite la carta, se cierra y el motivo se muestra junto al boton.
            // pintarResultadoInline cambia las clases del elemento: se pinta en uno interno para no perder .ex-carta-res
            function exCartaMsj(res) { res.innerHTML = '<span></span>'; return res.firstChild; }
            window.exImprimirCarta = async function (btn) {
                var nssEl = document.querySelector('#datosGeneralesExamenForm input[name="nss"]') || document.getElementById('nssInput');
                var nss = nssEl ? (nssEl.value || '').trim() : '';
                var res = btn.closest('.ex-carta').querySelector('.ex-carta-res');
                if (!nss) { return; }
                var ventana = null;

                if (ventana) { ventana.document.write('<p style="font:14px system-ui;padding:24px">Generando la carta compromiso…</p>'); }
                try {
                    var r = await fetch(contextPath + 'api/nss/examen/carta-compromiso/validar?nss=' + encodeURIComponent(nss), { headers: { 'Accept': 'text/plain' } });
                    var txt = await r.text();
                    if (!r.ok) {
                        if (ventana) { ventana.close(); }
                        pintarResultadoInline(exCartaMsj(res), txt, true);
                        return;
                    }
                    var url = contextPath + 'api/nss/examen/carta-compromiso?nss=' + encodeURIComponent(nss) + '&auto=1';
                    if (ventana) { ventana.location.href = url; } else { window.open(url, '_blank'); }
                    res.textContent = '';
                } catch (e) {
                    if (ventana) { ventana.close(); }

                }
            };

            // Selector del tipo arriba (20-oct-2026): mueve el de Datos generales y acomoda el modulo.
            window.exTipoDesdeArriba = function (arriba) {
