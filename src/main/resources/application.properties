spring.profiles.active=local
spring.application.name=portal-salud
server.port=8080
server.servlet.context-path=/

# Charset UTF-8 expl\u00c3\u00adcito en respuestas HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Estrategia de nombres para forzar snake_case en Oracle 21c
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Configuraci\u00f3n estricta de DDL (Usa Flyway para migrar, Hibernate solo valida)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dialecto optimizado para Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Web service ORDS legacy (biows). Referencia: php-old/app/app.php
# NOTA: portal.biows.api-key en php-old aparece enmascarada como "XXXXXX"; definir el valor real por entorno.
portal.biows.base-url=http://10.249.249.3/biows/ords/security
portal.biows.api-key=XXXXXX
portal.biows.aplicacion-id=Biometrico
portal.biows.id-aplicacion=4
# id_app del portal para login/permisos de menu (validateModules). En php-old es '13'.
portal.biows.app-id=13

# Estrategia de autenticacion (U08): JAVA | LEGACY_PHP | HYBRID
# HYBRID: intenta primero la BD local (seed admin) y, si falla, valida contra el
# login ORDS (registro_app). Necesario para que el usuario logueado sea conocido
# por el ORDS y validateModules devuelva sus modulos (menu lateral).
portal.auth.strategy=HYBRID

# Observabilidad / hardening (U11)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.pattern.level=%5p [trace=%X{traceId:-}]

# Sesion: timeout ampliado (media jornada). Reduce los 403/CSRF por inactividad
# (antes 30 min por defecto). Al expirar, el front redirige a /login?expired.
server.servlet.session.timeout=4h

# Adjuntos del expediente: limite de subida
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# Almacenamiento de archivos (contrato de arquitectura: metadatos en BD +
# binario en filesystem). Raiz por entorno; el binario se guarda bajo
# <root>/yyyy/MM/dd/<2 del sha256>/<uuid>.<ext>. Definir una ruta valida por ambiente.
portal.files.root=C:/portal-salud/files

# Cache-control para recursos est\u00c3\u00a1ticos (CSS, JS, im\u00c3\u00a1genes del tema)
# Estrategia de versionado por contenido para cache busting autom\u00c3\u00a1tico
# Las expresiones @{} de Thymeleaf generan URLs con hash del contenido (ej: /css/login-abc123.css)
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true
