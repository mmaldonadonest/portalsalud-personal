# Default DELIBERADAMENTE INOFENSIVO: el Oracle de la maquina de desarrollo.
#
# Si este valor fuera "prod", un WAR que no encuentre su configuracion externa
# intentaria conectarse a BIOMETRICO@PDBPRD con la contrasena vacia - que es
# justo lo que bloqueo la cuenta el 27-sep. Fallar hacia local es inofensivo;
# fallar hacia produccion no.
#
# Cada ambiente define su perfil por fuera: en el Tomcat, con
# spring.profiles.active en config/application.properties.
# Lo llena Maven al empaquetar (pom.xml <portal.perfil>): local por defecto, prod con -Pprod.
spring.profiles.active=@portal.perfil@
spring.application.name=portal-salud
server.port=8080
server.servlet.context-path=/

portal.permissions.shadow=false
portal.permissions.source=LOCAL

# Fuente del historico de Excel en las graficas de Analisis.
#   BITACORA = carga vieja por nombre (SERV_MED_BITACORA_*). Default: no cambia nada.
#   XLS      = tablas nuevas por NSS (SERV_MED_XLS_*) para atenciones, examenes, incapacidades y
#              accidentes; antidoping, maternidad y consumibles siguen en la carga vieja.
#   VISTA    = lo mismo que XLS pero leido de las vistas SERV_MED_V_* (excel-nss-05-vistas.sql),
#              que ademas aplican "manda el portal" al leer. Requiere las vistas creadas.
# Se cambia a XLS/VISTA solo en la activacion (paso 9 del plan), con la foto inicial ya cargada.
# 14-oct-2026, decision del usuario: VISTA. La carga vieja por nombre ya no sirve; las graficas
# muestran solo el portal + lo cargado por NSS. Para volver a la carga vieja: BITACORA.
portal.historico.fuente=VISTA

# Charset UTF-8 expl\u00c3\u00adcito en respuestas HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Estrategia de nombres para forzar snake_case en Oracle 21c
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Configuraci\u00f3n estricta de DDL (Usa Flyway para migrar, Hibernate solo valida)
spring.jpa.hibernate.ddl-auto=validate

# --- Pool de conexiones: fallar al PRIMER intento, nunca insistir ------------
# Incidente del 27-sep-2026: un arranque con la contrasena mal BLOQUEO la cuenta
# BIOMETRICO en produccion (ORA-01017 y despues ORA-28000).
#
# La causa no fue que Tomcat reintentara: fueron los defaults de Hikari. El pool
# se llena al arrancar hasta minimum-idle, y minimum-idle por defecto vale lo
# mismo que maximum-pool-size, que son 10. Es decir, UN arranque con credencial
# mala son hasta 10 intentos de login, y el perfil DEFAULT de Oracle bloquea la
# cuenta exactamente a los 10.
#
#   minimum-idle=0              el pool arranca VACIO: las conexiones se abren
#                               cuando se necesitan, no al desplegar
#   initialization-fail-timeout=1  Hikari prueba UNA conexion y si falla aborta;
#                               no insiste durante connection-timeout
#   connection-timeout=5000     5 s en vez de los 30 s por defecto: si la base no
#                               responde, se sabe rapido
#
# Resultado: un arranque fallido = UN intento de login, no diez.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.connection-timeout=5000

spring.jpa.open-in-view=false

# Metadata tabla-por-tabla en vez de un solo DatabaseMetaData.getColumns() agrupado.
# ONEWMS_QA es un esquema compartido con muchos objetos/sinonimos de otros sistemas
# (WMS, etc.) - la estrategia GROUPED (default) escanea el diccionario completo en
# esa consulta y puede colgarse varios minutos al validar el esquema en el arranque.
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually

# Dialecto optimizado para Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

