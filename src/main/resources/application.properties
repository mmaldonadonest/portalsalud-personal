# SSO del launcher (POST /sso/login, ver SsoLoginController). Vacio a proposito: sin estos
# valores el bean JwtDecoder no se crea (SsoJwtConfiguration es @ConditionalOnProperty) y el
# endpoint responde "no configurado" en vez de tronar el arranque. Llenar por ambiente cuando
# se tengan los valores reales del IdP (jwks_uri: endpoint publico de llaves; issuer_uri: el
# "iss" que el IdP firma en cada token).
portal.sso.jwks-uri=https://sso.onestcloud.mx/sso/.well-known/jwks.json
portal.sso.issuer-uri=https://sso.onestcloud.mx/sso

# Estrategia de autenticacion (U08): JAVA | LEGACY_PHP | HYBRID
# HYBRID: intenta primero la BD local (seed admin) y, si falla, valida contra el
# login ORDS (registro_app). Necesario para que el usuario logueado sea conocido
# por el ORDS y validateModules devuelva sus modulos (menu lateral).
portal.auth.strategy=LEGACY_PHP

# Observabilidad / hardening (U11)
# Pagina de error propia (templates/error.html): muestra el mensaje del error (sendError /
# ResponseStatusException) pero nunca el stacktrace.
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-exception=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.pattern.level=%5p [trace=%X{traceId:-}]

# Sesion: timeout ampliado (media jornada). Reduce los 403/CSRF por inactividad
# (antes 30 min por defecto). Al expirar, el front redirige a /login?expired.
server.servlet.session.timeout=4h

# Adjuntos del expediente: limite de subida
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

# Almacenamiento de archivos (contrato de arquitectura: metadatos en BD +
# binario en filesystem). Raiz por entorno; el binario se guarda bajo
# <root>/yyyy/MM/dd/<2 del sha256>/<uuid>.<ext>. Definida por perfil (ver
# application-local.properties / application-prod.properties), igual que
# spring.datasource.* - no hay un default valido que sirva para todos los ambientes.
#cambio prueba
# Cache-control para recursos est\u00c3\u00a1ticos (CSS, JS, im\u00c3\u00a1genes del tema)
# Estrategia de versionado por contenido para cache busting autom\u00c3\u00a1tico
# Las expresiones @{} de Thymeleaf generan URLs con hash del contenido (ej: /css/login-abc123.css)
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true

# --- Integracion OCR (docs/integracion-ocr-examen-inicial.md) -------------------
# Las llena Maven: -Pqa (config/produccion/portal-salud-qa.local.properties) o -Pprod
# (config/produccion/portal-salud.local.properties). Sin perfil quedan vacias y la API
# /api/integracion/** responde 401 a todo. callback-url: a donde avisar si la solicitud no
# trae callbackUrl; los dias de caducidad son los acordados con OCR.
portal.integracion.ocr.api-key=@ocr.apikey@
portal.integracion.ocr.hmac-secret=@ocr.hmac.secret@
# callback-url: la mete Maven como las llaves. Antes aceptaba la variable OCR_CALLBACK_URL del
# servidor (5-oct); desde el 19-oct-2026 el WAR es autosuficiente y no lee variables de entorno:
# si la URL del webhook cambia, se cambia en el .local.properties y se rearma el WAR.
portal.integracion.ocr.callback-url=@ocr.callback.url@
portal.integracion.ocr.caducidad-dias=30

# --- Formatos de Salud Ocupacional para imprimir (20-oct-2026) -------------------
# Medico responsable que firma todos los formatos (pedido de Servicio Medico). Su FIRMA no va
# aqui ni en el WAR: es un dato sensible; la registra el en "Mi firma digitalizada" (modulo de firmas)
# y se busca por su usuario del portal. Sin firma vigente, los impresos salen con la linea a mano.
# (ó = o con acento: Spring lee los .properties en ISO-8859-1)
portal.formatos.medico-responsable.nombre=Dr. Mauricio Cer\u00f3n Solana
portal.formatos.medico-responsable.cedula=5154089
portal.formatos.medico-responsable.usuario=68958027838

# --- Firmas digitalizadas (20-oct-2026) -----------------------------------------
# Roles que imprimen CON firma, separados por coma (ej. MEDICO,ENFERMERIA). VACIO = todos los que ya
# imprimen (decision del usuario 20-oct-2026). Un rol fuera de la lista imprime con la linea a mano.
portal.firmas.roles=
# La LLAVE de cifrado NO va aqui ni en ningun properties: solo en la variable de ambiente
# PORTAL_FIRMAS_LLAVE del servidor (32 bytes en Base64). Sin ella, las firmas quedan apagadas.

# Centro de ayuda / chat de ayuda (db/sql/app_domain/ayuda.sql, docker/ayuda/). El contenido
# vive en Oracle; Meilisearch (Docker, solo en 127.0.0.1) es el buscador y es opcional: si no
# responde, se busca con LIKE en Oracle. La llave entra al WAR por Maven como las de OCR.
portal.ayuda.meili.url=http://127.0.0.1:7700
portal.ayuda.meili.key=@meili.key@
portal.ayuda.meili.indice=ayuda
# false = sin boton "?" ni menu Ayuda para los usuarios (decision 6-oct: se oculta hasta tener
# contenido revisado). El admin sigue viendo /admin/ayuda para ir cargando articulos.
portal.ayuda.visible=false
