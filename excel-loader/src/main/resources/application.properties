# portal-salud-excel-loader
#
# Proceso de consola. Nada se ejecuta solo: con excel.modo=none arranca, no hace
# nada y termina. Misma disciplina que el proyecto etl/.
#
# NINGUNA CREDENCIAL VA EN ESTE ARCHIVO. Se pasan por variable de entorno o por
# linea de comandos, igual que en etl/. Ver docs/script-prod/excel-00-ddl-completo.sql
# para el esquema destino.

spring.main.banner-mode=off
spring.main.web-application-type=none

# --- Que hacer -----------------------------------------------------------
#   none        no hace nada (default)
#   inventario  recorre el origen y reporta que hay. NO toca la base.
excel.modo=${EXCEL_MODO:none}

# Carpeta a recorrer. Sin default a proposito: hay que decirla.
excel.origen=${EXCEL_ORIGEN:}

# Anio a cargar. La directiva vigente es 2026, de enero a la fecha.
# El anio de cada archivo se toma de su CONTENIDO, nunca de la carpeta.
excel.anio=${EXCEL_ANIO:2026}

# --- Destino (solo lo usan los modos que escriben) -----------------------
# La autoconfiguracion del DataSource esta EXCLUIDA en ExcelLoaderApplication,
# asi que el modo inventario no puede conectarse a la base ni por accidente.
#   en QA         -> ONEWMS_QA
#   en produccion -> BIOMETRICO
excel.destino.url=${EXCEL_TARGET_URL:}
excel.destino.usuario=${EXCEL_TARGET_USER:}
excel.destino.password=${EXCEL_TARGET_PASSWORD:}

# Carpeta con tnsnames.ora. Solo hace falta si la URL usa un alias corto
# (jdbc:oracle:thin:@PDBPRD). Con la direccion completa no se necesita.
# NO sustituye a usuario y contrasena.
excel.destino.tns=${EXCEL_TARGET_TNS:}

# Carpeta con cwallet.sso. Si el wallet guarda las credenciales del alias (SEPS),
# el usuario y la contrasena se dejan VACIOS y los toma el driver.
excel.destino.wallet=${EXCEL_TARGET_WALLET:}

# --- Bitacora ------------------------------------------------------------
logging.level.root=WARN
logging.level.com.onest.excel=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %msg%n

# POI es ruidoso con los archivos viejos: avisa de formatos raros que no
# afectan la lectura. Los errores de verdad los reporta el inventario.
logging.level.org.apache.poi=ERROR
