spring:
  application:
    name: portal-salud-ocupacional

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salud_ocupacional}
    username: ${DB_USER:salud_admin}
    password: ${DB_PASSWORD:salud_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      # Nunca 'update': el esquema lo gobierna Flyway
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: true
    encoding: UTF-8

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: never
  compression:
    enabled: true

portal:
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-en-produccion-minimo-32-caracteres}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    issuer: portal-salud-ocupacional
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    mx.saludocupacional.portal: INFO
