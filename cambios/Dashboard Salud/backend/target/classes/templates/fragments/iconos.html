<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Repertorio de iconos.

  Se dibujan como trazos vectoriales para que hereden el color del texto y se
  vean nítidos en cualquier tamaño. Se invocan por nombre desde cualquier vista.
-->
<th:block th:fragment="icono(nombre)">
  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
    <th:block th:switch="${nombre}">
      <th:block th:case="'escudo'">
        <path d="M12 2 3 7v6c0 5 4 8.5 9 9 5-.5 9-4 9-9V7l-9-5Z"/><path d="M12 8v6M9 11h6"/>
      </th:block>
      <th:block th:case="'persona'">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
      </th:block>
      <th:block th:case="'reloj'">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
      </th:block>
      <th:block th:case="'alerta'">
        <path d="M10.3 3.86 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.86a2 2 0 0 0-3.4 0Z"/>
        <path d="M12 9v4M12 17h.01"/>
      </th:block>
      <th:block th:case="'documento'">
        <rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>
      </th:block>
      <th:block th:case="'dinero'">
        <path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </th:block>
      <th:block th:case="'tendencia'">
        <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-4 4"/>
      </th:block>
      <th:block th:case="'barras'">
        <path d="M4 19V5M4 19h16M8 19v-7M12 19v-11M16 19v-5"/>
      </th:block>
      <th:block th:case="'dona'">
        <path d="M21 12a9 9 0 1 1-9-9v9Z"/><path d="M12 3a9 9 0 0 1 9 9h-9Z"/>
      </th:block>
      <th:block th:case="'edificio'">
        <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>
      </th:block>
      <th:block th:case="'matraz'">
        <path d="M9 2h6M10 2v5.5L5 16a3 3 0 0 0 2.6 4.5h8.8A3 3 0 0 0 19 16l-5-8.5V2"/>
      </th:block>
      <th:block th:case="'caja'">
        <path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/>
      </th:block>
      <th:block th:case="'corazon'">
        <path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5c2 0 3.5 1.5 5.5 4 2-2.5 3.5-4 5.5-4C21 5 23.5 8.5 21.5 12.5 19 16.65 12 21 12 21Z"/>
      </th:block>
      <th:block th:case="'palomita'">
        <path d="m20 6-11 11-5-5"/>
      </th:block>
      <th:block th:case="'informacion'">
        <circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>
      </th:block>
      <th:block th:case="'destello'">
        <path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/>
      </th:block>
      <th:block th:case="'mas'">
        <path d="M12 5v14M5 12h14"/>
      </th:block>
      <th:block th:case="'descarga'">
        <path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/>
      </th:block>
      <th:block th:case="*">
        <circle cx="12" cy="12" r="9"/>
      </th:block>
    </th:block>
  </svg>
</th:block>

</body>
</html>
