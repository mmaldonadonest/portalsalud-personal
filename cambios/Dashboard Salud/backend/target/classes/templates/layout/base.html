<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${titulo} + ' — Portal Salud Ocupacional'">Portal Salud Ocupacional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/portal.css}">
  <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script th:src="@{/js/portal.js}" defer></script>
  <th:block th:replace="${scripts} ?: ~{}"></th:block>
</head>
<body>
<a href="#main" class="skip">Saltar al contenido principal</a>

<div class="app">
  <aside th:replace="~{layout/sidebar :: sidebar(${vista})}"></aside>

  <main>
    <div th:replace="~{layout/topbar :: topbar}"></div>
    <div class="main" id="main" tabindex="-1">
      <th:block th:replace="${contenido}"></th:block>
    </div>
  </main>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true">
  <div class="modal" id="mdl"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
