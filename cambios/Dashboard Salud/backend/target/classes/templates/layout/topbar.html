<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Barra superior: búsqueda, alertas y cuenta. -->
<div class="top" th:fragment="topbar">
  <button class="burger" id="bg" aria-label="Abrir menú" aria-expanded="false" aria-controls="sb">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>

  <div class="srch" role="search">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
    </svg>
    <input id="q" placeholder="Buscar colaborador o predio…" aria-label="Búsqueda" autocomplete="off">
  </div>

  <div class="top-r">
    <a th:href="@{/inventario}" class="ibtn" title="Alertas de inventario" aria-label="Alertas de inventario">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
      </svg>
      <span class="pip" id="pipAlertas" hidden>0</span>
    </a>

    <form th:action="@{/logout}" method="post" style="display:contents">
      <button type="submit" class="ibtn" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>
        </svg>
      </button>
    </form>

    <span class="av" sec:authentication="name"
          th:title="${#authentication.principal.usuario.nombre}"
          th:text="${#strings.substring(#authentication.principal.usuario.nombre, 0, 2)}">JA</span>
  </div>
</div>

</body>
</html>
