<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portal Salud Ocupacional — Dashboard Ejecutivo 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portal Integral de Salud Ocupacional — dashboard ejecutivo de morbilidad, incapacidades, accidentabilidad, exámenes médicos, antidoping y maternidad.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%231D4ED8'/><path d='M12 5 6 8.5v4c0 3.3 2.6 5.7 6 6.2 3.4-.5 6-2.9 6-6.2v-4L12 5Z' fill='none' stroke='white' stroke-width='1.6'/><path d='M9.5 12l1.7 1.7L15 10' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
/* ===== TOKENS ===================================================== */
:root{
  --brand:#1D4ED8; --brand-700:#1E40AF; --brand-400:#60A5FA; --brand-50:#EFF6FF;
  --ink:#0B1220; --ink-2:#334155; --ink-3:#64748B;
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#F8FAFC;
  --line:#E5E9F0; --line-2:#CBD5E1;
  --ok:#047857; --ok-bg:#ECFDF5; --danger:#B91C1C; --danger-bg:#FEF2F2;
  --warn:#B45309; --warn-bg:#FFFBEB; --info:#0E7490; --info-bg:#ECFEFF;
  --violet:#6D28D9; --violet-bg:#F5F3FF; --pink:#BE185D; --pink-bg:#FDF2F8; --steel:#475569;
  --ink-inv:#F8FAFC;
  --nav:#0B1220; --nav-2:#16233B; --nav-txt:#A8B8D0;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --f-xs:10.5px; --f-sm:11.5px; --f-md:12.5px; --f-base:13.5px; --f-lg:15px; --f-xl:20px; --f-2xl:24px;
  --r-sm:7px; --r:10px; --r-lg:14px; --r-full:999px;
  --e1:0 1px 2px rgba(11,18,32,.05);
  --e2:0 1px 3px rgba(11,18,32,.07),0 1px 2px rgba(11,18,32,.04);
  --e3:0 8px 24px rgba(11,18,32,.09),0 2px 6px rgba(11,18,32,.05);
  --e4:0 20px 48px rgba(11,18,32,.16);
  --t:.18s cubic-bezier(.2,.8,.3,1);
  --z-nav:30; --z-drawer:45; --z-modal:50; --z-toast:60;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Fira Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--f-base);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.num{font-family:'Fira Code',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
svg.ic{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r-sm)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:var(--r-full);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}
::selection{background:var(--brand-400);color:#fff}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:var(--s4);top:-60px;z-index:100;background:var(--brand);color:#fff;padding:10px 18px;border-radius:var(--r);font-weight:600;font-size:var(--f-md);transition:top var(--t);text-decoration:none}
.skip:focus{top:var(--s3)}

/* ===== LAYOUT ===================================================== */
.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.sb{background:linear-gradient(175deg,var(--nav) 0%,var(--nav-2) 100%);position:sticky;top:0;height:100vh;overflow-y:auto;padding:var(--s4) 0 var(--s6);z-index:var(--z-drawer);scrollbar-width:thin}
.sb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);background-clip:content-box}
.brand{display:flex;align-items:center;gap:10px;padding:0 var(--s5) var(--s4);border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:var(--s2)}
.brand .mk{width:31px;height:31px;border-radius:9px;background:linear-gradient(135deg,var(--brand-400),var(--ok));display:grid;place-items:center;flex-shrink:0;box-shadow:0 2px 8px rgba(96,165,250,.3)}
.brand .mk svg{width:17px;height:17px;stroke:#fff;stroke-width:2.1}
.brand b{color:#fff;font-size:var(--f-md);font-weight:600;letter-spacing:.25px;line-height:1.3}
.grp{padding:var(--s4) var(--s5) var(--s1);font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:#5C6E8A;font-weight:600}
.sb a{display:flex;align-items:center;gap:10px;padding:8px var(--s5);color:var(--nav-txt);text-decoration:none;font-size:var(--f-md);border-left:3px solid transparent;cursor:pointer;transition:background var(--t),color var(--t),border-color var(--t);min-height:36px;position:relative}
.sb a .ic{width:15px;height:15px;opacity:.75;transition:opacity var(--t),color var(--t)}
.sb a:hover{background:rgba(255,255,255,.055);color:#fff}
.sb a:hover .ic{opacity:1}
.sb a[aria-current="page"]{background:linear-gradient(90deg,rgba(96,165,250,.2),rgba(96,165,250,.04));color:#fff;border-left-color:var(--brand-400);font-weight:500}
.sb a[aria-current="page"] .ic{opacity:1;color:var(--brand-400)}
.sb a:focus-visible{outline-offset:-2px}
.sbx{display:none}

.top{position:sticky;top:0;z-index:var(--z-nav);background:rgba(244,246,250,.88);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);padding:10px var(--s6);display:flex;align-items:center;gap:var(--s3)}
.burger{display:none;width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);place-items:center;cursor:pointer;color:var(--ink);transition:background var(--t)}
.burger:hover{background:var(--surface-2)}
.srch{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 11px;color:var(--ink-3);position:relative;transition:border-color var(--t),box-shadow var(--t)}
.srch:focus-within{border-color:var(--brand-400);box-shadow:0 0 0 3px rgba(96,165,250,.16)}
.srch input{border:0;outline:0;background:transparent;font-size:var(--f-md);flex:1;color:var(--ink);min-width:0}
.srch input::placeholder{color:var(--ink-3)}
.sres{position:absolute;top:calc(100% + 7px);left:-1px;right:-1px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--e3);overflow:hidden;display:none;max-height:300px;overflow-y:auto;z-index:var(--z-nav)}
.sres.on{display:block}
.sres .hd{padding:7px 12px;font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);background:var(--surface-2);font-weight:600}
.sres button{display:flex;width:100%;justify-content:space-between;gap:10px;padding:9px 12px;font-size:var(--f-md);color:var(--ink);background:none;border:0;border-top:1px solid var(--surface-2);cursor:pointer;text-align:left;transition:background var(--t)}
.sres button:hover,.sres button:focus-visible{background:var(--brand-50)}
.sres button span{color:var(--ink-3);font-size:var(--f-sm);flex-shrink:0}
.top-r{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.ibtn{position:relative;width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:background var(--t),color var(--t)}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn .pip{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:var(--r-full);background:var(--danger);border:2px solid var(--bg);color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;line-height:1;font-family:'Fira Code',monospace}
.av{width:36px;height:36px;border-radius:var(--r-full);background:linear-gradient(135deg,var(--brand-700),var(--brand-400));color:#fff;display:grid;place-items:center;font-weight:600;font-size:var(--f-md);cursor:pointer;border:0;letter-spacing:.3px}

.main{padding:var(--s5) var(--s6) 64px;max-width:1760px}
.view{animation:in .28s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.crumb{font-size:var(--f-sm);color:var(--ink-3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.crumb button{background:none;border:0;color:var(--brand);cursor:pointer;font-size:inherit;padding:0}
.crumb button:hover{text-decoration:underline}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.head h1{font-size:var(--f-xl);font-weight:600;letter-spacing:-.3px;line-height:1.25;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.head p{color:var(--ink-2);font-size:var(--f-md);margin-top:3px;max-width:76ch}
.acts{display:flex;gap:var(--s2);flex-wrap:wrap}
.btn{background:var(--brand);color:#fff;border:1px solid transparent;padding:8px 15px;border-radius:var(--r-sm);font-size:var(--f-md);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--e1);transition:background var(--t),box-shadow var(--t),transform var(--t);min-height:36px;white-space:nowrap}
.btn:hover{background:var(--brand-700);box-shadow:var(--e2);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn .ic{width:15px;height:15px}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line-2)}
.btn.sm{padding:5px 11px;font-size:var(--f-sm);min-height:30px}

.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px var(--s4);display:flex;gap:var(--s3);flex-wrap:wrap;align-items:flex-end;margin-bottom:var(--s4);box-shadow:var(--e1)}
.ff{display:flex;flex-direction:column;gap:4px}
.ff label{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3);font-weight:600}
.ff select,.ff input{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-width:140px;cursor:pointer;color:var(--ink);min-height:34px;font-size:var(--f-md);transition:border-color var(--t),box-shadow var(--t)}
.ff select:hover,.ff input:hover{border-color:var(--line-2)}
.ff select:focus,.ff input:focus{border-color:var(--brand-400);box-shadow:0 0 0 3px rgba(96,165,250,.16)}
.chip{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:var(--f-sm);color:var(--warn);background:var(--warn-bg);border:1px solid #FDE68A;padding:6px 12px;border-radius:var(--r-full);font-weight:500}
.chip .ic{width:14px;height:14px}

/* ===== KPI ======================================================== */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1560px){.kpis,.kpis.k5,.kpis.k4{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.kpis,.kpis.k5,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px var(--s4) var(--s4);position:relative;overflow:hidden;box-shadow:var(--e1);transition:box-shadow var(--t),transform var(--t),border-color var(--t);text-align:left;width:100%;display:block;border-top:3px solid var(--c,var(--brand))}
button.kpi{cursor:pointer;font:inherit}
button.kpi:hover{box-shadow:var(--e3);transform:translateY(-2px);border-color:var(--line-2)}
.kpi .ico{width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--cb,var(--brand-50));color:var(--c,var(--brand));margin-bottom:9px}
.kpi .ico .ic{width:16px;height:16px}
.kpi .lb{font-size:var(--f-sm);color:var(--ink-2);font-weight:500;line-height:1.35}
.kpi .vl{font-size:var(--f-2xl);font-weight:600;letter-spacing:-.7px;margin:2px 0 6px;line-height:1.1;color:var(--ink)}
.kpi .dl{font-size:var(--f-xs);font-weight:600;display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:var(--r-full)}
.up{color:var(--danger);background:var(--danger-bg)}
.dn{color:var(--ok);background:var(--ok-bg)}
.eq{color:var(--ink-2);background:var(--surface-2)}
.kpi .s2{font-size:var(--f-xs);color:var(--ink-3);margin-top:5px;line-height:1.4}

/* ===== PANELS ===================================================== */
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--s3);margin-bottom:var(--s3)}
.g2b{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s3)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s3)}
@media(max-width:1240px){.g2,.g2b,.g3{grid-template-columns:minmax(0,1fr)}}
.pnl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);box-shadow:var(--e1);min-width:0}
.pnl h2{font-size:var(--f-lg);font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:-.15px;line-height:1.3}
.pnl h2 .ic{width:16px;height:16px;color:var(--brand);flex-shrink:0}
.pnl .sub{font-size:var(--f-sm);color:var(--ink-3);margin-top:2px;line-height:1.45}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s3)}
.pnl>h2+.sub{margin-bottom:var(--s3)}
.cw{position:relative;height:252px}
.cw.sm{height:208px}.cw.lg{height:300px}.cw.xl{height:500px}

.tabs{display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px}
.tabs button{border:0;background:transparent;padding:6px 12px;font-size:var(--f-sm);border-radius:5px;cursor:pointer;color:var(--ink-2);font-weight:500;transition:background var(--t),color var(--t),box-shadow var(--t);min-height:30px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--e1);font-weight:600}

/* ===== TABLE ====================================================== */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--s4) * -1);padding:0 var(--s4)}
table{width:100%;border-collapse:collapse;font-size:var(--f-md)}
caption{text-align:left;font-size:var(--f-sm);color:var(--ink-3);padding-bottom:var(--s2)}
th{text-align:left;padding:9px 11px;font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);font-weight:600;border-bottom:1.5px solid var(--line);white-space:nowrap;background:var(--surface)}
th.r,td.r{text-align:right}
th.srt{cursor:pointer;user-select:none;transition:color var(--t)}
th.srt:hover{color:var(--brand)}
th .ar{opacity:.3;font-size:8px;margin-left:3px}
th[aria-sort]:not([aria-sort="none"]){color:var(--brand)}
th[aria-sort]:not([aria-sort="none"]) .ar{opacity:1}
td{padding:9px 11px;border-bottom:1px solid var(--surface-2);color:var(--ink-2)}
td.nm{font-weight:500;color:var(--ink)}
tbody tr{transition:background var(--t)}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover td,tbody tr.clk:focus-within td{background:var(--brand-50)}
tbody tr:last-child td{border-bottom:0}
.bc{display:flex;align-items:center;gap:8px}
.bc .tr{flex:1;height:6px;background:var(--surface-2);border-radius:var(--r-full);overflow:hidden;min-width:46px}
.bc .fl{height:100%;border-radius:var(--r-full);background:var(--brand);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bc .pv{font-size:var(--f-xs);color:var(--ink-3);min-width:30px;text-align:right}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--f-xs);font-weight:600;padding:3px 9px;border-radius:var(--r-full);white-space:nowrap}
.tag::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag.plain::before{display:none}
.t-crit{color:var(--danger);background:var(--danger-bg)}
.t-alt{color:#C2410C;background:#FFF7ED}
.t-med{color:var(--warn);background:var(--warn-bg)}
.t-baj{color:var(--ok);background:var(--ok-bg)}
.t-inf{color:var(--brand);background:var(--brand-50)}
.t-neu{color:var(--steel);background:var(--surface-2)}
.t-vio{color:var(--violet);background:var(--violet-bg)}
.t-pnk{color:var(--pink);background:var(--pink-bg)}

/* ===== INSIGHTS =================================================== */
.ins{display:flex;flex-direction:column;gap:var(--s2)}
.ins .it{display:flex;gap:10px;padding:11px 13px;border-radius:var(--r-sm);font-size:var(--f-md);line-height:1.5;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.ins .it .ic{width:16px;height:16px;margin-top:1px;color:var(--brand)}
.ins .it b{font-weight:600;color:var(--ink)}
.ins .it.b{background:var(--danger-bg);border-color:#FECACA}.ins .it.b .ic{color:var(--danger)}
.ins .it.w{background:var(--warn-bg);border-color:#FDE68A}.ins .it.w .ic{color:var(--warn)}
.ins .it.g{background:var(--ok-bg);border-color:#A7F3D0}.ins .it.g .ic{color:var(--ok)}

.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:var(--s2)}
.mini .m{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 9px;text-align:center}
.mini .m .n{font-size:17px;font-weight:600;letter-spacing:-.4px;color:var(--ink)}
.mini .m .l{font-size:var(--f-xs);color:var(--ink-3);margin-top:2px;font-weight:500;line-height:1.3}

.note{margin-top:var(--s5);padding:11px var(--s4);background:var(--brand-50);border:1px solid #BFDBFE;border-radius:var(--r);font-size:var(--f-sm);color:#1E3A8A;display:flex;gap:10px;line-height:1.5}
.note .ic{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--brand)}
.note b{font-weight:600}

.empty{text-align:center;padding:40px var(--s5);color:var(--ink-3)}
.empty .ic{width:36px;height:36px;margin:0 auto 11px;color:var(--line-2);stroke-width:1.4}
.empty h3{font-size:var(--f-base);color:var(--ink);margin-bottom:4px;font-weight:600}
.empty p{font-size:var(--f-md);max-width:330px;margin:0 auto;line-height:1.5}

/* ===== MODAL / DRAWER / TOAST ===================================== */
.ov{position:fixed;inset:0;background:rgba(11,18,32,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:var(--z-modal);display:none;align-items:center;justify-content:center;padding:var(--s5)}
.ov.on{display:flex;animation:in .18s ease}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--e4);width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;animation:pop .22s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.mh{padding:var(--s4) var(--s5);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3)}
.mh h3{font-size:var(--f-lg);font-weight:600;letter-spacing:-.2px}
.mh p{font-size:var(--f-sm);color:var(--ink-3);margin-top:3px;line-height:1.45}
.mb{padding:var(--s5);overflow-y:auto}
.mf{padding:var(--s3) var(--s5);border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:var(--s2);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}

let lastFocus=null;
function modal(h){lastFocus=document.activeElement;const ov=document.getElementById('ov');
 document.getElementById('mdl').innerHTML=h;ov.classList.add('on');
 setTimeout(()=>ov.querySelector('input,select,textarea,button')?.focus(),70)}
function closeModal(){document.getElementById('ov').classList.remove('on');lastFocus?.focus()}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}
 if(e.key==='Tab'&&document.getElementById('ov').classList.contains('on')){
  const f=[...document.querySelectorAll('#mdl button,#mdl input,#mdl select,#mdl textarea')].filter(x=>!x.disabled);
  if(!f.length)return;const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

   const id='f_'+c.k, rq=c.req?' <span class="rq" aria-hidden="true">*</span>':'';
   const attrs=`id="${id}" name="${c.k}"${c.req?' required aria-required="true"':''}`;
   let ctl=c.tipo==='select'?`<select ${attrs}><option value="">Seleccionar…</option>${c.opts.map(o=>`<option>${o}</option>`).join('')}</select>`
    :c.tipo==='textarea'?`<textarea ${attrs} placeholder="${c.ph||''}"></textarea>`
    :`<input type="${c.tipo||'text'}" ${attrs} placeholder="${c.ph||''}"${c.min!=null?` min="${c.min}"`:''}>`;
   return `<div class="fld${c.full?' full':''}"><label for="${id}">${c.lb}${rq}</label>${ctl}
    ${c.hint?`<span class="hint">${c.hint}</span>`:''}
    <span class="err" role="alert"><svg class="ic" style="width:12px;height:12px" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>${c.msg||'Campo obligatorio'}</span></div>`}).join('')}</div></form></div>
  <div class="mf"><button class="btn ghost" data-x>Cancelar</button><button class="btn" id="ok">Guardar</button></div>`);
 const frm=document.getElementById('frm');
 document.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',closeModal));
 frm.querySelectorAll('input,select,textarea').forEach(el=>{
  el.addEventListener('blur',()=>{if(el.required)el.closest('.fld').classList.toggle('bad',!el.value.trim())});
  el.addEventListener('input',()=>{if(el.value.trim())el.closest('.fld').classList.remove('bad')})});
 document.getElementById('ok').addEventListener('click',()=>{
  let v=true;frm.querySelectorAll('[required]').forEach(el=>{const bad=!el.value.trim();el.closest('.fld').classList.toggle('bad',bad);if(bad)v=false});

const TT={exec:'Dashboard Ejecutivo',predio:'Vista por Predio',aten:'Atenciones',causas:'Causas',musc:'Musculoesqueléticas',
 em:'Exámenes Médicos',incap:'Incapacidades',accid:'Accidentabilidad',antid:'Antidoping',inv:'Inventario',mater:'Maternidad',
 emp:'Empleados',imp:'Importar',rep:'Reportes',aud:'Auditoría',admin:'Administración'};
function go(v){
 if(!V[v])v='exec';
 Object.keys(charts).forEach(k=>{charts[k].destroy();delete charts[k]});
 document.querySelectorAll('#nav a').forEach(a=>a.dataset.v===v?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 const c=document.getElementById('main');
 c.innerHTML=`<div class="view">${V[v]()}</div>`;
 V[v].init?.();
 c.querySelectorAll('[data-go]').forEach(el=>{
  el.addEventListener('click',()=>go(el.dataset.go));
  if(el.tagName!=='BUTTON'){el.setAttribute('role','button');el.tabIndex=0;
   el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(el.dataset.go)}})}});
 document.title=TT[v]+' — Portal Salud Ocupacional';
 closeSb();history.replaceState(null,'','#'+v);
 window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
document.querySelectorAll('#nav a').forEach(a=>{
 a.addEventListener('click',()=>go(a.dataset.v));
 a.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(a.dataset.v)}})});

/* ---------- Menú móvil / drawer ---------- */
const sb=document.getElementById('sb'),bgb=document.getElementById('bg'),drw=document.getElementById('drw'),alr=document.getElementById('alr');
const closeSb=()=>{sb.classList.remove('on');bgb.setAttribute('aria-expanded','false')};
bgb.addEventListener('click',()=>{sb.classList.add('on');bgb.setAttribute('aria-expanded','true');sb.querySelector('a')?.focus()});
document.getElementById('sbx').addEventListener('click',()=>{closeSb();bgb.focus()});
const closeDrawer=()=>{drw.classList.remove('on');drw.setAttribute('aria-hidden','true');alr.setAttribute('aria-expanded','false')};
alr.addEventListener('click',()=>{drw.classList.add('on');drw.setAttribute('aria-hidden','false');alr.setAttribute('aria-expanded','true');drw.querySelector('.al')?.focus()});
document.getElementById('drwx').addEventListener('click',()=>{closeDrawer();alr.focus()});
document.getElementById('alist').innerHTML=ALERTAS.map((a,i)=>{
 const col=a.t==='crit'?'var(--danger)':a.t==='warn'?'var(--warn)':'var(--brand)';
 return `<button class="al" data-i="${i}"><span class="dot" style="background:${col}"></span>
 <span><b>${a.ti}</b><p>${a.d}</p><time>${a.w}</time></span></button>`}).join('');
document.querySelectorAll('#alist .al').forEach(el=>el.addEventListener('click',()=>{
 const a=ALERTAS[+el.dataset.i];closeDrawer();if(a.p)pSel=a.p;go(a.v)}));

/* ---------- Búsqueda ---------- */
const IDX=[...Object.entries(TT).map(([v,t])=>({t,s:'Módulo',v})),
 ...D.predios.map(p=>({t:p.n,s:`${nf(p.a)} atenciones`,v:'predio',p:p.n})),
 ...D.causas.slice(0,12).map(c=>({t:c[0],s:`${nf(c[1])} atenciones`,v:'causas'}))];
const q=document.getElementById('q'),qr=document.getElementById('qr');
q.addEventListener('input',()=>{
 const s=q.value.trim().toLowerCase();
 if(s.length<2){qr.classList.remove('on');q.setAttribute('aria-expanded','false');return}
 const hits=IDX.filter(x=>x.t.toLowerCase().includes(s)).slice(0,8);
 qr.innerHTML=hits.length?'<div class="hd">Resultados</div>'+hits.map((h,i)=>`<button data-i="${i}" role="option">${h.t}<span>${h.s}</span></button>`).join('')
  :'<div class="hd">Sin resultados</div>';
 qr.classList.add('on');q.setAttribute('aria-expanded','true');
 qr.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  const h=hits[+b.dataset.i];if(h.p)pSel=h.p;go(h.v);qr.classList.remove('on');q.value='';q.setAttribute('aria-expanded','false')}))});
q.addEventListener('blur',()=>setTimeout(()=>{qr.classList.remove('on');q.setAttribute('aria-expanded','false')},170));
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();qr.querySelector('button')?.focus()}});

go((location.hash||'#exec').slice(1));
</script>
