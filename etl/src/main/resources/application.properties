# =============================================================================
# portal-salud-etl — configuracion. TODO por variable de entorno: este archivo viaja en
# GitHub, aqui NO van usuarios ni contraseñas (sintaxis ${VARIABLE:default}).
#
# ORIGEN  : MariaDB del legacy PHP  (servicioMedico.files / .tags)
# DESTINO : Oracle del portal (APP_FS_FILE, MED_TAG) + filesystem (portal.files.root)
#
# Ver README.md y docs/etl-migracion-historica-especificacion.md.
# =============================================================================
spring.application.name=portal-salud-etl
spring.main.banner-mode=off

# Los runners exigen el perfil "etl" (se conservo tal cual al separar el proyecto).
spring.profiles.active=etl

# --- DESTINO: Oracle del portal ---------------------------------------------
spring.datasource.url=${ETL_TARGET_URL:jdbc:oracle:thin:@//localhost:1521/PROYECTO_BASE_PDB}
spring.datasource.username=${ETL_TARGET_USER:}
spring.datasource.password=${ETL_TARGET_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Raiz del filesystem donde se escriben los binarios decodificados. DEBE ser la misma
# que usa el portal (portal.files.root), o este no encontrara los archivos migrados.
portal.files.root=${ETL_FILES_ROOT:C:/portal-salud/files}

# --- ORIGEN: MariaDB del legacy ----------------------------------------------
# utf8 obligatorio en la conexion (ver hallazgo de encoding en la spec).
etl.legacy.datasource.url=${ETL_SOURCE_URL:jdbc:mariadb://localhost:3306/servicioMedico?useUnicode=true&characterEncoding=UTF-8}
etl.legacy.datasource.username=${ETL_SOURCE_USER:}
etl.legacy.datasource.password=${ETL_SOURCE_PASSWORD:}
etl.legacy.datasource.driver-class-name=org.mariadb.jdbc.Driver

# --- Que se corre -------------------------------------------------------------
# none (default, no hace nada) | sample (subconjunto dirigido) | full (todo)
# Se pueden pasar por linea de comandos: --etl.files.mode=sample
etl.files.mode=${ETL_FILES_MODE:none}
etl.files.batch-size=${ETL_FILES_BATCH:200}

etl.tags.mode=${ETL_TAGS_MODE:none}
etl.tags.batch-size=${ETL_TAGS_BATCH:500}

# Log util durante la corrida (cada lote deja rastro).
logging.level.com.onest.app.catalog.file.etl=INFO
